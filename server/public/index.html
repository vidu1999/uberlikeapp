<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuickBite · live food delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --g:#2ECC71; --ink:#111; --muted:#6b7280; --line:#ececec; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Plus Jakarta Sans",system-ui,sans-serif; background:#fff; color:var(--ink); }
    .wrap { max-width: 480px; margin: 0 auto; padding: 28px 20px 48px; }
    .mark { font-size: 28px; font-weight: 800; letter-spacing: -0.04em; }
    .mark em { color: var(--g); font-style: normal; }
    h1 { font-size: 26px; letter-spacing: -0.03em; margin: 18px 0 8px; }
    p.lead { color: var(--muted); margin: 0 0 22px; line-height: 1.45; }
    .card { display:flex; gap:14px; align-items:center; padding:16px; border:1px solid var(--line); border-radius:18px; text-decoration:none; color:inherit; margin-bottom:12px; }
    .card:hover { border-color:#b6f0cf; background:#f7fff9; }
    .ico { width:48px; height:48px; border-radius:14px; display:grid; place-items:center; font-size:22px; background:#ecfdf3; }
    .card b { display:block; font-size:16px; }
    .card span { color: var(--muted); font-size:13px; }
    .row { display:flex; gap:10px; margin-top: 8px; }
    .row a { flex:1; text-align:center; padding:12px; border-radius:14px; background:#111; color:#fff; text-decoration:none; font-weight:700; font-size:13px; }
    .row a.ghost { background:#f3f4f6; color:#111; }
    .ok { margin-top:22px; font-size:12px; color:#059669; }
    .ok.bad { color:#b91c1c; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">Quick<em>Bite</em></div>
    <h1>Three live apps. One cloud.</h1>
    <p class="lead">Customer, shop, and rider share the same orders. Open any app — no Node on your computer.</p>
    <a class="card" href="/user.html">
      <div class="ico">🍔</div>
      <div><b>Customer</b><span>QuickBite · Anuradhapura feed</span></div>
    </a>
    <a class="card" href="/shop.html">
      <div class="ico">🥐</div>
      <div><b>Shop</b><span>Shop partner dashboard</span></div>
    </a>
    <a class="card" href="/rider.html">
      <div class="ico">🛵</div>
      <div><b>Rider</b><span>QuickBite Rider · live GPS</span></div>
    </a>
    <div class="row">
      <a href="/apps.html">Android APKs</a>
      <a class="ghost" href="/user.html">Sign in with OTP</a>
    </div>
    <p class="ok" id="health">Checking live server…</p>
  </div>
  <script src="/js/live.js?v=19p"></script>
  <script>
    const el = document.getElementById('health');
    const sb = (window.QB_SUPABASE_URL || '').replace(/\/$/, '');
    const key = window.QB_SUPABASE_ANON || '';
    function hdr() {
      return { apikey: key, Authorization: 'Bearer ' + key };
    }
    async function pingSupabase() {
      if (!sb || !key) throw new Error('no supabase');
      const delHdr = Object.assign({ Prefer: 'return=minimal' }, hdr());
      const GEN = '19p';
      let alreadyEmpty = false;
      try {
        const st = await fetch(sb + '/rest/v1/app_state?id=eq.qb_empty&select=payload', { headers: hdr() }).then((r) => r.json());
        alreadyEmpty = Array.isArray(st) && st[0] && st[0].payload && String(st[0].payload.v) === GEN;
      } catch (_) {}
      if (!alreadyEmpty) {
        const tables = ['messages', 'orders', 'menu_items', 'shops', 'accounts', 'otp_codes', 'app_state'];
        for (let round = 0; round < 6; round++) {
          await Promise.all(tables.map((t) => fetch(sb + '/rest/v1/' + t + (t === 'messages' ? '?order_id=not.is.null' : '?id=not.is.null'), { method: 'DELETE', headers: delHdr }).catch(() => {})));
          for (let t = 0; t < tables.length; t++) {
            try {
              const rows = await fetch(sb + '/rest/v1/' + tables[t] + '?select=*&limit=1000', { headers: hdr() }).then((r) => r.json());
              if (Array.isArray(rows)) {
                await Promise.all(rows.map((row) => {
                  const q = tables[t] === 'messages' && row.order_id
                    ? 'messages?order_id=eq.' + encodeURIComponent(row.order_id) + '&id=eq.' + encodeURIComponent(row.id)
                    : tables[t] + '?id=eq.' + encodeURIComponent(row.id);
                  return fetch(sb + '/rest/v1/' + q, { method: 'DELETE', headers: delHdr }).catch(() => {});
                }));
              }
            } catch (_) {}
          }
          let leftShops = [];
          let leftItems = [];
          let leftAcc = [];
          try { leftShops = await fetch(sb + '/rest/v1/shops?select=id&limit=20', { headers: hdr() }).then((r) => r.json()); } catch (_) {}
          try { leftItems = await fetch(sb + '/rest/v1/menu_items?select=id&limit=20', { headers: hdr() }).then((r) => r.json()); } catch (_) {}
          try { leftAcc = await fetch(sb + '/rest/v1/accounts?select=id&limit=20', { headers: hdr() }).then((r) => r.json()); } catch (_) {}
          if ((!Array.isArray(leftShops) || !leftShops.length) && (!Array.isArray(leftItems) || !leftItems.length) && (!Array.isArray(leftAcc) || !leftAcc.length)) break;
        }
        let shopsNow = [];
        let itemsNow = [];
        let accNow = [];
        try { shopsNow = await fetch(sb + '/rest/v1/shops?select=id&limit=5', { headers: hdr() }).then((r) => r.json()); } catch (_) {}
        try { itemsNow = await fetch(sb + '/rest/v1/menu_items?select=id&limit=5', { headers: hdr() }).then((r) => r.json()); } catch (_) {}
        try { accNow = await fetch(sb + '/rest/v1/accounts?select=id&limit=5', { headers: hdr() }).then((r) => r.json()); } catch (_) {}
        if ((!Array.isArray(shopsNow) || !shopsNow.length) && (!Array.isArray(itemsNow) || !itemsNow.length) && (!Array.isArray(accNow) || !accNow.length)) {
          await fetch(sb + '/rest/v1/app_state', {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }, hdr()),
            body: JSON.stringify([{ id: 'qb_empty', payload: { v: GEN, at: Date.now() } }]),
          }).catch(() => {});
        }
      }
      const demoShops = '"SHOP_1","SHOP_2","SHOP_3","SHOP_4","SHOP_5","SHOP_6","SHOP_7","SHOP_8","SHOP_9","SHOP_10","SHOP_11"';
      const demoItems = Array.from({ length: 33 }, (_, i) => '"I' + (i + 1) + '"').join(',');
      const demoPhones = '"0771234567","0771112222","0772223333","0775556666"';
      const wipe = [
        'messages?order_id=in.("ORD-1001","ORD-1002","ORD-1003","ORD-1004","ORD-NONE")',
        'orders?id=in.("ORD-1001","ORD-1002","ORD-1003","ORD-1004","ORD-NONE")',
        'orders?shop_id=in.(' + demoShops + ')',
        'orders?user_id=in.("USER_1","USER_2")',
        'orders?customer_phone=in.(' + demoPhones + ')',
        'menu_items?shop_id=in.(' + demoShops + ')',
        'menu_items?id=in.(' + demoItems + ')',
        'shops?id=in.(' + demoShops + ')',
        'accounts?id=in.("USER_1","USER_2","SHOP_STAFF","RIDER_77")',
        'accounts?phone=in.(' + demoPhones + ')',
        'otp_codes?phone=in.(' + demoPhones + ')',
      ];
      await Promise.all(wipe.map((p) => fetch(sb + '/rest/v1/' + p, { method: 'DELETE', headers: delHdr }).catch(() => {})));
      const patchHdr = Object.assign({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }, hdr());
      await Promise.all(['Kandy Bakers', 'Kandy Baker', 'Kandy Bakery', 'Demo Shop'].map((n) =>
        fetch(sb + '/rest/v1/orders?shop_name=eq.' + encodeURIComponent(n), {
          method: 'PATCH',
          headers: patchHdr,
          body: JSON.stringify({ shop_name: '' }),
        }).catch(() => {})
      ));
      const shops = await fetch(sb + '/rest/v1/shops?select=id', { headers: hdr() }).then((r) => r.json());
      const items = await fetch(sb + '/rest/v1/menu_items?select=id', { headers: hdr() }).then((r) => r.json());
      el.className = 'ok';
      const nShops = Array.isArray(shops) ? shops.length : 0;
      const nItems = Array.isArray(items) ? items.length : 0;
      el.textContent = nShops || nItems
        ? 'Live · Supabase · ' + nShops + ' shops · ' + nItems + ' dishes'
        : 'Live · empty · 0 shops · 0 dishes';
    }
    const hang = setTimeout(() => {
      if (el.textContent.indexOf('Checking') === 0) {
        el.className = 'ok';
        el.textContent = 'Live · tap Customer, Shop, or Rider';
      }
    }, 4000);
    pingSupabase().then(() => clearTimeout(hang)).catch(() => {
      clearTimeout(hang);
      const base = (window.QB_API || '').replace(/\/$/, '');
      return fetch(base + '/api/health').then((r) => r.json()).then((d) => {
        el.textContent =
          'Live · ' + (d.ok ? 'ok' : 'degraded') + ' · db ' + (d.db || 'local') +
          (d.cloud ? ' · cloud' : '') + ' · ' + (d.shops || 0) + ' shops · ' + (d.items || 0) + ' dishes';
      });
    }).catch(() => {
      el.className = 'ok bad';
      el.textContent = 'Could not reach Supabase. Open /user anyway.';
    });
  </script>
</body>
</html>
