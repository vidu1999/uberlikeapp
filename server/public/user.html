  <script>
    const APK = {
      shop: 'https://github.com/vidu1999/uberlikeapp/releases/download/swiftdrop-1.0.0/shop.apk',
      rider: 'https://github.com/vidu1999/uberlikeapp/releases/download/swiftdrop-1.0.0/rider.apk',
    };
    const ONBOARD = [
      { img: '/img/onboard-1.jpg', title: 'Fast & Reliable Delivery', sub: 'Get your favorite food from the best shops, delivered right to your door.' },
      { img: '/img/onboard-2.jpg', title: 'Wide Variety of Restaurants', sub: 'From local favorites to popular brands, find everything you love.' },
      { img: '/img/onboard-3.jpg', title: 'Track Your Order in Real Time', sub: 'See your order status and live location until it reaches you.' },
    ];
    const CATS = [
      { id: 'All', label: 'All', map: 'All', img: '' },
      { id: 'Burgers', label: 'Burgers', map: 'Fast Food', img: '/img/shop-burger.jpg' },
      { id: 'Pizza', label: 'Pizza', map: 'Pizza', img: '/img/shop-pizza.jpg' },
      { id: 'Bakery', label: 'Bakery', map: 'Bakery', img: '/img/shop-bakery.jpg' },
      { id: 'Beverages', label: 'Beverages', map: 'Beverages', img: '/img/iced-coffee.jpg' },
      { id: 'Favourites', label: 'Favourites', map: 'Favourites', img: '' },
    ];
    const MARK = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" fill="#fff"/><path d="M8 10.5c0-1.2.9-2.2 2.4-2.6V7h1.3v.8c1.4.3 2.4 1.2 2.4 2.4 0 1.6-1.4 2.2-2.7 2.5v2.2c.7-.1 1.3-.4 1.7-.8l.9.8c-.7.7-1.7 1.1-2.6 1.3V17h-1.3v-.8c-1.6-.3-2.6-1.3-2.6-2.7 0-1.5 1.2-2.2 2.6-2.5V10c-.6.2-1.1.5-1.1 1.1H8zm3.7 1.3c.7-.2 1.2-.4 1.2-.9s-.5-.8-1.2-.9v1.8zm-1.3 3.3v-1.8c-.7.2-1.2.5-1.2 1s.5.7 1.2.8z" fill="#00C853"/></svg>';

    const seenOnboard = localStorage.getItem('qb_onboard') === '1' || sessionStorage.getItem('qb_onboard') === '1';
    let restoredSession = !!API.user;
    let savedGps = null;
    try { savedGps = JSON.parse(localStorage.getItem('qb_live_gps') || 'null'); } catch (_) {}
    if (!savedGps || typeof savedGps.lat !== 'number' || typeof savedGps.lng !== 'number') savedGps = null;
    const state = {
      gate: API.user ? 'app' : 'splash',
      onboard: 0,
      tab: 'home',
      screen: 'home',
      query: '',
      category: 'All',
      shopId: null,
      menuTab: 'menu',
      menuCat: 'Cakes',
      trackId: null,
      cart: [],
      favs: [],
      note: '',
      address: savedGps ? (savedGps.label || 'Current location') : 'Finding your location…',
      loc: {
        lat: savedGps ? savedGps.lat : 8.3350,
        lng: savedGps ? savedGps.lng : 80.4108,
        label: savedGps ? (savedGps.label || 'Current location') : 'Finding your location…',
        liveLat: savedGps ? savedGps.lat : null,
        liveLng: savedGps ? savedGps.lng : null,
        custom: false,
      },
      locHandle: null,
      locFrom: 'home',
      payment: 'Cash on delivery',
      payKind: 'cash',
      cardId: 'new',
      cards: [],
      cardDraft: { number: '', name: '', exp: '', save: true },
      cardErr: '',
      deliveryType: 'standard',
      mapHandle: null,
      lockTrack: false,
      regRole: 'customer',
      downloadRole: 'shop',
      otp: { phone: '', smsToken: '', err: '' },
      loginId: '',
      loginPw: '',
      reg: { name: '', phone: '', email: '', password: '' },
      wa: { open: false, step: 'phone', phone: '', err: '', mode: 'order' },
    };
    if (state.gate === 'splash') {
      setTimeout(() => {
        if (API.user) { state.gate = 'app'; render(); return; }
        if (state.gate !== 'splash') return;
        state.gate = seenOnboard ? 'login' : 'onboard';
        render();
      }, 1800);
    }

    function accountKey() {
      const email = API.user && String(API.user.email || '').trim().toLowerCase();
      if (email) return 'e_' + email;
      if (API.user && API.user.id) return API.user.id;
      return 'guest';
    }
    function cartKey() { return 'sd_cart_' + accountKey(); }
    function saveCart() { sessionStorage.setItem(cartKey(), JSON.stringify(state.cart)); }
    function loadCart() {
      try {
        const arr = JSON.parse(sessionStorage.getItem(cartKey()) || '[]');
        state.cart = Array.isArray(arr) ? arr : [];
      } catch (_) { state.cart = []; }
    }
    function favKey() { return 'qb_favs_' + accountKey(); }
    function loadFavs() {
      try {
        const raw = localStorage.getItem(favKey()) || '[]';
        const arr = JSON.parse(raw);
        state.favs = Array.isArray(arr) ? arr.map(String) : [];
      } catch (_) { state.favs = []; }
    }
    function saveFavs() {
      try { localStorage.setItem(favKey(), JSON.stringify(state.favs)); } catch (_) {}
    }
    function cardsKey() { return 'qb_cards_' + accountKey(); }
    function loadCards() {
      try {
        const arr = JSON.parse(localStorage.getItem(cardsKey()) || '[]');
        state.cards = Array.isArray(arr) ? arr.filter((c) => c && c.last4) : [];
      } catch (_) { state.cards = []; }
    }
    function saveCards() {
      try { localStorage.setItem(cardsKey(), JSON.stringify(state.cards)); } catch (_) {}
    }
    function cardDigits(v) { return String(v || '').replace(/\D/g, ''); }
    function cardBrand(num) {
      const d = cardDigits(num);
      if (/^4/.test(d)) return 'Visa';
      if (/^(5[1-5]|2[2-7])/.test(d)) return 'Mastercard';
      if (/^3[47]/.test(d)) return 'Amex';
      if (/^35/.test(d)) return 'JCB';
      if (/^62/.test(d)) return 'UnionPay';
      if (/^(6011|65)/.test(d)) return 'Discover';
      return 'Card';
    }
    function luhnOk(num) {
      const d = cardDigits(num);
      if (d.length < 13 || d.length > 19) return false;
      let s = 0, alt = false;
      for (let i = d.length - 1; i >= 0; i--) {
        let n = d.charCodeAt(i) - 48;
        if (n < 0 || n > 9) return false;
        if (alt) { n *= 2; if (n > 9) n -= 9; }
        s += n; alt = !alt;
      }
      return s % 10 === 0;
    }
    function formatCard(v) {
      const d = cardDigits(v).slice(0, 19);
      return d.replace(/(\d{4})(?=\d)/g, '$1 ').trim();
    }
    function formatExp(v) {
      const d = cardDigits(v).slice(0, 4);
      return d.length <= 2 ? d : d.slice(0, 2) + '/' + d.slice(2);
    }
    function expOk(exp) {
      const m = String(exp || '').trim().match(/^(\d{1,2})\s*\/\s*(\d{2})$/);
      if (!m) return false;
      const mo = Number(m[1]), yr = 2000 + Number(m[2]);
      if (mo < 1 || mo > 12) return false;
      return new Date(yr, mo, 0, 23, 59, 59) >= new Date();
    }
    function cardLabel(c) { return (c.brand || 'Card') + ' •••• ' + c.last4; }
    function isCardPaid(method) {
      const m = String(method || '').toLowerCase();
      if (m.indexOf('cash') !== -1) return false;
      return /visa|master|amex|unionpay|jcb|discover|card|••••/.test(m);
    }
    function pullCardDraft() {
      const num = document.getElementById('cardNum');
      const name = document.getElementById('cardName');
      const exp = document.getElementById('cardExp');
      const save = document.getElementById('cardSave');
      if (!state.cardDraft) state.cardDraft = { number: '', name: '', exp: '', save: true };
      if (num) state.cardDraft.number = num.value;
      if (name) state.cardDraft.name = name.value;
      if (exp) state.cardDraft.exp = exp.value;
      if (save) state.cardDraft.save = !!save.checked;
    }
    function rememberCard(rec) {
      const row = {
        id: 'c' + Date.now(),
        brand: rec.brand,
        last4: rec.last4,
        exp: rec.exp,
        name: rec.name || '',
      };
      state.cards = [row].concat((state.cards || []).filter((c) => !(c.last4 === row.last4 && c.brand === row.brand)));
      saveCards();
      return row;
    }
    function validateCard(opts) {
      opts = opts || {};
      const saved = opts.saved;
      const number = ((document.getElementById('cardNum') || {}).value || (state.cardDraft && state.cardDraft.number) || '');
      const name = ((document.getElementById('cardName') || {}).value || (state.cardDraft && state.cardDraft.name) || '').trim();
      const exp = ((document.getElementById('cardExp') || {}).value || (state.cardDraft && state.cardDraft.exp) || '').trim();
      const cvc = ((document.getElementById('cardCvc') || {}).value || '').replace(/\D/g, '');
      const brand = saved ? saved.brand : cardBrand(number);
      const amex = brand === 'Amex';
      if (!saved) {
        if (!luhnOk(number)) return { ok: false, err: 'Enter a valid card number.' };
        if (name.length < 2) return { ok: false, err: 'Enter the name on the card.' };
        if (!expOk(exp)) return { ok: false, err: 'Enter a valid expiry (MM/YY).' };
      }
      if (cvc.length !== (amex ? 4 : 3)) return { ok: false, err: amex ? 'Enter the 4-digit CVC.' : 'Enter the 3-digit CVC.' };
      const d = cardDigits(number);
      return {
        ok: true,
        brand: brand,
        last4: saved ? saved.last4 : d.slice(-4),
        exp: saved ? saved.exp : formatExp(exp),
        name: saved ? saved.name : name,
        save: !saved && !!(document.getElementById('cardSave') || { checked: true }).checked,
      };
    }
    function cardFormHtml(saved) {
      const d = state.cardDraft || {};
      const brand = cardBrand(d.number || '');
      if (saved) {
        return `<div class="card-form">
          <p class="card-using">Pay with <b>${esc(cardLabel(saved))}</b></p>
          <div class="card-field"><label>CVC</label><input id="cardCvc" inputmode="numeric" autocomplete="cc-csc" placeholder="${saved.brand==='Amex'?'1234':'123'}" maxlength="4" /></div>
          <p class="err" data-card-err>${esc(state.cardErr || '')}</p>
        </div>`;
      }
      return `<div class="card-form">
        <div class="card-field">
          <label>Card number</label>
          <div class="card-num">
            <input id="cardNum" inputmode="numeric" autocomplete="cc-number" placeholder="ACCT-000015" maxlength="23" value="${esc(formatCard(d.number || ''))}" />
            <span class="card-brand">${esc(brand === 'Card' ? '' : brand)}</span>
          </div>
        </div>
        <div class="card-field">
          <label>Name on card</label>
          <input id="cardName" autocomplete="cc-name" placeholder="Name on card" value="${esc(d.name || '')}" />
        </div>
        <div class="card-row">
          <div class="card-field">
            <label>Expiry</label>
            <input id="cardExp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" maxlength="5" value="${esc(d.exp || '')}" />
          </div>
          <div class="card-field">
            <label>CVC</label>
            <input id="cardCvc" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4" />
          </div>
        </div>
        <label class="card-save"><input type="checkbox" id="cardSave" ${d.save === false ? '' : 'checked'} /> Save this card for next orders</label>
        <p class="err" data-card-err>${esc(state.cardErr || '')}</p>
        <p class="muted card-hint">Full card number and CVC are never stored.</p>
      </div>`;
    }
    function payBlock() {
      const cashOn = state.payKind !== 'card';
      const cards = state.cards || [];
      let selected = state.cardId || (cards[0] && cards[0].id) || 'new';
      if (selected !== 'new' && !cards.some((c) => c.id === selected)) selected = cards.length ? cards[0].id : 'new';
      state.cardId = selected;
      let html = `<h3>Payment Method</h3>
        <label class="pay-opt"><input type="radio" name="pay" value="cash" ${cashOn ? 'checked' : ''} /> Cash on Delivery</label>
        <label class="pay-opt"><input type="radio" name="pay" value="card" ${cashOn ? '' : 'checked'} /> Debit / Credit card</label>`;
      if (!cashOn) {
        html += cards.map((c) => `<label class="pay-opt card-saved"><input type="radio" name="cardid" value="${esc(c.id)}" ${selected === c.id ? 'checked' : ''} /> <span class="card-ico">${esc(c.brand)}</span> ${esc(c.brand)} •••• ${esc(c.last4)} <em>exp ${esc(c.exp)}</em></label>`).join('');
        html += `<label class="pay-opt"><input type="radio" name="cardid" value="new" ${selected === 'new' || !cards.length ? 'checked' : ''} /> Add a new card</label>`;
        const saved = cards.find((c) => c.id === selected);
        html += cardFormHtml(saved);
      }
      return html;
    }
    let localUserId = '';
    function ensureUserLocal() {
      const id = accountKey();
      if (localUserId === id) return;
      localUserId = id;
      loadCart();
      loadFavs();
      loadCards();
    }
    ensureUserLocal();
    function cartCount() { return state.cart.reduce((s, i) => s + i.qty, 0); }
    function cartTotal() { return state.cart.reduce((s, i) => s + i.qty * i.price, 0); }
    function fee() { return state.deliveryType === 'express' ? 360 : 200; }
    function setPlace(lat, lng, label, custom) {
      state.loc.lat = lat; state.loc.lng = lng;
      if (label) state.loc.label = label;
      state.address = state.loc.label;
      if (custom) state.loc.custom = true;
      window.QB_LIVE = { lat: state.loc.liveLat, lng: state.loc.liveLng };
    }
    function deliveryPoint() {
      if (state.loc.custom || state.loc.frozen) return { lat: state.loc.lat, lng: state.loc.lng };
      if (state.loc.liveLat != null && state.loc.liveLng != null) {
        return { lat: state.loc.liveLat, lng: state.loc.liveLng };
      }
      return { lat: state.loc.lat, lng: state.loc.lng };
    }
    async function labelAt(lat, lng) {
      if (typeof reversePlace === 'function') return reversePlace(lat, lng);
      return lat.toFixed(5) + ', ' + lng.toFixed(5);
    }
    function gpsText() {
      if (state.loc.acc == null) return 'Waiting for GPS…';
      return 'GPS ±' + Math.max(1, Math.round(state.loc.acc)) + ' m';
    }
    function paintLiveUi() {
      const accEl = document.querySelector('[data-loc-acc]');
      if (accEl) accEl.textContent = gpsText();
      const errEl = document.querySelector('[data-loc-err]');
      if (errEl && state.loc.liveLat != null) errEl.textContent = '';
      if (state.locHandle && state.locHandle.setLive) {
        state.locHandle.setLive(state.loc.liveLat, state.loc.liveLng, state.loc.acc);
      }
    }
    function startLiveLocation() {
      if (!navigator.geolocation) {
        state.loc.err = 'This device has no GPS.';
        const errEl = document.querySelector('[data-loc-err]');
        if (errEl) errEl.textContent = state.loc.err;
        return;
      }
      const opt = { enableHighAccuracy: true, maximumAge: 30000, timeout: 25000 };
      const onFix = (pos) => {
        const acc = Number(pos.coords.accuracy || 999);
        if (state.loc.acc != null && state.loc.acc <= 12 && acc > 40) return;
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        state.loc.acc = acc;
        state.loc.liveLat = lat;
        state.loc.liveLng = lng;
        state.loc.err = '';
        window.QB_LIVE = { lat, lng, acc };
        paintLiveUi();
        const first = !state.loc._gps;
        state.loc._gps = true;
        const quick = (!state.loc.label || state.loc.label === 'Finding your location…') ? 'Current location' : state.loc.label;
        if (!state.loc.custom && !state.loc.frozen) setPlace(lat, lng, quick, false);
        try { localStorage.setItem('qb_live_gps', JSON.stringify({ lat, lng, acc, label: state.loc.label })); } catch (_) {}
        if (first) {
          if (state.loc.openMapOnce) {
            state.loc.openMapOnce = false;
            state.screen = 'locate';
            state.locFrom = state.locFrom || 'home';
          }
          render({ keepScroll: true });
          labelAt(lat, lng).then((label) => {
            if (!state.loc.custom && !state.loc.frozen) setPlace(lat, lng, label, false);
            try { localStorage.setItem('qb_live_gps', JSON.stringify({ lat, lng, acc, label })); } catch (_) {}
            const el = document.querySelector('[data-loc-label]');
            if (el) el.textContent = label;
            const addr = document.getElementById('addr');
            if (addr && !state.loc.custom) addr.value = label;
            const city = document.querySelector('[data-loc-city]');
            if (city) city.textContent = label;
          }).catch(() => {});
        }
      };
      const onErr = (err) => {
        const denied = err && err.code === 1;
        state.loc.err = denied
          ? 'Location permission is required. Tap Allow location.'
          : 'Waiting for GPS. Turn on Location and use outdoors for ~1 m.';
        const errEl = document.querySelector('[data-loc-err]');
        if (errEl) errEl.textContent = state.loc.err;
        const btn = document.querySelector('[data-allow-loc]');
        if (btn) { btn.disabled = false; btn.textContent = 'Allow location'; }
      };
      navigator.geolocation.getCurrentPosition(onFix, onErr, opt);
      if (!startLiveLocation._on) {
        startLiveLocation._on = true;
        navigator.geolocation.watchPosition(onFix, onErr, opt);
      }
    }
    function tryAutoGps() {
      if (!navigator.geolocation) return;
      if (state.loc._gps) return;
      startLiveLocation();
    }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function rs(n) { return 'Rs. ' + Math.round(Number(n)||0).toLocaleString('en-LK'); }
    function shopImg(s) { return (s && s.image) || '/img/shop-curry.jpg'; }
    function itemImg(it) { return it.image || shopImg(API.shopOf(it.shopId)); }
    function firstName() {
      const n = String((API.user && API.user.name) || '').trim();
      if (!n || /^guest$/i.test(n) || /^user$/i.test(n)) {
        const email = String((API.user && API.user.email) || '');
        if (email.includes('@')) return email.split('@')[0];
        return 'there';
      }
      return n.split(/\s+/)[0];
    }
    function userPhoto() {
      const p = API.user && (API.user.photo || API.user.picture);
      if (p && /^https?:\/\//i.test(String(p))) return String(p);
      return '/img/avatar-user.jpg';
    }
    function hello() {
      const h = new Date().getHours();
      return h < 12 ? 'Good Morning' : h < 17 ? 'Good Afternoon' : 'Good Evening';
    }
    function addToCart(item) {
      if (state.cart.length && state.cart[0].shopId !== item.shopId) state.cart = [];
      const hit = state.cart.find((c) => c.id === item.id);
      if (hit) hit.qty += 1;
      else state.cart.push({ id: item.id, shopId: item.shopId, name: item.name, price: item.price, qty: 1, image: item.image });
      saveCart();
      render({ keepScroll: true });
    }
    function setQty(id, d) {
      const hit = state.cart.find((c) => c.id === id);
      if (!hit) return;
      hit.qty += d;
      if (hit.qty <= 0) state.cart = state.cart.filter((c) => c.id !== id);
      saveCart();
      render({ keepScroll: true });
    }

    const SVG = {
      home: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 4 9.2V21h6v-7h4v7h6V9.2z"/></svg>',
      orders: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4h10v16H7z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>',
      cart: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h15l-1.5 9h-12z"/><path d="M6 7 5 4H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>',
      profile: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M5 20c1.5-4 12.5-4 14 0"/></svg>',
      pin: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.2"/></svg>',
      bell: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 21h4"/></svg>',

    function nav() {
      const t = state.tab;
      return `<nav class="bnav">
        <button data-tab="home" class="${t==='home'?'on':''}">${SVG.home}Home</button>
        <button data-tab="orders" class="${t==='orders'?'on':''}">${SVG.orders}Orders</button>
        <button data-tab="cart" class="${t==='cart'?'on':''}">${SVG.cart}Cart</button>
        <button data-tab="account" class="${t==='account'?'on':''}">${SVG.profile}Profile</button>
      </nav>`;

    function cartbar() {
      if (!cartCount() || ['cart','checkout','track','chat','done'].includes(state.screen) || state.tab==='cart') return '';
      return `<div class="cartbar" data-tab="cart"><span>View cart · ${cartCount()}</span><span>${rs(cartTotal())}</span></div>`;
    }
    function distKm(s) {
      const la = state.loc && state.loc.lat, ln = state.loc && state.loc.lng;
      if (s.lat == null || s.lng == null || la == null || ln == null || typeof haversineKm !== 'function') {
        const k = Number(s.km != null ? s.km : 2.5);
        return Math.max(0.1, Math.round(k * 10) / 10);
      }
      const k = haversineKm([Number(la), Number(ln)], [Number(s.lat), Number(s.lng)]);
      return Math.max(0.1, Math.round(k * 10) / 10);
    }
    function shopMatchesCat(s) {
      const cat = CATS.find((c) => c.id === state.category) || CATS[0];
      if (cat.id === 'Favourites') return (state.favs || []).map(String).includes(String(s.id));
      if (cat.id === 'All') return true;
      const c = String(s.category || '');
      if (c === cat.map || c === cat.id) return true;
      if (cat.id === 'Burgers' && /fast food|burger/i.test(c)) return true;
      if (cat.id === 'Beverages' && /coffee|beverage|drink|tea/i.test(c)) return true;
      return false;
    }
    function shopMatchesQuery(s, q) {
      if (!q) return true;
      const blob = [s.name, s.category, s.address].join(' ').toLowerCase();
      if (blob.includes(q)) return true;
      return (API.items || []).some((it) => it.shopId === s.id && [it.name, it.category, it.desc, it.description].join(' ').toLowerCase().includes(q));
    }
    function filteredShops() {
      const q = state.query.trim().toLowerCase();
      let shops = (API.shops || []).filter((s) => shopMatchesCat(s) && shopMatchesQuery(s, q));
      return shops.slice().sort((a, b) => distKm(a) - distKm(b));
    }
    function itemMatchesCat(it) {
      const cat = CATS.find((c) => c.id === state.category) || CATS[0];
      if (cat.id === 'Favourites') return (state.favs || []).map(String).includes(String(it.shopId));
      if (cat.id === 'All') return true;
      const ic = String(it.category || '');
      if (ic === cat.id || ic === cat.map) return true;
      if (cat.id === 'Burgers' && /burger|fast food/i.test(ic)) return true;
      if (cat.id === 'Pizza' && /pizza/i.test(ic)) return true;
      if (cat.id === 'Bakery' && /bakery|cake|pastry|bread/i.test(ic)) return true;
      if (cat.id === 'Beverages' && /beverage|drink|coffee|tea|juice/i.test(ic)) return true;
      return shopMatchesCat(API.shopOf(it.shopId));
    }
    function filteredItems() {
      const q = state.query.trim().toLowerCase();
      return (API.items || []).filter((it) => {
        if (it.isAvailable === false) return false;
        if (!itemMatchesCat(it)) return false;
        if (!q) return state.category !== 'All';
        const shop = API.shopOf(it.shopId);
        return [it.name, it.category, it.desc, it.description, shop && shop.name].join(' ').toLowerCase().includes(q);
      });
    }
    function heartBtn(id) {
      const liked = state.favs.includes(id);
      return `<button type="button" class="heart ${liked ? 'on' : ''}" data-fav="${id}" aria-label="${liked ? 'Remove favourite' : 'Add favourite'}">${liked ? SVG.heartOn : SVG.heart}</button>`;
    }
    function shopRow(s, asCard) {
      const km = distKm(s);
      const rev = s.reviews >= 100 ? s.reviews + '+' : (s.reviews || 0);
      const cls = asCard ? 'shop-card' : 'shop-row';
      return `<div class="${cls}" data-shop="${s.id}">
        <img class="thumb" src="${shopImg(s)}" alt="" />
        <div class="grow">
          <div class="name-row"><div class="name">${esc((API.shopTitle && API.shopTitle(s)) || s.name)}</div>${heartBtn(s.id)}</div>
          <div class="meta">${esc(s.category || 'Shop')}</div>
          <div class="rate"><span class="star">★</span> ${Number(s.rating || 0).toFixed(1)} <em>(${rev})</em> · ${km} km</div>
        </div>
      </div>`;
    }
    function itemRow(it) {
      const shop = API.shopOf(it.shopId);
      return `<div class="item-card" data-shop="${esc(it.shopId)}">
        <img class="thumb" src="${itemImg(it)}" alt="" />
        <div class="grow">

        </div>
        ${it.isAvailable === false ? `<span class="muted">Sold out</span>` : `<button class="add" data-add="${esc(it.id)}">Add</button>`}
      </div>`;
    }

    async function consumeGoogleRedirect() {
      const hash = String(location.hash || '').replace(/^#/, '');
      const hp = new URLSearchParams(hash);
      const qp = new URLSearchParams(location.search);
      const access = hp.get('access_token') || qp.get('access_token');
      const cred = hp.get('credential') || hp.get('id_token') || qp.get('id_token');
      if (!access && !cred) return false;
      try {
        history.replaceState({}, '', location.pathname);
      } catch (_) {}
      const err = document.querySelector('[data-err]');
      try {
        let profile = null;
        if (cred && API.parseGoogleJwt) profile = API.parseGoogleJwt(cred);
        if ((!profile || !profile.email) && access) {
          const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + access } });
          profile = await r.json();
        }
        await API.signInGoogle(profile);
        state.gate = 'app';
        state.tab = 'home';
        state.screen = 'home';
        render();
        return true;
      } catch (e) {
        if (err) err.textContent = e.message || 'Google sign-in failed';
        return false;
      }
    }
    async function startOtp(phone) {
      state.otp.phone = phone;
      state.otp.err = '';
      const out = await API.sendOtp('customer', phone);
      state.otp.phone = out.phone;
      state.otp.smsToken = out.smsToken;
      state.gate = 'otp';
      render();
    }
    function bindOtp() {
      const root = document.querySelector('[data-otp-root]');
      if (!root) return;
      const err2 = root.querySelector('[data-err2]');
      const codeValue = () => [...root.querySelectorAll('.otp-boxes input')].map((i) => i.value).join('');
      async function deliver() {
        const bubble = root.querySelector('[data-sms-body]');
        if (bubble) bubble.textContent = 'Open WhatsApp. We sent the 4-digit code to this number.';
      }
      deliver();
      async function verify() {
        const code = codeValue();
        if (code.length !== 4) { err2.textContent = 'Enter the 4-digit code'; return; }
        try {
          await API.verifyOtp('customer', state.otp.phone, code);
          state.gate = 'app'; state.tab = 'home'; state.screen = 'home';
          render();
        } catch (e) { err2.textContent = e.message; }
      }
      root.querySelector('[data-verify]').onclick = verify;
      root.querySelector('[data-resend]').onclick = async () => {
        const out = await API.sendOtp('customer', state.otp.phone);
        state.otp.smsToken = out.smsToken;
        deliver();
      };
      root.querySelectorAll('.otp-boxes input').forEach((el) => {
        el.oninput = () => {
          el.value = el.value.replace(/\D/g, '').slice(0, 1);
          const i = Number(el.dataset.d);
          if (el.value && i < 3) root.querySelector('.otp-boxes input[data-d="' + (i + 1) + '"]').focus();
          if (codeValue().length === 4) verify();
        };
      });
    }
    function bindWaSheet(afterVerify) {
      const sheet = document.querySelector('[data-wa-sheet]');
      if (!sheet) return;
      const close = sheet.querySelector('[data-wa-close]');
      if (close) close.onclick = () => {
        state.wa.open = false;
        render({ keepScroll: true });
      };
      const send = sheet.querySelector('[data-wa-send]');
      if (send) send.onclick = async () => {
        const phone = ((document.getElementById('waPhone') || {}).value || state.wa.phone || '').trim();
        state.wa.phone = phone;
        send.disabled = true;
        send.textContent = 'Sending…';
        try {
          const out = await API.sendOtp('customer', phone);
          state.wa.phone = out.phone || phone;
          state.wa.step = 'code';
          state.wa.err = '';
          render({ keepScroll: true });
        } catch (e) {
          state.wa.err = e.message || 'Could not send WhatsApp code';
          render({ keepScroll: true });
        }
      };
      const resend = sheet.querySelector('[data-wa-resend]');
      if (resend) resend.onclick = async () => {
        try {
          await API.sendOtp('customer', state.wa.phone);
          state.wa.err = 'Code sent again.';
          render({ keepScroll: true });
        } catch (e) {
          state.wa.err = e.message || 'Could not resend';
          render({ keepScroll: true });
        }
      };
      const codeValue = () => [...sheet.querySelectorAll('.otp-boxes input')].map((i) => i.value).join('');
      async function verifyWa() {
        const code = codeValue();
        if (code.length !== 4) { state.wa.err = 'Enter the 4-digit code'; render({ keepScroll: true }); return; }
        try {
          await API.verifyOtp('customer', state.wa.phone, code);
          const login = state.wa.mode === 'login';
          state.wa.open = false;
          state.wa.err = '';
          if (login) {
            state.gate = 'app';
            state.tab = 'home';
            state.screen = 'home';
            render();
            return;
          }
          if (afterVerify) await afterVerify();
        } catch (e) {
          state.wa.err = e.message || 'Could not verify';
          render({ keepScroll: true });
        }
      }
      const verifyBtn = sheet.querySelector('[data-wa-verify]');
      if (verifyBtn) verifyBtn.onclick = verifyWa;
      sheet.querySelectorAll('.otp-boxes input').forEach((el) => {
        el.oninput = () => {
          el.value = el.value.replace(/\D/g, '').slice(0, 1);
          const i = Number(el.dataset.wad);
          if (el.value && i < 3) {
            const next = sheet.querySelector('.otp-boxes input[data-wad="' + (i + 1) + '"]');
            if (next) next.focus();
          }
          if (codeValue().length === 4) verifyWa();
        };
      });
    }

    function openTrack(id, lock) {
      state.trackId = id; state.screen = 'track'; state.lockTrack = lock !== false; render();
    }
    function leaveTrack() {
      state.lockTrack = false; state.screen = 'home'; state.tab = 'home'; render();
    }

    function render(opts) {
      const root = document.getElementById('root');
      const keep = !!(opts && opts.keepScroll);
      const sc0 = root.querySelector('.scroll');
      const y = keep && sc0 ? sc0.scrollTop : 0;
      try {
      if (!API.user && state.gate !== 'app') {
        if (state.gate === 'splash') { root.innerHTML = splash(); return; }
        if (state.gate === 'onboard') { root.innerHTML = onboard(); bindGate(); return; }
        if (state.gate === 'login') { root.innerHTML = loginView(); bindGate(); bindWaSheet(); consumeGoogleRedirect(); return; }
        if (state.gate === 'register') { root.innerHTML = registerView(); bindGate(); return; }
        if (state.gate === 'otp') { root.innerHTML = otpView(); bindGate(); bindOtp(); return; }
        if (state.gate === 'download') { root.innerHTML = downloadView(); bindGate(); return; }
      }
      if (!API.user) {
        state.gate = 'login';
        root.innerHTML = loginView();
        bindGate();
        consumeGoogleRedirect();
        return;
      }
      if (API.user) { ensureUserLocal(); tryAutoGps(); }
      if (!state.loc._gps && !state.loc.liveLat) {
        if (!root.querySelector('[data-locperm]')) {
          root.innerHTML = locPermView();
          bindLocPerm();
        }
        startLiveLocation();
        return;
      }
      {
        const live = (state.trackId && API.orders.find((x) => x.id === state.trackId))
          || (state.lastOrder && API.orders.find((x) => x.id === state.lastOrder.id));
        if (live) state.lastOrder = live;
        if (live && live.status === 'delivered' && (state.lockTrack || state.screen === 'track' || state.screen === 'chat')) {
          state.screen = 'done';
          state.lockTrack = false;
          state.loc.frozen = false;
          if (state.mapHandle) { try { state.mapHandle.destroy(); } catch (_) {} state.mapHandle = null; }
        } else if (state.lockTrack && live && live.status !== 'cancelled') {
          state.screen = 'track';
        }
      }
      const uid = API.user && API.user.id;
      const phone = API.user && API.user.phone;
      const active = (API.orders || []).some((o) => o.status !== 'delivered' && o.status !== 'cancelled' && (o.userId === uid || o.customerPhone === phone));
      if (!active) state.loc.frozen = false;
      if (state.screen === 'chat') {
        const oChat = API.orders.find((x) => x.id === state.trackId);
        if (API.canChat && !API.canChat(oChat, 'customer')) {
          state.screen = 'track';
          state.lockTrack = true;
        } else {
        const keep = root.querySelector('[data-chat-root="' + state.trackId + '"]');
        if (keep) { paintUserChat(keep); return; }
        if (API.markChatRead) API.markChatRead(state.trackId, 'customer');
        root.innerHTML = chatView();
        const b=document.getElementById('bubbles');
        if (b) b.scrollTop = b.scrollHeight;
        bindApp();
        bindChatKeyboard();
        return;
        }
      }
      if (state.screen === 'locate') {
        const keep = root.querySelector('[data-locate-root]') && state.locHandle;
        if (keep) return;
        root.innerHTML = locateView();
        bindLocate();
        return;
      }
      if (state.locHandle) { try { state.locHandle.destroy(); } catch(_){} state.locHandle = null; }
      if (state.screen === 'checkout') { root.innerHTML = checkoutView(); bindApp(); return; }
      if (state.screen === 'paymethods') { root.innerHTML = payMethodsView(); bindApp(); return; }
      if (state.screen === 'shop') { root.innerHTML = shopView(); bindApp(); return; }
      if (state.screen === 'search') { root.innerHTML = searchView(); bindApp(); return; }
      if (state.screen === 'done') { root.innerHTML = doneView(); bindApp(); return; }
      if (state.screen === 'track') {
        const o = API.orders.find((x) => x.id === state.trackId);
        if (o && o.status === 'delivered') {
          state.screen = 'done';
          state.lockTrack = false;
          state.loc.frozen = false;
          if (state.mapHandle) { try { state.mapHandle.destroy(); } catch (_) {} state.mapHandle = null; }
          root.innerHTML = doneView(o);
          bindApp();
          return;
        }
        const existing = root.querySelector('[data-track-root="'+state.trackId+'"]');
        const hasRider = o && o.riderName ? '1' : '0';
        if (existing && o && state.mapHandle && existing.dataset.hasRider === hasRider) {
          state.mapHandle.update(o);
          TrackUI.paint(existing, o, 'customer');
          return;
        }
        if (state.mapHandle) { try { state.mapHandle.destroy(); } catch(_){} state.mapHandle = null; }
        root.innerHTML = trackView();
        bindApp();
        const el = document.getElementById('map');
        if (el && o) state.mapHandle = mountTrackingMap(el, o);
        return;
      }
      if (state.mapHandle) { try { state.mapHandle.destroy(); } catch(_){} state.mapHandle = null; }
      if (state.tab === 'cart') root.innerHTML = cartView();
      else if (state.tab === 'orders') root.innerHTML = ordersView();
      else if (state.tab === 'account') root.innerHTML = accountView();
      else root.innerHTML = homeView();
      bindApp();
      } finally {
        if (keep) {
          const sc = root.querySelector('.scroll');
          if (sc) sc.scrollTop = y;
        }
      }
    }

    function bindGate() {
      const root = document.getElementById('root');
      const skip = () => { localStorage.setItem('qb_onboard','1'); state.gate = 'login'; render(); };
      root.querySelectorAll('[data-skip]').forEach((b) => b.onclick = skip);
      const next = root.querySelector('[data-next]');
      if (next) next.onclick = () => {
        if (state.onboard < ONBOARD.length - 1) { state.onboard += 1; render(); }
        else skip();
      };
      const goReg = root.querySelector('[data-go-reg]');
      if (goReg) goReg.onclick = () => { state.gate = 'register'; render(); };
      const goLogin = root.querySelector('[data-go-login]');
      if (goLogin) goLogin.onclick = () => { state.gate = 'login'; render(); };
      root.querySelectorAll('[data-regrole]').forEach((b) => b.onclick = () => {
        state.regRole = b.dataset.regrole;
        if (state.regRole === 'shop' || state.regRole === 'rider') {
          state.downloadRole = state.regRole;
          state.gate = 'download';
        }
        render();
      });
      const signin = root.querySelector('[data-signin]');
      if (signin) signin.onclick = async () => {
        const id = (document.getElementById('loginId') || {}).value || state.loginId;
        const pw = (document.getElementById('loginPw') || {}).value || state.loginPw;
        state.loginId = id;
        state.loginPw = pw;
        const err = root.querySelector('[data-err]');
        signin.disabled = true;
        try {
          if (String(id).includes('@')) {
            signin.textContent = 'Signing in…';
            await API.signInPassword(id, pw);
            state.gate = 'app';
            state.tab = 'home';
            state.screen = 'home';
            render();
            return;
          }
          signin.textContent = 'Sending code…';
          await startOtp(id);
        } catch (e) {
          if (err) err.textContent = e.message;
          signin.disabled = false;
          signin.textContent = 'Sign In';
        }
      };
      const googleBtn = root.querySelector('[data-google]');
      if (googleBtn) googleBtn.onclick = async (e) => {
        e.preventDefault();
        e.stopPropagation();
        const err = root.querySelector('[data-err]');
        if (err) err.textContent = '';
        googleBtn.disabled = false;
        googleBtn.style.pointerEvents = 'auto';
        googleBtn.disabled = true;
        const html = googleBtn.innerHTML;
        googleBtn.textContent = 'Opening Google…';
        try {
          const profile = await API.googleSignIn();
          await API.signInGoogle(profile);
          state.gate = 'app';
          state.tab = 'home';
          state.screen = 'home';
          render();
        } catch (ex) {
          if (err) err.textContent = ex.message || 'Google sign-in failed';
          googleBtn.disabled = false;
          googleBtn.innerHTML = html;
        }
      };
      const waBtn = root.querySelector('[data-whatsapp]');
      if (waBtn) waBtn.onclick = (e) => {
        e.preventDefault();
        state.wa = { open: true, step: 'phone', phone: '', err: '', mode: 'login' };
        render();
      };
      const reg = root.querySelector('[data-register]');
      if (reg) reg.onclick = async () => {
        state.reg = {
          name: (document.getElementById('regName') || {}).value || state.reg.name,
          phone: (document.getElementById('regPhone') || {}).value || state.reg.phone,
          email: (document.getElementById('regEmail') || {}).value || state.reg.email,
          password: (document.getElementById('regPw') || {}).value || state.reg.password,
        };
        const err = root.querySelector('[data-err]');
        reg.disabled = true;
        try {
          const out = await API.register({ ...state.reg, role: state.regRole });
          if (out.app === 'shop' || out.app === 'rider') {
            state.downloadRole = out.app;
            state.gate = 'download';
            render();
            return;
          }
          if (out.next === 'app') {
            state.gate = 'app';
            state.tab = 'home';
            state.screen = 'home';
            render();
            return;
          }
          state.otp.phone = out.phone;
          state.otp.smsToken = out.smsToken;
          state.gate = 'otp';
          render();
        } catch (e) {
          if (err) err.textContent = e.message;
          reg.disabled = false;
        }
      };
    }

    function bindLocPerm() {
      const btn = document.querySelector('[data-allow-loc]');
      if (!btn) return;
      btn.onclick = () => {
        btn.disabled = true;
        btn.textContent = 'Getting live GPS…';
        state.loc.openMapOnce = true;
        const errEl = document.querySelector('[data-loc-err]');
        if (errEl) errEl.textContent = '';
        startLiveLocation();
        setTimeout(() => {
          if (state.loc._gps || state.loc.liveLat) return;
          if (!state.loc.openMapOnce) return;
          state.loc.openMapOnce = false;
          state.screen = 'locate';
          state.locFrom = 'home';
          if (errEl) errEl.textContent = 'GPS is slow — drag the green pin onto you, or tap ◎ when the blue dot appears.';
          render();
        }, 8000);
      };
    }

    function bindLocate() {
      const mapEl = document.getElementById('locMap');
      const labelEl = document.querySelector('[data-loc-label]');
      const hits = document.querySelector('[data-loc-hits]');
      if (typeof mountLocationPicker !== 'function' || !mapEl) return;
      if (state.locHandle) { try { state.locHandle.destroy(); } catch (_) {} }
      startLiveLocation();
      const pinLat = state.loc.liveLat != null ? state.loc.liveLat : state.loc.lat;
      const pinLng = state.loc.liveLng != null ? state.loc.liveLng : state.loc.lng;
      state.locHandle = mountLocationPicker(mapEl, {
        lat: pinLat, lng: pinLng,
        liveLat: state.loc.liveLat, liveLng: state.loc.liveLng,
        custom: !!(state.loc.custom || state.loc.frozen),
        frozen: !!state.loc.frozen,
      });
      paintLiveUi();
      let seq = 0;
      if (state.locHandle) {
        state.locHandle.onMoveEnd((lat, lng) => {
          state.loc._draft = { lat, lng, label: (labelEl && labelEl.textContent) || state.loc.label };
          if (labelEl && (!labelEl.textContent || labelEl.textContent === 'Finding your location…')) {
            labelEl.textContent = 'Current location';
          }
          const n = ++seq;
          labelAt(lat, lng).then((label) => {
            if (n !== seq) return;
            if (labelEl) labelEl.textContent = label;
            state.loc._draft = { lat, lng, label };
          }).catch(() => {});
        });
      }
      const back = document.querySelector('[data-loc-back]');
      if (back) back.onclick = () => { state.screen = state.locFrom || 'home'; render(); };
      const me = document.querySelector('[data-loc-me]');
      if (me) me.onclick = () => {
        startLiveLocation();
        if (state.loc.liveLat == null) return;
        if (state.locHandle && state.locHandle.goLive) state.locHandle.goLive(state.loc.liveLat, state.loc.liveLng, 18);
        else state.locHandle && state.locHandle.setView(state.loc.liveLat, state.loc.liveLng, 18);
      };
      const ok = document.querySelector('[data-loc-ok]');
      if (ok) ok.onclick = () => {
        if (state.loc.frozen) {
          state.screen = state.locFrom || 'home';
          render();
          return;
        }
        const c = state.locHandle ? state.locHandle.getCenter() : { lat: state.loc.lat, lng: state.loc.lng };
        const label = (labelEl && labelEl.textContent) || (state.loc._draft && state.loc._draft.label) || state.loc.label;
        setPlace(c.lat, c.lng, label, true);
        state.screen = state.locFrom || 'home';
        render();
      };
      const q = document.getElementById('locQ');
      let st;
      if (q) q.oninput = () => {
        clearTimeout(st);
        st = setTimeout(async () => {
          if (typeof searchPlaces !== 'function') return;
          const list = await searchPlaces(q.value);
          if (!hits) return;
          if (!list.length) { hits.classList.add('hidden'); hits.innerHTML = ''; return; }
          hits.classList.remove('hidden');
          hits.innerHTML = list.map((p, i) => `<button type="button" data-hit="${i}">${esc(p.label)}</button>`).join('');
          hits.querySelectorAll('[data-hit]').forEach((b) => {
            b.onclick = () => {
              const p = list[Number(b.dataset.hit)];
              hits.classList.add('hidden');
              q.value = p.label;
              if (state.locHandle) state.locHandle.setView(p.lat, p.lng, 18);
              if (labelEl) labelEl.textContent = p.label;
              state.loc._draft = p;
            };
          });
        }, 280);
      };
    }

    function bindApp() {
      const root = document.getElementById('root');
      root.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; state.screen = 'home'; render(); });
      const q = document.getElementById('q');
      if (q) {
        q.oninput = (e) => {
          state.query = e.target.value;
          if (state.screen !== 'search') state.screen = 'search';
          render({ keepScroll: true });
          const n = document.getElementById('q');
          if (n) { n.focus(); n.selectionStart = n.selectionEnd = n.value.length; }
        };
        q.onfocus = () => {
          if (state.screen === 'search') return;
          state.screen = 'search';
          render({ keepScroll: true });
          const n = document.getElementById('q');
          if (n) n.focus();
        };
      }
      root.querySelectorAll('[data-cat]').forEach((b) => b.onclick = () => { state.category = b.dataset.cat; render({ keepScroll: true }); });
      root.querySelectorAll('[data-go-search]').forEach((b) => b.onclick = () => { state.screen = 'search'; render(); });
      root.querySelectorAll('[data-shop]').forEach((b) => b.onclick = () => { if (!b.dataset.shop) return; state.shopId = b.dataset.shop; state.screen = 'shop'; render(); });
      root.querySelectorAll('[data-fav]').forEach((b) => b.onclick = (e) => {
        e.stopPropagation();
        const id = b.dataset.fav;
        if (state.favs.includes(id)) state.favs = state.favs.filter((x) => x !== id);
        else state.favs.push(id);
        saveFavs(); render({ keepScroll: true });
      });
      root.querySelectorAll('[data-add]').forEach((b) => b.onclick = (e) => {
        e.stopPropagation();
        const item = API.items.find((i) => i.id === b.dataset.add);
        if (item) addToCart(item);
      });
      root.querySelectorAll('[data-back]').forEach((b) => b.onclick = () => { state.screen='home'; state.tab='home'; render(); });
      root.querySelectorAll('[data-mtab]').forEach((b) => b.onclick = () => { state.menuTab = b.dataset.mtab; render({ keepScroll: true }); });
      root.querySelectorAll('[data-mcat]').forEach((b) => b.onclick = () => { state.menuCat = b.dataset.mcat; render({ keepScroll: true }); });
      root.querySelectorAll('[data-qty]').forEach((b) => b.onclick = () => setQty(b.dataset.qty, Number(b.dataset.d)));
      root.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => { state.screen = b.dataset.go; render(); });
      root.querySelectorAll('[data-open-loc]').forEach((b) => b.onclick = () => {
        state.locFrom = state.screen === 'checkout' ? 'checkout' : 'home';
        state.screen = 'locate';
        render();
      });
      root.querySelectorAll('input[name="ship"]').forEach((el) => el.onchange = () => { state.deliveryType = el.value; render({ keepScroll: true }); });
      root.querySelectorAll('input[name="pay"]').forEach((el) => el.onchange = () => {
        pullCardDraft();
        state.payKind = el.value === 'card' ? 'card' : 'cash';
        state.cardAuth = null;
        state.paymentObj = null;
        state.cardErr = '';
        if (state.payKind === 'card' && (!state.cardId || state.cardId === 'cash')) {
          state.cardId = ((state.cards || [])[0] && state.cards[0].id) || 'new';
        }
        render({ keepScroll: true });
      });
      root.querySelectorAll('input[name="cardid"]').forEach((el) => el.onchange = () => {
        pullCardDraft();
        state.cardId = el.value;
        state.cardErr = '';
        render({ keepScroll: true });
      });
      const num = document.getElementById('cardNum');
      if (num) num.oninput = () => {
        num.value = formatCard(num.value);
        if (!state.cardDraft) state.cardDraft = { number: '', name: '', exp: '', save: true };
        state.cardDraft.number = num.value;
        const b = num.parentElement && num.parentElement.querySelector('.card-brand');
        const brand = cardBrand(num.value);
        if (b) b.textContent = brand === 'Card' ? '' : brand;
      };
      const exp = document.getElementById('cardExp');
      if (exp) exp.oninput = () => {
        exp.value = formatExp(exp.value);
        if (!state.cardDraft) state.cardDraft = { number: '', name: '', exp: '', save: true };
        state.cardDraft.exp = exp.value;
      };
      const cname = document.getElementById('cardName');
      if (cname) cname.oninput = () => {
        if (!state.cardDraft) state.cardDraft = { number: '', name: '', exp: '', save: true };
        state.cardDraft.name = cname.value;
      };
      const csave = document.getElementById('cardSave');
      if (csave) csave.onchange = () => {
        if (!state.cardDraft) state.cardDraft = { number: '', name: '', exp: '', save: true };
        state.cardDraft.save = !!csave.checked;
      };
      const addCard = root.querySelector('[data-add-card]');
      if (addCard) addCard.onclick = () => {
        state._addCard = true;
        state.cardErr = '';
        state.cardDraft = { number: '', name: '', exp: '', save: true };
        render({ keepScroll: true });
      };
      const cancelCard = root.querySelector('[data-cancel-card]');
      if (cancelCard) cancelCard.onclick = () => {
        state._addCard = false;
        state.cardErr = '';
        render({ keepScroll: true });
      };
      const saveCardBtn = root.querySelector('[data-save-card]');
      if (saveCardBtn) saveCardBtn.onclick = () => {
        pullCardDraft();
        const rec = validateCard();
        if (!rec.ok) { state.cardErr = rec.err; render({ keepScroll: true }); return; }
        rememberCard(rec);
        state._addCard = false;
        state.cardErr = '';
        state.cardDraft = { number: '', name: '', exp: '', save: true };
        render({ keepScroll: true });
      };
      root.querySelectorAll('[data-del-card]').forEach((b) => b.onclick = () => {
        state.cards = (state.cards || []).filter((c) => c.id !== b.dataset.delCard);
        saveCards();
        render({ keepScroll: true });
      });
      const place = document.getElementById('place');
      async function placeNow() {
        const addr = document.getElementById('addr');
        if (addr) state.address = addr.value;
        const payEl = document.querySelector('input[name="pay"]:checked');
        if (payEl && payEl.value === 'card') state.payKind = 'card';
        else if (payEl && payEl.value !== 'wallet') state.payKind = 'cash';
        if (state.payKind === 'card') {
          if (state.cardAuth && state.cardAuth.last4) {
            state.payment = state.cardAuth.brand + ' •••• ' + state.cardAuth.last4;
          } else {
            pullCardDraft();
            const cid = ((document.querySelector('input[name="cardid"]:checked') || {}).value) || state.cardId || 'new';
            state.cardId = cid;
            const saved = (state.cards || []).find((c) => c.id === cid);
            const rec = validateCard({ saved: saved });
            if (!rec.ok) {
              state.cardErr = rec.err;
              render({ keepScroll: true });
              return;
            }
            if (!saved && rec.save) rememberCard(rec);
            state.cardAuth = { brand: rec.brand, last4: rec.last4 };
            state.payment = rec.brand + ' •••• ' + rec.last4;
            state.cardErr = '';
          }
        } else {
          state.cardAuth = null;
          state.payment = 'Cash on delivery';
        }
        if (!state.cart.length) return;
        const pin = deliveryPoint();
        if (!state.loc.custom && state.loc.liveLat == null && !savedGps) {
          state.locFrom = 'checkout';
          state.screen = 'locate';
          startLiveLocation();
          render();
          return;
        }
        if (!API.isWhatsAppVerified || !API.isWhatsAppVerified()) {
          state.wa = { open: true, step: 'phone', phone: state.wa.phone || '', err: '', mode: 'order' };
          render({ keepScroll: true });
          return;
        }
        if (place) { place.disabled = true; place.textContent = state.payKind === 'card' ? 'Paying…' : 'Placing…'; }
        try {
          if (!state.loc.custom && !state.loc.frozen && pin.lat != null) {
            setPlace(pin.lat, pin.lng, state.loc.label, false);
          }
          let payment = state.paymentObj || null;
          if (state.payKind === 'card' && !payment) {
            state.paying = true;
            render({ keepScroll: true });
            const numEl = document.getElementById('cardNum');
            payment = await API.chargeCard({
              amount: cartTotal() + fee(),
              shopCredit: cartTotal(),
              riderCredit: fee(),
              brand: (state.cardAuth && state.cardAuth.brand) || 'Card',
              last4: (state.cardAuth && state.cardAuth.last4) || '',
              number: numEl ? numEl.value : '',
            });
            state.paymentObj = payment;
            state.payment = (payment.brand || 'Card') + (payment.last4 ? (' •••• ' + payment.last4) : '');
          }
          const order = await API.placeOrder({
            shopId: state.cart[0].shopId, userId: API.user.id, customerName: API.user.name,
            customerPhone: API.user.phone, address: state.address, note: state.note,
            paymentMethod: state.payment, deliveryType: state.deliveryType, deliveryFee: fee(),
            deliveryLat: pin.lat, deliveryLng: pin.lng, items: state.cart,
            payment: payment,
          });
          state.cart = []; saveCart();
          state.cardAuth = null;
          state.paymentObj = null;
          state.paying = false;
          state.loc.custom = true;
          state.loc.frozen = true;
          state.lastOrder = order;
          state.tab = 'orders';
          state.wa = { open: false, step: 'phone', phone: '', err: '' };
          if (order && order.id && !(API.orders || []).some((o) => o.id === order.id)) {
            API.orders.unshift(order);
          }
          openTrack(order.id, true);
        } catch (e) {
          state.paying = false;
          if (e && e.code === 'WHATSAPP_REQUIRED') {
            state.wa = { open: true, step: 'phone', phone: state.wa.phone || '', err: '', mode: 'order' };
            render({ keepScroll: true });
            return;
          }
          state.cardErr = e.message || 'Payment failed.';
          if (place) { place.disabled = false; place.textContent = state.payKind === 'card' ? 'Pay ' + rs(cartTotal() + fee()) : 'Place Order'; }
          render({ keepScroll: true });
        }
      }
      if (place) place.onclick = placeNow;
      bindWaSheet(placeNow);
      root.querySelectorAll('[data-track]').forEach((b) => b.onclick = () => openTrack(b.dataset.track, true));
      root.querySelectorAll('[data-chat]').forEach((b) => b.onclick = () => {
        const o = API.orders.find((x) => x.id === b.dataset.chat);
        if (API.canChat && !API.canChat(o, 'customer')) return;
        state.trackId = b.dataset.chat;
        state.screen = 'chat';
        state.lockTrack = false;
        if (API.markChatRead) API.markChatRead(state.trackId, 'customer');
        render();
      });
      root.querySelectorAll('[data-back-track]').forEach((b) => b.onclick = () => { state.screen = 'track'; state.lockTrack = true; render(); });
      root.querySelectorAll('[data-track-back]').forEach((b) => b.onclick = leaveTrack);
      root.querySelectorAll('[data-done]').forEach((b) => b.onclick = leaveTrack);
      root.querySelectorAll('[data-zoom]').forEach((b) => b.onclick = () => {
        if (!state.mapHandle) return;
        if (b.dataset.zoom === 'in') state.mapHandle.zoomIn(); else state.mapHandle.zoomOut();
      });
      const loc = root.querySelector('[data-locate]');
      if (loc) loc.onclick = () => {
        const o = API.orders.find((x) => x.id === state.trackId);
        if (state.mapHandle && o) state.mapHandle.locate(o);
      };
      async function sendUserChat(text) {
        const body = String(text || '').trim();
        if (!body || !state.trackId) return;
        const form = document.getElementById('chatForm');
        if (form && form.text) form.text.value = '';
        try {
          await API.sendMessage(state.trackId, API.user.name, 'customer', body);
        } catch (err) { alert(err.message); return; }
        if (API.markChatRead) API.markChatRead(state.trackId, 'customer');
        const keep = document.querySelector('[data-chat-root]');
        if (keep) paintUserChat(keep);
        const input = document.querySelector('#chatForm input[name="text"]');
        if (input) input.focus();
      }
      const form = document.getElementById('chatForm');
      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          await sendUserChat(form.text && form.text.value);
        };
        const input = form.querySelector('input[name="text"]');
        if (input) input.addEventListener('focus', bindChatKeyboard);
      }
      root.querySelectorAll('[data-quick]').forEach((b) => {
        b.onclick = () => sendUserChat(b.getAttribute('data-quick'));
      });
      const logout = document.getElementById('logout');
      if (logout) logout.onclick = () => {
        API.logout();
        restoredSession = false;
        state.cart = [];
        state.favs = [];
        state.lastOrder = null;
        state.trackId = null;
        localUserId = '';
        state.gate = 'login';
        state.loc._gps = false;
        render();
      };
    }

    API.on(() => {
      if (state.gate === 'otp' || state.gate === 'register' || state.gate === 'login' || state.gate === 'onboard' || state.gate === 'splash' || state.gate === 'download') {
        if (!API.user) return;
      }
      render({ keepScroll: true });
    });
    tryAutoGps();
    render();
  </script>
</body>
</html>
