<!DOCTYPE html>
<html lang="en" data-role="customer">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Uber Eats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/track.css" />
</head>
<body>
  <div class="app" id="root"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/maps.js"></script>
  <script src="/js/track-ui.js"></script>
  <script src="/js/otp-login.js"></script>
  <script>
    const demo = new URLSearchParams(location.search).has('demo');
    const state = {
      tab: 'home',
      screen: 'home',
      query: '',
      category: 'All',
      shopId: null,
      trackId: null,
      cart: JSON.parse(sessionStorage.getItem('sd_cart') || '[]'),
      note: '',
      address: '45 Galle Road, Colombo 03',
      payment: 'Cash on delivery',
      mapHandle: null,
      lockTrack: false,
    };
    function saveCart() { sessionStorage.setItem('sd_cart', JSON.stringify(state.cart)); }
    function cartCount() { return state.cart.reduce((s, i) => s + i.qty, 0); }
    function cartTotal() { return state.cart.reduce((s, i) => s + i.qty * i.price, 0); }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function lkr(n) { return 'LKR ' + Math.round(Number(n)||0).toLocaleString('en-LK'); }
    function shopImg(s) { return s.image || '/img/shop-curry.jpg'; }
    function itemImg(it) {
      if (it.image) return it.image;
      return shopImg(API.shopOf(it.shopId));
    }
    function addToCart(item) {
      state.cart = state.cart.filter((c) => c.shopId === item.shopId);
      const hit = state.cart.find((c) => c.id === item.id);
      if (hit) hit.qty += 1;
      else state.cart.push({ id: item.id, shopId: item.shopId, name: item.name, price: item.price, qty: 1 });
      saveCart();
      render();
    }
    function setQty(id, d) {
      const hit = state.cart.find((c) => c.id === id);
      if (!hit) return;
      hit.qty += d;
      if (hit.qty <= 0) state.cart = state.cart.filter((c) => c.id !== id);
      saveCart();
      render();
    }

    const NAV = `
      <nav class="nav">
        <button data-tab="home" class="${'${tabhome}'}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 4 9v12h6v-7h4v7h6V9z"/></svg>Home</button>
        <button data-tab="browse" class="${'${tabbrowse}'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>Browse</button>
        <button data-tab="cart" class="${'${tabcart}'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M6 6 5 3H2"/></svg>Carts</button>
        <button data-tab="orders" class="${'${taborders}'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4h10v16H7z"/><path d="M9 8h6M9 12h6"/></svg>Orders</button>
        <button data-tab="account" class="${'${tabaccount}'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M5 20c1.5-4 12.5-4 14 0"/></svg>Account</button>
      </nav>`;
    function nav() {
      return NAV
        .replace('${tabhome}', state.tab==='home'?'active':'')
        .replace('${tabbrowse}', state.tab==='browse'?'active':'')
        .replace('${tabcart}', state.tab==='cart'?'active':'')
        .replace('${taborders}', state.tab==='orders'?'active':'')
        .replace('${tabaccount}', state.tab==='account'?'active':'');
    }
    function cartbar() {
      if (!cartCount() || ['cart','checkout','track','chat'].includes(state.screen) || state.tab==='cart') return '';
      return `<div class="cartbar" data-tab="cart"><span>View cart · ${cartCount()}</span><span>${lkr(cartTotal())}</span></div>`;
    }
    function header() {
      return `<div class="ue-top">
        <div class="ue-loc">
          <div class="where">Colombo 03 ▾<small>Deliver now · ${esc(API.user?.address || 'Galle Road')}</small></div>
          <div class="ue-icons">
            <button class="icon-btn" data-tab="cart">🛒</button>
          </div>
        </div>
        <div class="search"><span>🔍</span><input id="q" placeholder="Food, groceries, drinks, etc" value="${esc(state.query)}" /></div>
      </div>`;
    }

    function storeCard(s, compact) {
      if (compact) {
        return `<div class="hcard" data-shop="${s.id}">
          <img src="${shopImg(s)}" alt="" />
          <b>${esc(s.name)}</b>
          <div class="fee">${s.fee ? lkr(s.fee)+' Delivery Fee' : 'LKR 0 Delivery Fee'} · ${esc(s.eta)}</div>
        </div>`;
      }
      return `<div class="store" data-shop="${s.id}">
        <div class="hero">
          <img src="${shopImg(s)}" alt="" />
          <button class="heart">♡</button>
          ${s.promo ? `<div class="promo">${esc(s.promo)}</div>` : ''}
        </div>
        <div class="meta">
          <div>
            <div class="name">${esc(s.name)}</div>
            <div class="fee">⬤ ${s.fee ? lkr(s.fee)+' Delivery Fee' : 'LKR 0 Delivery Fee'} · ${esc(s.eta)}</div>
          </div>
          <div class="rate">${s.rating}</div>
        </div>
      </div>`;
    }

    function homeView() {
      const q = state.query.toLowerCase();
      const shops = API.shops.filter((s) => !q || s.name.toLowerCase().includes(q) || s.category.toLowerCase().includes(q));
      const featured = shops.slice(0, 4);
      const live = TrackUI.liveOrder(API.orders);
      return `${header()}
        ${TrackUI.banner(live)}
        <div class="cats">
          ${[['All','🍽️'],['Sri Lankan','🍛'],['Fast Food','🍔'],['Pizza','🍕'],['Coffee','☕'],['Dessert','🧁'],['Bakery','🎂']].map(([c,e]) =>
            `<button class="cat ${state.category===c?'active':''}" data-cat="${c}"><div class="cico">${e}</div><span>${c}</span></button>`
          ).join('')}
        </div>
        <div class="banner">
          <img src="/img/banner-promo.jpg" alt="" />
          <div class="copy">
            <b>LKR 0 delivery fee from Burger House</b>
            <span class="chip">Details →</span>
          </div>
        </div>
        <div class="pad"><h2 class="sec">National brands</h2></div>
        <div class="hscroll">${featured.map((s) => storeCard(s, true)).join('')}</div>
        <div class="pad"><h2 class="sec">${q ? 'Search results' : 'Nearby in Colombo'}</h2></div>
        ${shops.filter((s) => state.category==='All' || s.category===state.category).map((s) => storeCard(s)).join('') || '<div class="pad muted">No restaurants match.</div>'}
        ${cartbar()}${nav()}`;
    }

    function browseView() {
      const items = API.items.filter((it) => {
        const shop = API.shopOf(it.shopId);
        const q = state.query.toLowerCase();
        return !q || it.name.toLowerCase().includes(q) || shop.name.toLowerCase().includes(q);
      });
      return `${header()}
        <div class="pad"><h2 class="sec">Browse Colombo</h2></div>
        ${items.map((it) => {
          const shop = API.shopOf(it.shopId);
          return `<div class="item" data-shop="${shop.id}">
            <div class="grow">
              <b>${esc(it.name)}</b>
              <p>${esc(it.desc || shop.name)}</p>
              <div class="price">${lkr(it.price)}</div>
            </div>
            <img src="${itemImg(it)}" alt="" />
          </div>`;
        }).join('')}
        ${cartbar()}${nav()}`;
    }

    function shopView() {
      const shop = API.shopOf(state.shopId);
      const items = API.items.filter((i) => i.shopId === shop.id);
      return `<div class="shophead">
          <img src="${shopImg(shop)}" alt="" />
          <button class="back" data-back>←</button>
        </div>
        <div class="pad" style="padding-top:12px">
          <h2 class="sec" style="margin-top:0">${esc(shop.name)}</h2>
          <div class="muted">${shop.rating} ★ (${shop.reviews}) · ${esc(shop.category)} · ${esc(shop.eta)}</div>
          <div class="fee">${shop.fee ? lkr(shop.fee)+' Delivery Fee' : 'LKR 0 Delivery Fee'}</div>
        </div>
        ${items.map((it) => `
          <div class="item">
            <div class="grow">
              <b>${esc(it.name)}</b>
              <p>${esc(it.desc || it.category)}</p>
              <div class="price">${lkr(it.price)}</div>
              ${it.isAvailable ? `<button class="add" data-add="${it.id}">Add</button>` : `<span class="muted">Sold out</span>`}
            </div>
            <img src="${itemImg(it)}" alt="" />
          </div>`).join('')}
        ${cartbar()}${nav()}`;
    }

    function cartView() {
      if (!state.cart.length) {
        return `${header()}<div class="pad"><h2 class="sec">Carts</h2><p class="sub">Add items from a restaurant to start a cart.</p></div>${nav()}`;
      }
      const shop = API.shopOf(state.cart[0].shopId);
      const sub = cartTotal();
      const fee = sub > 2000 ? 0 : (shop.fee || 250);
      return `${header()}
        <div class="pad">
          <h2 class="sec">${esc(shop.name)}</h2>
          ${state.cart.map((c) => `
            <div class="row" style="padding:10px 0;border-bottom:1px solid #f3f3f3">
              <div class="grow"><b>${esc(c.name)}</b><div class="muted">${lkr(c.price)}</div></div>
              <div class="qty">
                <button data-qty="${c.id}" data-d="-1">−</button><b>${c.qty}</b>
                <button data-qty="${c.id}" data-d="1">+</button>
              </div>
            </div>`).join('')}
          <div style="margin-top:16px" class="muted">Subtotal ${lkr(sub)}</div>
          <div class="muted">Delivery ${fee ? lkr(fee) : 'LKR 0'}</div>
          <h2 class="sec">Total ${lkr(sub+fee)}</h2>
          <button class="btn full" data-go="checkout">Go to checkout</button>
        </div>${nav()}`;
    }

    function checkoutView() {
      const sub = cartTotal();
      const shop = state.cart[0] ? API.shopOf(state.cart[0].shopId) : {};
      const fee = sub > 2000 ? 0 : (shop.fee || 250);
      return `<div class="ue-top"><button class="back" style="position:static" data-tab="cart">←</button></div>
        <div class="pad">
          <h2 class="sec">Checkout</h2>
          <div class="field"><label>Deliver to</label><input id="addr" value="${esc(state.address)}" /></div>
          <div class="field"><label>Note for courier</label><input id="note" placeholder="Gate code, extra chilli…" value="${esc(state.note)}" /></div>
          <div class="field"><label>Payment</label>
            <select id="pay"><option>Cash on delivery</option><option>Card on delivery</option></select>
          </div>
          <p class="muted">Pay ${lkr(sub+fee)} when your order arrives.</p>
          <button class="btn full green" id="place">Place order</button>
        </div>`;
    }

    function ordersView() {
      return `${header()}
        <div class="pad"><h2 class="sec">Orders</h2></div>
        ${API.orders.map((o) => `
          <div class="store" data-track="${esc(o.id)}" style="padding-bottom:8px">
            <div class="row">
              <img src="${shopImg(API.shopOf(o.shopId))}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:8px" />
              <div class="grow">
                <div class="name">${esc(o.shopName)}</div>
                <div class="muted">${esc(o.items.map((i)=>i.name+' ×'+i.qty).join(', '))}</div>
                <div class="fee">${lkr(o.totalAmount)}</div>
              </div>
              <span class="status ${o.status}">${API.statusLabel(o.status)}</span>
            </div>
          </div>`).join('') || '<div class="pad muted">No orders yet.</div>'}
        ${nav()}`;
    }

    function trackView() {
      const o = API.orders.find((x) => x.id === state.trackId);
      if (!o) return `<div class="pad">Order not found.</div>${nav()}`;
      return TrackUI.screen(o, 'customer');
    }

    function chatView() {
      const o = API.orders.find((x) => x.id === state.trackId);
      const msgs = API.messages[state.trackId] || [];
      return `<div class="ue-top"><button class="back" style="position:static" data-back-track>←</button>
          <b style="margin-left:8px">${esc(o?.riderName || 'Courier')}</b></div>
        <div class="chat" style="flex:1;min-height:0">
          <div class="bubbles" id="bubbles">
            ${msgs.map((m) => `<div class="bubble ${m.role==='customer'?'me':m.role==='system'?'sys':'them'}">${esc(m.text)}</div>`).join('')}
          </div>
          <form class="composer" id="chatForm">
            <input name="text" placeholder="Message your courier…" autocomplete="off" />
            <button class="btn sm" type="submit">Send</button>
          </form>
        </div>`;
    }

    function accountView() {
      const u = API.user || {};
      return `${header()}
        <div class="pad">
          <h2 class="sec">${esc(u.name)}</h2>
          <p class="muted">${esc(u.phone)}</p>
          <div class="card"><div class="muted">Saved address</div><b>${esc(u.address)}</b></div>
          <p class="muted" style="margin-top:16px">Link Android APKs to this server</p>
          <code style="font-size:12px;word-break:break-all">${location.origin}</code>
          <div style="height:16px"></div>
          <button class="btn ghost full" id="logout">Sign out</button>
        </div>${nav()}`;
    }

    function loginView() {
      return OtpLogin.render({
        role: 'customer',
        title: 'Enter your mobile number',
        sub: 'We’ll send a 4-digit code on WhatsApp to this number. Then you enter the app.',
        phone: '0771234567',
      });
    }

    function openTrack(id, lock) {
      state.trackId = id;
      state.screen = 'track';
      state.lockTrack = lock !== false;
      render();
    }
    function leaveTrack() {
      state.lockTrack = false;
      state.screen = 'home';
      state.tab = 'home';
      render();
    }
    function render() {
      const root = document.getElementById('root');
      if (!API.user) {
        if (root.querySelector('[data-otp-root]')) return;
        root.innerHTML = loginView();
        OtpLogin.bind({ role: 'customer', onReady: () => { state.tab = 'home'; state.screen = 'home'; render(); } });
        return;
      }
      if (state.lockTrack && state.trackId) {
        const live = API.orders.find((x) => x.id === state.trackId);
        if (live && live.status !== 'cancelled') state.screen = 'track';
      }
      if (state.screen === 'chat') { root.innerHTML = chatView(); const b=document.getElementById('bubbles'); if(b) b.scrollTop=b.scrollHeight; bind(); return; }
      if (state.screen === 'checkout') { root.innerHTML = checkoutView(); bind(); return; }
      if (state.screen === 'shop') { root.innerHTML = shopView(); bind(); return; }
      if (state.screen === 'track') {
        const existing = root.querySelector('[data-track-root="'+state.trackId+'"]');
        const o = API.orders.find((x) => x.id === state.trackId);
        const hasRider = o && o.riderName ? '1' : '0';
        if (existing && o && state.mapHandle && existing.dataset.hasRider === hasRider) {
          state.mapHandle.update(o);
          TrackUI.paint(existing, o, 'customer');
          return;
        }
        if (state.mapHandle) { try { state.mapHandle.destroy(); } catch(_){} state.mapHandle = null; }
        root.innerHTML = trackView();
        bind();
        const el = document.getElementById('map');
        if (el && o) state.mapHandle = mountTrackingMap(el, o);
        return;
      }
      if (state.mapHandle) { try { state.mapHandle.destroy(); } catch(_){} state.mapHandle = null; }
      if (state.tab === 'browse') root.innerHTML = browseView();
      else if (state.tab === 'cart') root.innerHTML = cartView();
      else if (state.tab === 'orders') root.innerHTML = ordersView();
      else if (state.tab === 'account') root.innerHTML = accountView();
      else root.innerHTML = homeView();
      bind();
    }

    function bind() {
      const root = document.getElementById('root');
      root.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => {
        state.tab = b.dataset.tab; state.screen = 'home'; render();
      });

      const q = document.getElementById('q');
      if (q) q.oninput = (e) => { state.query = e.target.value; state.tab = 'browse'; render(); const n=document.getElementById('q'); if(n){ n.focus(); n.selectionStart=n.selectionEnd=n.value.length; } };
      root.querySelectorAll('[data-cat]').forEach((b) => b.onclick = () => { state.category = b.dataset.cat; state.tab='home'; state.screen='home'; render(); });
      root.querySelectorAll('[data-shop]').forEach((b) => b.onclick = () => { state.shopId = b.dataset.shop; state.screen = 'shop'; render(); });
      root.querySelectorAll('[data-add]').forEach((b) => b.onclick = (e) => {
        e.stopPropagation();
        const item = API.items.find((i) => i.id === b.dataset.add);
        if (item) addToCart(item);
      });
      root.querySelectorAll('[data-back]').forEach((b) => b.onclick = () => { state.screen='home'; state.tab='home'; render(); });
      root.querySelectorAll('[data-qty]').forEach((b) => b.onclick = () => setQty(b.dataset.qty, Number(b.dataset.d)));
      root.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => { state.screen = b.dataset.go; render(); });
      const place = document.getElementById('place');
      if (place) place.onclick = async () => {
        state.address = document.getElementById('addr').value;
        state.note = document.getElementById('note').value;
        state.payment = document.getElementById('pay').value;
        if (!state.cart.length) return;
        place.disabled = true; place.textContent = 'Placing…';
        try {
          const order = await API.placeOrder({
            shopId: state.cart[0].shopId, userId: API.user.id, customerName: API.user.name,
            customerPhone: API.user.phone, address: state.address, note: state.note,
            paymentMethod: state.payment, deliveryLat: 6.9271, deliveryLng: 79.8612, items: state.cart,
          });
          state.cart = []; saveCart();
          openTrack(order.id, true);
        } catch (e) { alert(e.message); place.disabled = false; }
      };
      root.querySelectorAll('[data-track]').forEach((b) => b.onclick = () => openTrack(b.dataset.track, true));
      root.querySelectorAll('[data-chat]').forEach((b) => b.onclick = () => { state.trackId = b.dataset.chat; state.screen = 'chat'; state.lockTrack = false; render(); });
      const moreBtn = root.querySelector('[data-more]');
      const morePanel = root.querySelector('[data-more-panel]');
      if (moreBtn && morePanel) moreBtn.onclick = () => morePanel.classList.toggle('hidden');
      const backTrack = root.querySelector('[data-back-track]');
      if (backTrack) backTrack.onclick = () => { state.screen = 'track'; state.lockTrack = true; render(); };
      root.querySelectorAll('[data-track-back]').forEach((b) => b.onclick = leaveTrack);
      root.querySelectorAll('[data-done]').forEach((b) => b.onclick = leaveTrack);
      const form = document.getElementById('chatForm');
      if (form) form.onsubmit = async (e) => {
        e.preventDefault();
        const text = form.text.value.trim();
        if (!text) return;
        form.text.value = '';
        await API.sendMessage(state.trackId, API.user.name, 'customer', text);
      };
      const logout = document.getElementById('logout');
      if (logout) logout.onclick = () => { API.user = null; sessionStorage.removeItem('sd_user_customer'); render(); };
    }

    API.on(() => {
      if (!API.user && document.querySelector('[data-otp-root]')) return;
      render();
    });
  </script>
</body>
</html>
