    const seenOnboard = localStorage.getItem('qb_onboard') === '1' || sessionStorage.getItem('qb_onboard') === '1';

    const state = {

      cardErr: '',

      regRole: 'customer',

    if (state.gate === 'splash') {
      setTimeout(() => {

    function accountKey() {
      const email = API.user && String(API.user.email || '').trim().toLowerCase();
      if (email) return 'e_' + email;
      if (API.user && API.user.id) return API.user.id;
      return 'guest';
    }
    function cartKey() { return 'sd_cart_' + accountKey(); }
    function saveCart() { sessionStorage.setItem(cartKey(), JSON.stringify(state.cart)); }
    function loadCart() {
      try {
        const arr = JSON.parse(sessionStorage.getItem(cartKey()) || '[]');
        state.cart = Array.isArray(arr) ? arr : [];
      } catch (_) { state.cart = []; }
    }
    function favKey() { return 'qb_favs_' + accountKey(); }
    function loadFavs() {
      try {
        const raw = localStorage.getItem(favKey()) || '[]';
        const arr = JSON.parse(raw);
        state.favs = Array.isArray(arr) ? arr.map(String) : [];
      } catch (_) { state.favs = []; }
      if (state.favs.length && API.ensureShops) API.ensureShops(state.favs).catch(function () {});
    }
    function saveFavs() {
      try { localStorage.setItem(favKey(), JSON.stringify(state.favs)); } catch (_) {}
    }
    function seenKey() { return 'qb_seen_' + accountKey(); }
    function loadSeen() {
      try {
        const arr = JSON.parse(localStorage.getItem(seenKey()) || '[]');
        state.seen = Array.isArray(arr) ? arr : [];
      } catch (_) { state.seen = []; }
    }
    function saveSeen() {
      try { localStorage.setItem(seenKey(), JSON.stringify(state.seen || [])); } catch (_) {}
    }
    function noteSeen(it) {
      if (!it || !it.id) return;
      const row = { id: String(it.id), shopId: it.shopId, ts: Date.now() };
      state.seen = (state.seen || []).filter((x) => String(x.id) !== row.id);
      state.seen.unshift(row);
      state.seen = state.seen.slice(0, 40);
      saveSeen();
    }
    function loadAisleMap() {
      try {
        const o = JSON.parse(localStorage.getItem('qb_aisles') || '{}');
        state.aisleMap = o && typeof o === 'object' ? o : {};
      } catch (_) { state.aisleMap = {}; }
    }
    function saveAisleMap() {
      try { localStorage.setItem('qb_aisles', JSON.stringify(state.aisleMap || {})); } catch (_) {}
    }
    function cardsKey() { return 'qb_cards_' + accountKey(); }
    function loadCards() {
      try {
        const arr = JSON.parse(localStorage.getItem(cardsKey()) || '[]');
        state.cards = Array.isArray(arr) ? arr.filter((c) => c && c.last4) : [];
      } catch (_) { state.cards = []; }
    }
    function saveCards() {
      try { localStorage.setItem(cardsKey(), JSON.stringify(state.cards)); } catch (_) {}
    }
    function cardDigits(v) { return String(v || '').replace(/\D/g, ''); }
    function cardBrand(num) {
      const d = cardDigits(num);
      if (/^4/.test(d)) return 'Visa';
      if (/^(5[1-5]|2[2-7])/.test(d)) return 'Mastercard';
      if (/^3[47]/.test(d)) return 'Amex';
      if (/^35/.test(d)) return 'JCB';
      if (/^62/.test(d)) return 'UnionPay';
      if (/^(6011|65)/.test(d)) return 'Discover';
      return 'Card';
    }
    function luhnOk(num) {
      const d = cardDigits(num);
      if (d.length < 13 || d.length > 19) return false;
      let s = 0, alt = false;
      for (let i = d.length - 1; i >= 0; i--) {
        let n = d.charCodeAt(i) - 48;
        if (n < 0 || n > 9) return false;
        if (alt) { n *= 2; if (n > 9) n -= 9; }
        s += n; alt = !alt;
      }
      return s % 10 === 0;
    }
    function formatCard(v) {
      const d = cardDigits(v).slice(0, 19);
      return d.replace(/(\d{4})(?=\d)/g, '$1 ').trim();
    }
    function formatExp(v) {
      const d = cardDigits(v).slice(0, 4);
      return d.length <= 2 ? d : d.slice(0, 2) + '/' + d.slice(2);
    }
    function expOk(exp) {
      const m = String(exp || '').trim().match(/^(\d{1,2})\s*\/\s*(\d{2})$/);
      if (!m) return false;
      const mo = Number(m[1]), yr = 2000 + Number(m[2]);
      if (mo < 1 || mo > 12) return false;
      return new Date(yr, mo, 0, 23, 59, 59) >= new Date();
    }
    function cardLabel(c) { return (c.brand || 'Card') + ' •••• ' + c.last4; }
    function isCardPaid(method) {
      const m = String(method || '').toLowerCase();
      if (m.indexOf('cash') !== -1) return false;
      return /visa|master|amex|unionpay|jcb|discover|card|••••/.test(m);
    }
    function openCodOrder() {
      if (API.openCodOrder) return API.openCodOrder();
      return (API.orders || []).find((o) => {
        if (!o || o.status === 'delivered' || o.status === 'cancelled') return false;
        if (API.isCardMethod && API.isCardMethod(o.paymentMethod)) return false;
        const m = String(o.paymentMethod || 'cash').toLowerCase();
        return m.indexOf('cash') !== -1;
      }) || null;
    }
    function codLocked() { return !!openCodOrder(); }
    function pullCardDraft() {
      const num = document.getElementById('cardNum');
      const name = document.getElementById('cardName');
      const exp = document.getElementById('cardExp');
      const save = document.getElementById('cardSave');
      if (!state.cardDraft) state.cardDraft = { number: '', name: '', exp: '', save: true };
      if (num) state.cardDraft.number = num.value;
      if (name) state.cardDraft.name = name.value;
      if (exp) state.cardDraft.exp = exp.value;
      if (save) state.cardDraft.save = !!save.checked;
    }
    function rememberCard(rec) {
      const row = {
        id: 'c' + Date.now(),
        brand: rec.brand,
        last4: rec.last4,
        exp: rec.exp,
        name: rec.name || '',
      };
      state.cards = [row].concat((state.cards || []).filter((c) => !(c.last4 === row.last4 && c.brand === row.brand)));
      saveCards();
      return row;
    }
    function validateCard(opts) {
      opts = opts || {};
      const saved = opts.saved;
      const number = ((document.getElementById('cardNum') || {}).value || (state.cardDraft && state.cardDraft.number) || '');
      const name = ((document.getElementById('cardName') || {}).value || (state.cardDraft && state.cardDraft.name) || '').trim();
      const exp = ((document.getElementById('cardExp') || {}).value || (state.cardDraft && state.cardDraft.exp) || '').trim();
      const cvc = ((document.getElementById('cardCvc') || {}).value || '').replace(/\D/g, '');
      const brand = saved ? saved.brand : cardBrand(number);
      const amex = brand === 'Amex';
      if (!saved) {
        if (!luhnOk(number)) return { ok: false, err: 'Enter a valid card number.' };
        if (name.length < 2) return { ok: false, err: 'Enter the name on the card.' };
        if (!expOk(exp)) return { ok: false, err: 'Enter a valid expiry (MM/YY).' };
      }
      if (cvc.length !== (amex ? 4 : 3)) return { ok: false, err: amex ? 'Enter the 4-digit CVC.' : 'Enter the 3-digit CVC.' };
      const d = cardDigits(number);
      return {
        ok: true,
        brand: brand,
        last4: saved ? saved.last4 : d.slice(-4),
        exp: saved ? saved.exp : formatExp(exp),
        name: saved ? saved.name : name,
        save: !saved && !!(document.getElementById('cardSave') || { checked: true }).checked,
      };
    }
    function cardFormHtml(saved) {
      const d = state.cardDraft || {};
      const brand = cardBrand(d.number || '');
      if (saved) {
        return `<div class="card-form">
          <p class="card-using">Pay with <b>${esc(cardLabel(saved))}</b></p>
          <div class="card-field"><label>CVC</label><input id="cardCvc" inputmode="numeric" autocomplete="cc-csc" placeholder="${saved.brand==='Amex'?'1234':'123'}" maxlength="4" /></div>
          <p class="err" data-card-err>${esc(state.cardErr || '')}</p>
        </div>`;
      }
      return `<div class="card-form">
        <div class="card-field">
          <label>Card number</label>
          <div class="card-num">
            <input id="cardNum" inputmode="numeric" autocomplete="cc-number" placeholder="ACCT-000015" maxlength="23" value="${esc(formatCard(d.number || ''))}" />
            <span class="card-brand">${esc(brand === 'Card' ? '' : brand)}</span>
          </div>
        </div>
        <div class="card-field">
          <label>Name on card</label>
          <input id="cardName" autocomplete="cc-name" placeholder="Name on card" value="${esc(d.name || '')}" />
        </div>
        <div class="card-row">
          <div class="card-field">
            <label>Expiry</label>
            <input id="cardExp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/YY" maxlength="5" value="${esc(d.exp || '')}" />
          </div>
          <div class="card-field">
            <label>CVC</label>
            <input id="cardCvc" inputmode="numeric" autocomplete="cc-csc" placeholder="123" maxlength="4" />
          </div>
        </div>
        <label class="card-save"><input type="checkbox" id="cardSave" ${d.save === false ? '' : 'checked'} /> Save this card for next orders</label>
        <p class="err" data-card-err>${esc(state.cardErr || '')}</p>
        <p class="muted card-hint">Full card number and CVC are never stored.</p>
      </div>`;
    }
    function payBlock() {
      const blocked = codLocked();
      if (blocked && state.payKind !== 'card') state.payKind = 'card';
      const cashOn = state.payKind !== 'card';
      let html = `<h3>Payment Method</h3>
        <label class="pay-opt${blocked ? ' pay-disabled' : ''}"><input type="radio" name="pay" value="cash" ${cashOn ? 'checked' : ''} ${blocked ? 'disabled' : ''} /> Cash on Delivery</label>
        <label class="pay-opt"><input type="radio" name="pay" value="card" ${cashOn ? '' : 'checked'} /> Debit / Credit card</label>`;
      if (blocked) {
        const open = openCodOrder();
        const shop = (open && (open.shopName || 'your shop')) || 'your shop';
        html += `<p class="cod-lock">Cash on Delivery is locked until your current COD order from ${esc(shop)} is delivered or cancelled. You can still pay by card.</p>`;
      }
      if (!cashOn) {
        html += `<div class="card-form pay-lk">
          <p class="card-using">Pay securely on <b>Payments.lk</b> (sandbox). Card details stay on their page — never on QuickBite.</p>
          <p class="muted card-hint">Test card <b>4508 7500 1574 1019</b> · Exp <b>01/39</b> · any CVC</p>
          <p class="err" data-card-err>${esc(state.cardErr || '')}</p>
        </div>`;
      }
      return html;
    }
    let localUserId = '';
    function ensureUserLocal() {
      const id = accountKey();
      if (localUserId === id) return;
      localUserId = id;
      loadCart();
      loadFavs();
      loadSeen();
      loadAisleMap();
      loadCards();
      applySavedAddress();
    }
    ensureUserLocal();
    function cartCount() { return state.cart.reduce((s, i) => s + i.qty, 0); }
    function cartTotal() {
      if (API.cartPayTotal) return API.cartPayTotal(state.cart);
      return state.cart.reduce((s, i) => s + i.qty * i.price, 0);
    }
    function offerCap(label) {
      const t = String(label || '').trim();
      if (!t) return '';
      return `<span class="ue-cap">${esc(t)}</span>`;
    }
    function shopCap(s) {
      return offerCap(API.shopOfferCaption && s && API.shopOfferCaption(s.id));
    }
    function itemCap(it) {
      return offerCap(API.offerCaption && API.offerCaption(it));
    }
    function deliveredCount() {
      return (API.orders || []).filter((o) => o && o.status === 'delivered').length;
    }
    function fee() { return state.deliveryType === 'express' ? 360 : 200; }
    function shopFeeOf(s) {
      const n = Number(s && s.fee);
      return n > 0 ? Math.round(n) : 200;
    }
    function savedAddrKey() { return 'qb_saved_addr_' + (accountKey() || 'anon'); }
    function persistSavedAddress() {
      if (state.loc.lat == null || state.loc.lng == null) return;
      const rec = {
        lat: Number(state.loc.lat),
        lng: Number(state.loc.lng),
        label: state.loc.label || state.address || '',
        custom: !!state.loc.custom,
      };
      try { localStorage.setItem(savedAddrKey(), JSON.stringify(rec)); } catch (_) {}
      try { localStorage.setItem('qb_live_gps', JSON.stringify({ lat: rec.lat, lng: rec.lng, acc: state.loc.acc, label: rec.label })); } catch (_) {}
    }
    function applySavedAddress() {
      let rec = null;
      try { rec = JSON.parse(localStorage.getItem(savedAddrKey()) || 'null'); } catch (_) {}
      if (!rec || typeof rec.lat !== 'number' || typeof rec.lng !== 'number') return;
      state.loc.lat = rec.lat;
      state.loc.lng = rec.lng;
      if (rec.label) {
        state.loc.label = rec.label;
        state.address = rec.label;
      }
      state.loc.custom = !!rec.custom;
    }
    function setPlace(lat, lng, label, custom) {
      state.loc.lat = lat; state.loc.lng = lng;
      if (label) state.loc.label = label;
      state.address = state.loc.label;
      if (custom) state.loc.custom = true;
      else if (custom === false) state.loc.custom = false;
      window.QB_LIVE = { lat: state.loc.liveLat, lng: state.loc.liveLng };
      persistSavedAddress();
      paintAddrUi();
    }
    function paintAddrUi() {
      const el = document.querySelector('[data-addr-label]');
      if (el) el.textContent = state.loc.label || state.address || '';
      const kind = document.querySelector('[data-addr-kind]');
      if (kind) kind.textContent = state.loc.frozen ? 'Locked until this order is delivered' : (state.loc.custom ? 'Pinned on map' : 'Live GPS');
      const inp = document.getElementById('addrLine');
      if (inp && document.activeElement !== inp) inp.value = state.loc.label || state.address || '';
      const errEl = document.querySelector('[data-addr-err]');
      if (errEl && state.loc.liveLat != null) errEl.textContent = '';
    }
    function closeLocateScreen() {
      const from = state.locFrom;
      if (from === 'checkout') state.screen = 'checkout';
      else if (from === 'account' || from === 'addresses') {
        state.tab = 'account';
        state.screen = 'addresses';
      } else {
        state.screen = 'home';
      }
      render();
    }
    function deliveryPoint() {
      if (state.loc.custom || state.loc.frozen) return { lat: state.loc.lat, lng: state.loc.lng };
      if (state.loc.liveLat != null && state.loc.liveLng != null) {
        return { lat: state.loc.liveLat, lng: state.loc.liveLng };
      }
      return { lat: state.loc.lat, lng: state.loc.lng };
    }
    async function labelAt(lat, lng) {
      if (typeof reversePlace === 'function') return reversePlace(lat, lng);
      return lat.toFixed(5) + ', ' + lng.toFixed(5);
    }
    function gpsText() {
      if (state.loc.acc == null) return 'Waiting for GPS…';
      return 'GPS ±' + Math.max(1, Math.round(state.loc.acc)) + ' m';
    }
    function paintLiveUi() {
      const accEl = document.querySelector('[data-loc-acc]');
      if (accEl) accEl.textContent = gpsText();
      const errEl = document.querySelector('[data-loc-err]');
      if (errEl && state.loc.liveLat != null) errEl.textContent = '';
      if (state.locHandle && state.locHandle.setLive) {
        state.locHandle.setLive(state.loc.liveLat, state.loc.liveLng, state.loc.acc);
      }
    }
    function startLiveLocation() {
      if (!navigator.geolocation) {
        state.loc.err = 'This device has no GPS.';
        const errEl = document.querySelector('[data-loc-err]');
        if (errEl) errEl.textContent = state.loc.err;
        return;
      }
      const opt = { enableHighAccuracy: true, maximumAge: 30000, timeout: 25000 };
      const onFix = (pos) => {
        const acc = Number(pos.coords.accuracy || 999);
        if (state.loc.acc != null && state.loc.acc <= 12 && acc > 40) return;
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        state.loc.acc = acc;
        state.loc.liveLat = lat;
        state.loc.liveLng = lng;
        state.loc.err = '';
        window.QB_LIVE = { lat, lng, acc };
        if (API.setViewOrigin) API.setViewOrigin(lat, lng);
        paintLiveUi();
        const first = !state.loc._gps;
        state.loc._gps = true;
        const quick = (!state.loc.label || state.loc.label === 'Finding your location…') ? 'Current location' : state.loc.label;
        if (!state.loc.custom && !state.loc.frozen) setPlace(lat, lng, quick, false);

    function pauseOfferPromo() {
      offerPromo.hold = Date.now() + 8000;
      offerPromo.due = Math.max(offerPromo.due, offerPromo.hold);
    }
    function armOfferPromo() {
      if (offerPromo.timer) { clearTimeout(offerPromo.timer); offerPromo.timer = null; }
      const el = document.querySelector('.ue-offers');
      if (!el) return;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const n = Number(el.dataset.offerN || 0);
      if (n < 2 && el.querySelectorAll('.ue-offer').length < 2) return;
      const now = Date.now();
      if (!offerPromo.due) offerPromo.due = now + 5000;
      const wait = Math.max(40, offerPromo.due - now);
      offerPromo.timer = setTimeout(() => {
        offerPromo.timer = null;
        const rail = document.querySelector('.ue-offers');
        if (!rail) { offerPromo.due = Date.now() + 5000; return; }
        if (Date.now() < offerPromo.hold) {
          offerPromo.due = offerPromo.hold;
          armOfferPromo();
          return;
        }
        const card = rail.querySelector('.ue-offer');
        if (!card) return;
        const styles = window.getComputedStyle(rail);
        const gap = parseFloat(styles.columnGap || styles.gap) || 14;
        const step = card.getBoundingClientRect().width + gap;
        const count = Number(rail.dataset.offerN || 0) || rail.querySelectorAll('.ue-offer').length;
        offerPromo.moving = true;
        rail.scrollTo({ left: rail.scrollLeft + step, behavior: 'smooth' });
        setTimeout(() => {
          const orig = count * step;
          if (orig > 0 && rail.scrollLeft >= orig - 8) rail.scrollLeft = rail.scrollLeft - orig;
          offerPromo.moving = false;
        }, 560);
        offerPromo.due = Date.now() + 5000;
        armOfferPromo();
      }, wait);
    }

        if (n > 1) {
          for (let i = 0; i < n; i++) el.appendChild(el.children[i].cloneNode(true));
          el.dataset.offerLoop = '1';
        }
      }
      const pause = () => { if (!offerPromo.moving) pauseOfferPromo(); };
      el.addEventListener('pointerdown', pause);
      el.addEventListener('touchstart', pause, { passive: true });
      el.addEventListener('wheel', pause, { passive: true });
      armOfferPromo();
    }

    const AISLES = ['Fruit', 'Vegetables', 'Beverages', 'Grocery', 'Chilled', 'Meat', 'Frozen', 'Household', 'Bakery', 'Fast food'];
    function classifyAisle(it) {
      if (it && state.aisleMap && state.aisleMap[it.id]) return state.aisleMap[it.id];
      const blob = [it && it.name, it && it.category, it && it.desc, it && it.description].join(' ').toLowerCase();
      const has = (re) => re.test(blob);
      if (has(/frozen|ice cream|icecream|gelato|fish finger|nugget/)) return 'Frozen';
      if (has(/chicken|beef|mutton|pork|lamb|meat|sausage|bacon|ham|fish|tuna|prawn|shrimp|crab|seafood|\beggs?\b/)) return 'Meat';
      if (has(/yoghurt|yogurt|cheese|butter|margarine|curd|chilled|dairy|fresh milk/)) return 'Chilled';
      if (has(/apple|banana|mango|papaya|pineapple|watermelon|grape|orange|lemon|lime|avocado|rambutan|durian|wood apple|fruit|guava|melon|pomegranate|strawberry/)) return 'Fruit';
      if (has(/carrot|cabbage|leek|beans|tomato|onion|potato|pumpkin|brinjal|eggplant|okra|gotukola|vegetable|salad|cucumber|chilli|chili|garlic|ginger|spinach|lettuce|beet/)) return 'Vegetables';
      if (has(/juice|soda|cola|pepsi|coke|sprite|water|tea|coffee|beverage|drink|necto|cordial|\bpet\b|1\.5l|elephant house|fanta|mirinda/)) return 'Beverages';
      if (has(/soap|shampoo|toothpaste|detergent|bleach|harpic|dettol|household|tissue|nappy|diaper|cleaner|lux|lifebuoy|\bvim\b|sunlight/)) return 'Household';
      if (has(/cake|pastry|bread|bun|croissant|bakery|cookie|doughnut|donut/)) return 'Bakery';
      if (has(/burger|pizza|kottu|fried rice|shawarma|submarine|fast food|fries/)) return 'Fast food';
      if (has(/rice|flour|sugar|salt|dhal|\bdal\b|coconut|oil|spice|biscuit|snack|noodle|maggi|pasta|cereal|grocery|maliban|munchee/)) return 'Grocery';
      const c = String((it && it.category) || '');
      if (/beverage|drink|coffee/i.test(c)) return 'Beverages';
      if (/bakery|dessert/i.test(c)) return 'Bakery';
      if (/grocery/i.test(c)) return 'Grocery';
      if (/fast food|pizza|burger/i.test(c)) return 'Fast food';
      if (/ice cream/i.test(c)) return 'Frozen';
      return 'Grocery';
    }
    function askAisles(shopId, items) {
      if (!shopId || !items || !items.length) return;
      askAisles._on = askAisles._on || {};
      if (askAisles._on[shopId]) return;
      askAisles._on[shopId] = 1;
      const payload = items.slice(0, 40).map((it) => ({
        id: it.id, name: it.name, category: it.category, desc: it.desc || it.description || '',
      }));
      fetch('/api/categorize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items: payload }),
      }).then((r) => r.json()).then((data) => {
        const list = (data && data.aisles) || [];
        let n = 0;
        list.forEach((row) => {
          if (!row || !row.id || !row.aisle) return;
          if (state.aisleMap[row.id] !== row.aisle) n += 1;
          state.aisleMap[row.id] = row.aisle;

    function buyAgainItems(shopId) {

      (API.orders || []).slice().sort((a, b) => {
        const ta = Date.parse((a && (a.deliveredAt || a.timestamp || a.createdAt)) || '') || 0;
        const tb = Date.parse((b && (b.deliveredAt || b.timestamp || b.createdAt)) || '') || 0;
        return tb - ta;

        if (!o || String(o.shopId) !== String(shopId)) return;

    function peekPayReturn() {

      const canceled = paidFlag === '0' || /cancel|fail|expir/i.test(status);
      state.screen = 'checkout';
      state.paying = !canceled && !!checkoutId && !!pending;
      if (canceled) state.cardErr = state.cardErr || 'Payment cancelled. Your card was not charged.';
      if (!state._payKick) {

    async function consumePayReturn() {
      const qp = new URLSearchParams(location.search || '');
      const checkoutId = qp.get('checkout');
      const paidFlag = qp.get('paid');
      const status = String(qp.get('status') || '');
      if (!checkoutId && paidFlag == null) return false;
      if (!API.user) return false;
      if (state._payReturn) return false;
      state._payReturn = true;
      try { history.replaceState({}, '', location.pathname); } catch (_) {}
      try {
        if (checkoutId && sessionStorage.getItem('qb_pay_done') === checkoutId) {
          clearPayPending();
          state.paying = false;
          return true;
        }
      } catch (_) {}
      const pending = loadPayPending();
      if (pending) applyPayPending(pending);
      const canceled = paidFlag === '0' || /cancel|fail|expir/i.test(status);
      if (canceled) {
        state.paying = false;
        state.cardErr = 'Payment cancelled. Your card was not charged.';
        state.screen = 'checkout';
        render({ keepScroll: true });
        return true;
      }
      if (!checkoutId || !pending) {
        state.paying = false;
        state.cardErr = 'Payment was not completed.';
        state.screen = 'checkout';
        render({ keepScroll: true });
        return true;
      }
      state.paying = true;
      state.screen = 'checkout';
      render({ keepScroll: true });
      try {
        if (!(API.shops || []).some((s) => s && s.id === pending.shopId && s.lat != null)) {
          try { await API.refresh(); } catch (_) {}
        }
        const confirmed = await API.confirmPayCheckout(checkoutId, pending.amountCents);
        const paidRupees = Math.round(Number(confirmed.amountCents) / 100);
        if (paidRupees !== Math.round(Number(pending.amount) || 0)) {
          throw new Error('Paid amount does not match this order.');
        }
        const payment = {
          ok: true,
          paymentId: confirmed.paymentId,
          status: 'captured',
          amount: paidRupees,
          shopCredit: Math.round(Number(pending.shopCredit) || 0),
          riderCredit: Math.round(Number(pending.riderCredit) || 0),
          brand: confirmed.brand || 'Card',
          last4: confirmed.last4 || '',
          paidAt: confirmed.paidAt,
          checkoutId: confirmed.checkoutId,
        };
        try { sessionStorage.setItem('qb_pay_done', checkoutId); } catch (_) {}
        await submitPaidOrder(payment);
      } catch (e) {
        state.paying = false;
        state.cardErr = (e && e.message) || 'Payment was not completed.';
        state.screen = 'checkout';
        render({ keepScroll: true });
      }
      return true;
    }

    function render(opts) {
      const root = document.getElementById('root');
      const keep = !!(opts && opts.keepScroll);
      const sc0 = root.querySelector('.scroll');
      const y = keep && sc0 ? sc0.scrollTop : 0;
      const rails = {};
      if (keep) {
        root.querySelectorAll('[data-rail]').forEach((el) => { rails[el.dataset.rail] = el.scrollLeft; });
      }
      try {
      if (state.gate === 'otp') {
        root.innerHTML = otpView();
        bindGate();
        bindOtp();
        return;
      }
      if (!API.user && state.gate !== 'app') {
        if (state.gate === 'splash') { root.innerHTML = splash(); return; }
        if (state.gate === 'onboard') { root.innerHTML = onboard(); bindGate(); return; }
        if (state.gate === 'login') { root.innerHTML = loginView(); bindGate(); bindWaSheet(); consumeGoogleRedirect(); return; }
        if (state.gate === 'register') { root.innerHTML = registerView(); bindGate(); return; }
        if (state.gate === 'download') { root.innerHTML = downloadView(); bindGate(); return; }
      }
      if (!API.user) {

        bindGate();

      }
      if (API.user) { ensureUserLocal(); tryAutoGps(); }

        const err = root.querySelector('[data-err]');

    function bindLocate() {
      const mapEl = document.getElementById('locMap');
      const labelEl = document.querySelector('[data-loc-label]');
      const hits = document.querySelector('[data-loc-hits]');
      if (typeof mountLocationPicker !== 'function' || !mapEl) return;
      if (state.locHandle) { try { state.locHandle.destroy(); } catch (_) {} }
      startLiveLocation();
      const pinLat = state.loc.liveLat != null ? state.loc.liveLat : state.loc.lat;
      const pinLng = state.loc.liveLng != null ? state.loc.liveLng : state.loc.lng;
      state.locHandle = mountLocationPicker(mapEl, {
        lat: pinLat, lng: pinLng,
        liveLat: state.loc.liveLat, liveLng: state.loc.liveLng,
        custom: !!(state.loc.custom || state.loc.frozen),
        frozen: !!state.loc.frozen,
      });
      paintLiveUi();
      let seq = 0;
      if (state.locHandle) {
        state.locHandle.onMoveEnd((lat, lng) => {
          state.loc._draft = { lat, lng, label: (labelEl && labelEl.textContent) || state.loc.label };
          if (labelEl && (!labelEl.textContent || labelEl.textContent === 'Finding your location…')) {
            labelEl.textContent = 'Current location';
          }
          const n = ++seq;
          labelAt(lat, lng).then((label) => {
            if (n !== seq) return;
            if (labelEl) labelEl.textContent = label;
            state.loc._draft = { lat, lng, label };
          }).catch(() => {});
        });
      }
      const back = document.querySelector('[data-loc-back]');
      if (back) back.onclick = () => closeLocateScreen();
      const dropLive = () => {
        startLiveLocation();
        if (state.loc.liveLat == null) {
          const errEl = document.querySelector('[data-loc-err]');
          if (errEl) errEl.textContent = state.loc.err || 'Waiting for GPS… Allow location if asked.';
          return;
        }
        if (state.locHandle && state.locHandle.goLive) state.locHandle.goLive(state.loc.liveLat, state.loc.liveLng, 18);
        else if (state.locHandle && state.locHandle.setView) state.locHandle.setView(state.loc.liveLat, state.loc.liveLng, 18);
      };
      const me = document.querySelector('[data-loc-me]');
      if (me) me.onclick = dropLive;
      const liveBtn = document.querySelector('[data-loc-live]');
      if (liveBtn) liveBtn.onclick = () => {
        if (state.loc.frozen) { closeLocateScreen(); return; }
        dropLive();
        if (state.loc.liveLat == null) return;
        const lat = state.loc.liveLat, lng = state.loc.liveLng;
        setPlace(lat, lng, (labelEl && labelEl.textContent) || 'Current location', false);
        labelAt(lat, lng).then((label) => {
          if (state.loc.frozen) return;
          setPlace(lat, lng, label, false);
          closeLocateScreen();
        }).catch(() => closeLocateScreen());
      };
      const ok = document.querySelector('[data-loc-ok]');
      if (ok) ok.onclick = () => {
        if (state.loc.frozen) {
          closeLocateScreen();
          return;
        }
        const c = state.locHandle ? state.locHandle.getCenter() : { lat: state.loc.lat, lng: state.loc.lng };
        const label = (labelEl && labelEl.textContent) || (state.loc._draft && state.loc._draft.label) || state.loc.label;
        setPlace(c.lat, c.lng, label, true);
        closeLocateScreen();
      };
      const q = document.getElementById('locQ');
      let st;
      if (q) q.oninput = () => {
        clearTimeout(st);
        st = setTimeout(async () => {
          if (typeof searchPlaces !== 'function') return;
          const list = await searchPlaces(q.value);
          if (!hits) return;
          if (!list.length) { hits.classList.add('hidden'); hits.innerHTML = ''; return; }
          hits.classList.remove('hidden');
          hits.innerHTML = list.map((p, i) => `<button type="button" data-hit="${i}">${esc(p.label)}</button>`).join('');
          hits.querySelectorAll('[data-hit]').forEach((b) => {
            b.onclick = () => {
              const p = list[Number(b.dataset.hit)];
              hits.classList.add('hidden');
              q.value = p.label;
              if (state.locHandle) state.locHandle.setView(p.lat, p.lng, 18);
              if (labelEl) labelEl.textContent = p.label;
              state.loc._draft = p;
            };
          });
        }, 280);
      };
    }

    function bindMoreShops(root) {

      const el = root.querySelector('[data-more-shops]');

      if (!el || !sc || typeof IntersectionObserver === 'undefined') return;
      moreIo = new IntersectionObserver(function (ents) {

          state.shown = (state.shown || 8) + 8;

          API.loadMoreNearby().then(function () {

            render({ keepScroll: true });

      });
      root.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => { state.screen = b.dataset.go; render(); });
      root.querySelectorAll('[data-open-loc]').forEach((b) => b.onclick = () => {
        state.locFrom = state.screen === 'checkout' ? 'checkout' : (state.screen === 'addresses' ? 'addresses' : 'home');
        state.screen = 'locate';
        render();
      });
      root.querySelectorAll('[data-addr-pin]').forEach((b) => b.onclick = () => {
        if (state.loc.frozen) return;
        state.locFrom = 'addresses';
        state.screen = 'locate';
        render();
      });
      root.querySelectorAll('[data-addr-live]').forEach((b) => b.onclick = async () => {
        if (state.loc.frozen) return;
        const errEl = document.querySelector('[data-addr-err]');
        state.loc.custom = false;
        startLiveLocation();
        if (state.loc.liveLat == null) {
          if (errEl) errEl.textContent = state.loc.err || 'Waiting for GPS… Allow location if asked.';
          return;
        }
        const lat = state.loc.liveLat, lng = state.loc.liveLng;
        setPlace(lat, lng, 'Current location', false);
        try {
          const label = await labelAt(lat, lng);
          if (!state.loc.custom && !state.loc.frozen) setPlace(lat, lng, label, false);
        } catch (_) {}
        if (errEl) errEl.textContent = '';
        paintAddrUi();
      });
      root.querySelectorAll('[data-addr-save]').forEach((b) => b.onclick = () => {
        if (state.loc.frozen) return;
        const inp = document.getElementById('addrLine');
        const label = ((inp && inp.value) || state.loc.label || '').trim();
        if (!label) return;
        setPlace(state.loc.lat, state.loc.lng, label, !!state.loc.custom);
        paintAddrUi();
      });
      root.querySelectorAll('input[name="ship"]').forEach((el) => el.onchange = () => { state.deliveryType = el.value; render({ keepScroll: true }); });
      root.querySelectorAll('input[name="pay"]').forEach((el) => el.onchange = () => {
        pullCardDraft();
        if (el.value !== 'card' && codLocked()) {
          state.payKind = 'card';
          state.cardErr = 'Cash on Delivery is locked until your current COD order is complete.';
          render({ keepScroll: true });
          return;
        }
        state.payKind = el.value === 'card' ? 'card' : 'cash';
        state.cardAuth = null;
        state.paymentObj = null;
        state.cardErr = '';
        if (state.payKind === 'card' && (!state.cardId || state.cardId === 'cash')) {
          state.cardId = ((state.cards || [])[0] && state.cards[0].id) || 'new';
        }
        render({ keepScroll: true });
      });
      root.querySelectorAll('input[name="cardid"]').forEach((el) => el.onchange = () => {
        pullCardDraft();
        state.cardId = el.value;
        state.cardErr = '';
        render({ keepScroll: true });
      });
      const num = document.getElementById('cardNum');
      if (num) num.oninput = () => {
        num.value = formatCard(num.value);
        if (!state.cardDraft) state.cardDraft = { number: '', name: '', exp: '', save: true };
        state.cardDraft.number = num.value;
        const b = num.parentElement && num.parentElement.querySelector('.card-brand');
        const brand = cardBrand(num.value);
        if (b) b.textContent = brand === 'Card' ? '' : brand;
      };
      const exp = document.getElementById('cardExp');
      if (exp) exp.oninput = () => {
        exp.value = formatExp(exp.value);
        if (!state.cardDraft) state.cardDraft = { number: '', name: '', exp: '', save: true };
        state.cardDraft.exp = exp.value;
      };
      const cname = document.getElementById('cardName');
      if (cname) cname.oninput = () => {
        if (!state.cardDraft) state.cardDraft = { number: '', name: '', exp: '', save: true };
        state.cardDraft.name = cname.value;
      };
      const csave = document.getElementById('cardSave');
      if (csave) csave.onchange = () => {
        if (!state.cardDraft) state.cardDraft = { number: '', name: '', exp: '', save: true };
        state.cardDraft.save = !!csave.checked;
      };
      const addCard = root.querySelector('[data-add-card]');
      if (addCard) addCard.onclick = () => {
        state._addCard = true;
        state.cardErr = '';
        state.cardDraft = { number: '', name: '', exp: '', save: true };
        render({ keepScroll: true });
      };
      const cancelCard = root.querySelector('[data-cancel-card]');
      if (cancelCard) cancelCard.onclick = () => {
        state._addCard = false;
        state.cardErr = '';
        render({ keepScroll: true });
      };
      const saveCardBtn = root.querySelector('[data-save-card]');
      if (saveCardBtn) saveCardBtn.onclick = () => {
        pullCardDraft();
        const rec = validateCard();
        if (!rec.ok) { state.cardErr = rec.err; render({ keepScroll: true }); return; }
        rememberCard(rec);
        state._addCard = false;
        state.cardErr = '';
        state.cardDraft = { number: '', name: '', exp: '', save: true };
        render({ keepScroll: true });
      };
      root.querySelectorAll('[data-del-card]').forEach((b) => b.onclick = () => {
        state.cards = (state.cards || []).filter((c) => c.id !== b.dataset.delCard);
        saveCards();
        render({ keepScroll: true });
      });
      const place = document.getElementById('place');
      async function placeNow() {
        const addr = document.getElementById('addr');
        if (addr) state.address = addr.value;
        const payEl = document.querySelector('input[name="pay"]:checked');
        if (payEl && payEl.value === 'card') state.payKind = 'card';
        else if (payEl && payEl.value !== 'wallet') state.payKind = 'cash';
        if (state.payKind !== 'card' && codLocked()) {
          state.payKind = 'card';
          state.cardErr = 'Cash on Delivery is locked until your current COD order is delivered or cancelled. Pay by card instead.';
          render({ keepScroll: true });
          return;
        }
        if (state.payKind === 'card') {
          state.payment = (state.cardAuth && state.cardAuth.last4)
            ? (state.cardAuth.brand + ' •••• ' + state.cardAuth.last4)
            : 'Card';
          state.cardErr = '';
        } else {
          state.cardAuth = null;
          state.payment = 'Cash on delivery';
        }
        if (!state.cart.length) return;
        const pin = deliveryPoint();
        if (!state.loc.custom && state.loc.liveLat == null && !savedGps) {
          state.locFrom = 'checkout';
          state.screen = 'locate';
          startLiveLocation();
          render();
          return;
        }
        if (!API.isWhatsAppVerified || !API.isWhatsAppVerified()) {
          state.wa = { open: true, step: 'phone', phone: state.wa.phone || '', err: '', mode: 'order' };
          render({ keepScroll: true });
          return;
        }
        try {
          (state.cart || []).forEach((c) => {
            const it = (API.items || []).find((x) => x.id === c.id) || c;
            if (API.itemOnSale && !API.itemOnSale(it)) throw new Error((it.name || 'Item') + ' is unavailable.');
            const st = API.itemStock && API.itemStock(it);
            if (st && !st.unlimited && Number(c.qty || 1) > st.stock) {
              throw new Error((it.name || 'Item') + ' only has ' + st.stock + ' left.');
            }
          });
        } catch (e) {
          state.cardErr = e.message || 'Item is unavailable.';
          render({ keepScroll: true });
          return;
        }
        if (place) { place.disabled = true; place.textContent = state.payKind === 'card' ? 'Paying…' : 'Placing…'; }
        try {
          if (state.payKind === 'card' && !state.paymentObj) {
            state.paying = true;
            const pending = stashPayPending();
            const body = payCheckoutBody(pending);
            render({ keepScroll: true });
            const btn = document.getElementById('place');
            if (btn) {
              btn.setAttribute('data-payments-lk-checkout', '/checkout');
              btn.setAttribute('data-payments-lk-error-target', '[data-card-err]');
              btn.setAttribute('data-payments-lk-body', JSON.stringify(body));
            }
            const payBtn = window.PaymentsLk && window.PaymentsLk.payButton;
            if (payBtn && typeof payBtn.start === 'function' && btn) {
              payBtn.start(btn);
              return;
            }
            const checkout = await API.createPayCheckout({
              amount: pending.amount,
              amountCents: pending.amountCents,
              description: pending.description,
              reference: pending.reference,
              lineItems: pending.lineItems,
            });
            if (checkout && checkout.id) {
              try {
                const cur = loadPayPending() || pending;
                cur.checkoutId = checkout.id;
                sessionStorage.setItem(PAY_PENDING_KEY, JSON.stringify(cur));
              } catch (_) {}
            }
            location.assign(checkout.url);
            return;
          }
          await submitPaidOrder(state.paymentObj || null);
        } catch (e) {
          state.paying = false;
          if (e && e.code === 'WHATSAPP_REQUIRED') {
            state.wa = { open: true, step: 'phone', phone: state.wa.phone || '', err: '', mode: 'order' };
            render({ keepScroll: true });
            return;
          }
          if (e && e.code === 'COD_OPEN') {
            state.payKind = 'card';
            state.cardErr = e.message;
            if (place) { place.disabled = false; place.textContent = 'Pay ' + rs(cartTotal() + fee()); }
            render({ keepScroll: true });
            return;
          }
          state.cardErr = e.message || 'Payment failed.';
          if (place) { place.disabled = false; place.textContent = state.payKind === 'card' ? 'Pay ' + rs(cartTotal() + fee()) : 'Place Order'; }
          render({ keepScroll: true });
        }
      }
      if (place) place.onclick = function (e) {
        if (state.payKind === 'card' && e) {
          e.preventDefault();
          e.stopPropagation();
        }
        placeNow();
      };
      bindWaSheet(placeNow);
      root.querySelectorAll('[data-track]').forEach((b) => b.onclick = () => openTrack(b.dataset.track, true));
      root.querySelectorAll('[data-chat]').forEach((b) => b.onclick = () => {
        const o = API.orders.find((x) => x.id === b.dataset.chat);
        if (API.canChat && !API.canChat(o, 'customer')) return;
        state.trackId = b.dataset.chat;
        state.screen = 'chat';
        state.lockTrack = false;
        if (API.markChatRead) API.markChatRead(state.trackId, 'customer');
        render();
      });
      root.querySelectorAll('[data-back-track]').forEach((b) => b.onclick = () => { state.screen = 'track'; state.lockTrack = true; render(); });
      root.querySelectorAll('[data-track-back]').forEach((b) => b.onclick = leaveTrack);
      root.querySelectorAll('[data-done]').forEach((b) => b.onclick = leaveTrack);
      function paintStars(el, n) {
        if (!el) return;
        el.querySelectorAll('[data-star]').forEach((btn) => {
          btn.classList.toggle('on', Number(btn.dataset.star) <= n);
        });
      }
      root.querySelectorAll('[data-star]').forEach((b) => {
        b.onclick = () => {
          if (b.disabled) return;
          const wrap = b.closest('[data-rate]');
          if (!wrap) return;
          const n = Number(b.dataset.star);
          if (!state.rateDraft) state.rateDraft = { id: state.trackId, shop: 0, rider: 0, items: {}, err: '' };
          const kind = wrap.dataset.rate;
          const item = wrap.dataset.item;
          if (kind === 'shop') state.rateDraft.shop = n;
          else if (kind === 'rider') state.rateDraft.rider = n;
          else if (item) state.rateDraft.items[item] = n;
          state.rateDraft.err = '';
          paintStars(wrap, n);
        };
      });
      const rateSubmit = root.querySelector('[data-rate-submit]');
      if (rateSubmit) rateSubmit.onclick = async () => {
        const o = API.orders.find((x) => x.id === state.trackId) || state.lastOrder;
        if (!o || !API.rateOrder) return;
        const d = state.rateDraft || { shop: 0, rider: 0, items: {} };
        if (!(API.clampStar ? API.clampStar(d.shop) : d.shop)) {
          d.err = 'Tap stars to rate the shop.';
          state.rateDraft = Object.assign({ id: o.id, items: {} }, d);
          render();
          return;
        }
        d.busy = true; d.err = '';
        state.rateDraft = Object.assign({ id: o.id }, d);
        rateSubmit.disabled = true;
        rateSubmit.textContent = 'Saving…';
        try {
          await API.rateOrder(o.id, { shop: d.shop, rider: d.rider, items: d.items });
          state.rateDraft = null;
          render();
        } catch (e) {
          d.busy = false;
          d.err = (e && e.message) || 'Could not save ratings.';
          state.rateDraft = Object.assign({ id: o.id }, d);
          render();
        }
      };
      root.querySelectorAll('[data-zoom]').forEach((b) => b.onclick = () => {
        if (!state.mapHandle) return;
        if (b.dataset.zoom === 'in') state.mapHandle.zoomIn(); else state.mapHandle.zoomOut();
      });
      const loc = root.querySelector('[data-locate]');
      if (loc) loc.onclick = () => {
        const o = API.orders.find((x) => x.id === state.trackId);
        if (state.mapHandle && o) state.mapHandle.locate(o);
      };
      async function sendUserChat(text) {
        const body = String(text || '').trim();
        if (!body || !state.trackId) return;
        const form = document.getElementById('chatForm');
        if (form && form.text) form.text.value = '';
        try {
          await API.sendMessage(state.trackId, API.user.name, 'customer', body);
        } catch (err) { alert(err.message); return; }
        if (API.markChatRead) API.markChatRead(state.trackId, 'customer');
        const keep = document.querySelector('[data-chat-root]');
        if (keep) paintUserChat(keep);
        const input = document.querySelector('#chatForm input[name="text"]');
        if (input) input.focus();
      }
      const form = document.getElementById('chatForm');
      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          await sendUserChat(form.text && form.text.value);
        };
        const input = form.querySelector('input[name="text"]');
        if (input) input.addEventListener('focus', bindChatKeyboard);
      }
      root.querySelectorAll('[data-quick]').forEach((b) => {
        b.onclick = () => sendUserChat(b.getAttribute('data-quick'));
      });
      const logout = document.getElementById('logout');
      if (logout) logout.onclick = () => {
        API.logout();
        restoredSession = false;
        state.cart = [];
        state.favs = [];
        state.lastOrder = null;
        state.trackId = null;
        localUserId = '';
        state.gate = 'login';
        state.loc._gps = false;
        render();
      };
    }

    document.addEventListener('payments-lk:error', function (ev) {
      state.paying = false;
      state.cardErr = (ev.detail && ev.detail.message) || 'The payment could not be started. Please try again.';
      render({ keepScroll: true });
    });

    API.on(() => {
      if (state.gate === 'otp' || state.gate === 'register') return;
      if (state.gate === 'login' || state.gate === 'onboard' || state.gate === 'splash' || state.gate === 'download') {
        if (!API.user) return;
      }
      render({ keepScroll: true });
    });
    tryAutoGps();
    (async function consumeGoogleRedirect() {
      try {
        if (API.resumeGoogle) {
          const u = await API.resumeGoogle();
          if (u) {
            state.gate = 'app';
            state.tab = 'home';
            state.screen = 'home';
          }
        }
      } catch (e) {
        state.gate = 'login';
        render();
        const err = document.querySelector('[data-err]');
        if (err) err.textContent = (e && e.message) || 'Google sign-in failed';
        return;
      }
      render();
    })();
  </script>
</body>
</html>
