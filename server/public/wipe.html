<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>QuickBite · delete all data</title>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#fff; color:#111; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 28px 20px 48px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color:#6b7280; line-height:1.45; }
    button { width:100%; height:52px; border:0; border-radius:14px; background:#111; color:#fff; font-weight:800; font-size:15px; }
    button:disabled { opacity:.6; }
    pre { background:#f3f4f6; border-radius:12px; padding:14px; white-space:pre-wrap; font-size:13px; }
    .ok { color:#059669; }
    .bad { color:#b91c1c; }
    a { color:#059669; font-weight:700; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Delete all QuickBite data</h1>
    <p>This removes every User, Shop, Rider, Google account, shop, dish, order, chat, and OTP from the live database. Then the apps are empty until someone registers.</p>
    <button type="button" id="go">Delete all data now</button>
    <pre id="log">Tap the button.</pre>
    <p><a href="/">Back to apps</a></p>
  </div>
  <script src="/js/live.js?v=19y"></script>
  <script>
    const log = document.getElementById('log');
    const go = document.getElementById('go');
    const sb = (window.QB_SUPABASE_URL || '').replace(/\/$/, '');
    const key = window.QB_SUPABASE_ANON || '';
    const TABLES = ['messages', 'orders', 'menu_items', 'shops', 'accounts', 'otp_codes', 'app_state'];
    function hdr(extra) {
      return Object.assign({ apikey: key, Authorization: 'Bearer ' + key, Prefer: 'return=minimal', 'Content-Type': 'application/json' }, extra || {});
    }
    function say(t, cls) {
      log.className = cls || '';
      log.textContent = t;
    }
    function clearCache() {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
        keys.forEach(function (k) {
          try { localStorage.removeItem(k); } catch (_) {}
          try { sessionStorage.removeItem(k); } catch (_) {}
        });
        sessionStorage.clear();
        document.cookie.split(';').forEach(function (c) {
          const n = c.split('=')[0].trim();
          if (!n) return;
          document.cookie = n + '=;path=/;max-age=0';
        });
      } catch (_) {}
    }
    async function count(table) {
      const r = await fetch(sb + '/rest/v1/' + table + '?select=id&limit=50', { headers: hdr() });
      const j = await r.json();
      return Array.isArray(j) ? j.length : 0;
    }
    async function counts() {
      const out = {};
      for (let i = 0; i < TABLES.length; i++) {
        try { out[TABLES[i]] = await count(TABLES[i]); } catch (_) { out[TABLES[i]] = '?'; }
      }
      return out;
    }
    async function delAll(table) {
      const qs = table === 'messages'
        ? ['order_id=not.is.null', 'id=not.is.null', 'id=neq._']
        : ['id=not.is.null', 'id=neq._', 'id=gte.'];
      if (table === 'accounts') qs.push('phone=not.is.null', 'email=not.is.null', 'pin=eq.google', 'role=eq.shop', 'role=eq.customer', 'role=eq.rider');
      if (table === 'shops') qs.push('name=not.is.null');
      if (table === 'menu_items') qs.push('shop_id=not.is.null');
      for (let i = 0; i < qs.length; i++) {
        await fetch(sb + '/rest/v1/' + table + '?' + qs[i], { method: 'DELETE', headers: hdr() }).catch(function () {});
      }
      const rows = await fetch(sb + '/rest/v1/' + table + '?select=*&limit=1000', { headers: hdr() }).then(function (r) { return r.json(); }).catch(function () { return []; });
      if (!Array.isArray(rows)) return;
      for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const q = table === 'messages' && row.order_id
          ? 'messages?order_id=eq.' + encodeURIComponent(row.order_id) + '&id=eq.' + encodeURIComponent(row.id)
          : table + '?id=eq.' + encodeURIComponent(row.id);
        await fetch(sb + '/rest/v1/' + q, { method: 'DELETE', headers: hdr() }).catch(function () {});
      }
    }
    async function wipe() {
      if (!sb || !key) { say('No Supabase key.', 'bad'); return; }
      go.disabled = true;
      clearCache();
      say('Deleting all User, Shop, and Rider data…');
      for (let round = 1; round <= 8; round++) {
        say('Deleting… round ' + round);
        for (let t = 0; t < TABLES.length; t++) await delAll(TABLES[t]);
        const c = await counts();
        const left = (c.shops || 0) + (c.menu_items || 0) + (c.accounts || 0) + (c.orders || 0);
        if (!left) {
          try {
            localStorage.setItem('qb_gen', '19y');
            await fetch(sb + '/rest/v1/app_state', {
              method: 'POST',
              headers: hdr(),
              body: JSON.stringify([{ id: 'qb_empty', payload: { v: '19y', at: Date.now() } }]),
            });
          } catch (_) {}
          say('Done. Database is empty.\n0 shops · 0 dishes · 0 accounts · 0 orders\n\nNow open Customer / Shop / Rider. Register again if you need an account.', 'ok');
          go.disabled = false;
          go.textContent = 'Delete again';
          return;
        }
        say('Still left after round ' + round + ':\n' + JSON.stringify(c, null, 2));
      }
      const c = await counts();
      say('Could not reach 0. Left:\n' + JSON.stringify(c, null, 2) + '\n\nDo this in Supabase → SQL Editor:\n\ndelete from messages;\ndelete from orders;\ndelete from menu_items;\ndelete from shops;\ndelete from accounts;\ndelete from otp_codes;\ndelete from app_state;', 'bad');
      go.disabled = false;
      go.textContent = 'Try delete again';
    }
    go.onclick = wipe;
  </script>
</body>
</html>
