<!DOCTYPE html>
<html lang="en" data-role="shop">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Uber Eats Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div class="app" id="root"></div>
  <script src="/js/api.js"></script>
  <script>
    const demo = new URLSearchParams(location.search).has('demo');
    const state = { tab: 'orders', filter: 'new' };
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function lkr(n) { return 'LKR ' + Math.round(Number(n)||0).toLocaleString('en-LK'); }
    function nav() {
      return `<nav class="nav" style="grid-template-columns:repeat(3,1fr)">
        <button data-tab="orders" class="${state.tab==='orders'?'active':''}">Orders</button>
        <button data-tab="menu" class="${state.tab==='menu'?'active':''}">Menu</button>
        <button data-tab="account" class="${state.tab==='account'?'active':''}">Account</button>
      </nav>`;
    }
    function loginView() {
      return `<div class="login">
        <div class="wordmark">Uber <em>Eats</em> Manager</div>
        <h1>Kitchen</h1>
        <p class="sub">Accept orders · prepare · hand to courier</p>
        <div class="field"><label>Mobile</label><input id="phone" value="0772223333" /></div>
        <div class="field"><label>PIN</label><input id="pin" value="1234" type="password" /></div>
        <button class="btn full" id="loginBtn">Open restaurant</button>
      </div>`;
    }
    function ordersView() {
      const orders = API.orders;
      const pending = orders.filter((o) => o.status === 'pending').length;
      const preparing = orders.filter((o) => o.status === 'preparing').length;
      const ready = orders.filter((o) => o.status === 'ready').length;
      const list = orders.filter((o) => {
        if (state.filter === 'new') return o.status === 'pending';
        if (state.filter === 'prep') return o.status === 'preparing';
        if (state.filter === 'ready') return o.status === 'ready';
        return true;
      });
      return `<div class="ue-top"><div class="where">Restaurant dashboard<small>${esc(API.user?.name)} · Colombo</small></div></div>
        <div class="stats">
          <div class="stat"><b>${pending}</b><span>New</span></div>
          <div class="stat"><b>${preparing}</b><span>Preparing</span></div>
          <div class="stat"><b>${ready}</b><span>Ready</span></div>
        </div>
        <div class="chips">
          <button class="chip ${state.filter==='new'?'active':''}" data-filter="new">New</button>
          <button class="chip ${state.filter==='prep'?'active':''}" data-filter="prep">Preparing</button>
          <button class="chip ${state.filter==='ready'?'active':''}" data-filter="ready">Ready</button>
          <button class="chip ${state.filter==='all'?'active':''}" data-filter="all">All</button>
        </div>
        ${list.map((o) => `
          <div class="ticket">
            <div class="row">
              <div class="grow">
                <b>${esc(o.id)}</b>
                <div class="muted">${esc(o.shopName)} · ${esc(o.customerName)}</div>
              </div>
              <span class="status ${o.status}">${API.statusLabel(o.status)}</span>
            </div>
            <div style="margin:10px 0">${o.items.map((i)=>`<div>${esc(i.name)} ×${i.qty}</div>`).join('')}</div>
            ${o.note ? `<div class="muted">Note: ${esc(o.note)}</div>` : ''}
            <div class="row" style="margin-top:10px">
              <div class="price grow">${lkr(o.totalAmount)}</div>
              ${o.status==='pending' ? `<button class="btn sm" data-act="preparing" data-id="${esc(o.id)}">Accept</button>
                <button class="btn sm ghost" data-act="cancelled" data-id="${esc(o.id)}">Reject</button>` : ''}
              ${o.status==='preparing' ? `<button class="btn sm green" data-act="ready" data-id="${esc(o.id)}">Food is ready</button>` : ''}
              ${o.status==='ready' ? `<span class="muted">Waiting for courier…</span>` : ''}
              ${o.status==='on_the_way' || o.status==='delivered' ? `<span class="muted">${esc(o.riderName || 'Courier')} · ${API.statusLabel(o.status)}</span>` : ''}
            </div>
          </div>`).join('') || '<div class="pad muted">No tickets in this tab. Place an order in the customer app.</div>'}
        ${nav()}`;
    }
    function menuView() {
      return `<div class="ue-top"><div class="where">Menu<small>Mark items sold out</small></div></div>
        ${API.items.map((it) => {
          const shop = API.shopOf(it.shopId);
          return `<div class="item">
            <div class="grow">
              <b>${esc(it.name)}</b>
              <p>${esc(shop.name)} · ${lkr(it.price)}</p>
              <button class="add" data-toggle="${it.id}" data-on="${it.isAvailable?0:1}">${it.isAvailable ? 'Available' : 'Sold out'}</button>
            </div>
            <img src="${shop.image || '/img/shop-curry.jpg'}" alt="" />
          </div>`;
        }).join('')}
        ${nav()}`;
    }
    function accountView() {
      const today = API.orders.filter((o) => o.status !== 'cancelled');
      const sales = today.reduce((s, o) => s + o.totalAmount, 0);
      return `<div class="ue-top"><div class="where">Account</div></div>
        <div class="stats">
          <div class="stat"><b>${today.length}</b><span>Orders</span></div>
          <div class="stat"><b>${lkr(sales)}</b><span>Volume</span></div>
          <div class="stat"><b>Open</b><span>Kitchen</span></div>
        </div>
        <div class="pad">
          <b>${esc(API.user?.name)}</b>
          <p class="muted">${esc(API.user?.phone)}</p>
          <button class="btn ghost full" id="logout">Sign out</button>
        </div>${nav()}`;
    }
    function render() {
      const root = document.getElementById('root');
      if (!API.user) { root.innerHTML = loginView(); bind(); return; }
      if (state.tab === 'menu') root.innerHTML = menuView();
      else if (state.tab === 'account') root.innerHTML = accountView();
      else root.innerHTML = ordersView();
      bind();
    }
    function bind() {
      const root = document.getElementById('root');
      const loginBtn = document.getElementById('loginBtn');
      if (loginBtn) loginBtn.onclick = async () => {
        try { await API.login('shop', document.getElementById('phone').value, document.getElementById('pin').value); render(); }
        catch (e) { alert(e.message); }
      };
      root.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; render(); });
      root.querySelectorAll('[data-filter]').forEach((b) => b.onclick = () => { state.filter = b.dataset.filter; render(); });
      root.querySelectorAll('[data-act]').forEach((b) => b.onclick = () => API.patch(b.dataset.id, { status: b.dataset.act }));
      root.querySelectorAll('[data-toggle]').forEach((b) => b.onclick = () => API.toggleItem(b.dataset.toggle, b.dataset.on === '1'));
      const logout = document.getElementById('logout');
      if (logout) logout.onclick = () => { API.user = null; sessionStorage.removeItem('sd_user_shop'); render(); };
    }
    API.on(() => {
      if (demo && !API.user && API.shops.length) { API.login('shop', '0772223333', '1234'); return; }
      render();
    });
  </script>
</body>
</html>
