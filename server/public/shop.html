<!DOCTYPE html>
<html lang="en" data-role="shop">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Shop Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/app.css?v=19l" />
  <link rel="stylesheet" href="/css/ui.css?v=19l" />
  <link rel="stylesheet" href="/css/track.css?v=19l" />
</head>
<body>
  <div class="app" id="root"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/live.js?v=19l"></script>
  <script src="/js/api.js?v=19l"></script>
  <script src="/js/maps.js?v=19l"></script>
  <script src="/js/track-ui.js?v=19l"></script>
  <script src="/js/otp-login.js?v=19l"></script>
  <script>
    const state = {
      tab: 'dash', filter: 'all', trackId: null, mapHandle: null,
      screen: '', orderId: null, itemId: null, menuQ: '', menuCat: 'All',
      itemDraft: null, shopDraft: null,
      auth: 'login',
      fromReg: false,
      reg: { shopName: '', ownerName: '', phone: '', email: '', photo: '', address: '', lat: null, lng: null, liveLat: null, liveLng: null, acc: null, custom: false, addrDirty: false },
      regMap: null,
      loginId: '',
      wa: { open: false, step: 'phone', phone: '', err: '' },
    };
    const STORE_MARK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3l9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>';
    const GOOGLE_LOGO = '<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7 12.9 19.6C14.7 15.2 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.3 35.1 26.8 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.3 5.3C39.3 36.1 44 30.7 44 24c0-1.2-.1-2.3-.4-3.5z"/></svg>';
    const WA_LOGO = '<svg class="wa-logo" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="#25D366" d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm.01 1.67c2.2 0 4.26.86 5.82 2.42a8.19 8.19 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.17-3.12.82.83-3.04-.2-.32a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.25-8.24z"/><path fill="#fff" d="M8.68 7.51c-.16 0-.43.06-.66.31-.22.25-.87.85-.87 2.07 0 1.22.89 2.39 1.01 2.56.12.17 1.75 2.67 4.23 3.74 2.05.9 2.47.72 2.92.67.45-.05 1.45-.59 1.65-1.16.2-.57.2-1.05.14-1.16-.06-.1-.22-.16-.43-.28-.22-.12-1.45-.71-1.67-.79-.22-.08-.38-.12-.54.12-.16.25-.62.79-.76.95-.14.17-.27.19-.5.06-.22-.12-.96-.35-1.83-1.13-.68-.6-1.13-1.35-1.27-1.57-.13-.22-.01-.34.1-.46.11-.11.22-.28.34-.42.11-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.54-1.3-.74-1.78-.2-.48-.39-.4-.54-.4z"/></svg>';
    const FOOD_IMGS = [
      '/img/shop-burger.jpg', '/img/shop-pizza.jpg', '/img/shop-bakery.jpg', '/img/cake-chocolate.jpg',
      '/img/cake-vanilla.jpg', '/img/iced-coffee.jpg', '/img/kottu.jpg', '/img/cookies.jpg',
    ];
    function shopId() {
      if (API.user && API.user.shopId) return API.user.shopId;
      if (API.user && API.user.phone && API.shopIdFor) return API.shopIdFor(API.user.phone);
      return '';
    }
    function isRealWaPhone(p) {
      const n = API.normalizePhone ? API.normalizePhone(p || '') : String(p || '').replace(/\D/g, '');
      return /^07\d{8}$/.test(n);
    }
    function lockRegPhone(p) {
      const v = API.verifiedPhone && API.verifiedPhone('shop');
      if (!isRealWaPhone(v) || !isRealWaPhone(p)) return false;
      const a = API.normalizePhone ? API.normalizePhone(v) : v;
      const b = API.normalizePhone ? API.normalizePhone(p) : p;
      return a === b;
    }
    function itemImg(it) { return (it && it.image) || '/img/shop-bakery.jpg'; }
    function menuBucket(cat) {
      const c = String(cat || '').toLowerCase();
      if (/drink|beverage|coffee|juice|tea|ice/.test(c)) return 'Drinks';
      if (/dessert|cake|sweet|cookie|bakery|pastry/.test(c)) return 'Desserts';
      return 'Food';
    }
    function shopItems() {
      const sid = String(shopId() || '');
      return API.items.filter((it) => String(it.shopId || '') === sid);
    }
    function shopOrders() {
      const sid = shopId();
      return API.orders.filter((o) => o.shopId === sid);
    }
    function cardPaid(o) {
      if (!o || o.status === 'cancelled' || o.paymentStatus === 'refunded') return false;
      return !!(o.paid || (API.isCardMethod && API.isCardMethod(o.paymentMethod)));
    }
    function shopShare(o) { return API.shopCreditOf ? API.shopCreditOf(o) : Number(o.shopCredit || o.subtotal || 0); }
    function riderShare(o) { return API.riderCreditOf ? API.riderCreditOf(o) : Number(o.riderCredit || o.deliveryFee || 0); }
    function shopWalletBal() {
      return shopOrders().filter(cardPaid).reduce((n, o) => n + shopShare(o), 0);
    }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function rs(n) { return 'Rs. ' + Math.round(Number(n)||0).toLocaleString('en-LK'); }
    function oid(id) { return '#' + String(id||'').replace('_','-'); }
    function myShop() {
      const sid = shopId();
      const s = API.shops.find((x) => x.id === sid) || {};
      return {
        id: sid,
        name: s.name || (API.user && API.user.shopName) || 'My Shop',
        category: s.category || 'Bakery',
        rating: Number(s.rating || 0) || 5,
        reviews: Number(s.reviews || 0),
        hours: s.hours || '08:00 AM – 10:00 PM',
        image: s.image || '/img/shop-bakery.jpg',
        address: s.address || '',
        isOpen: s.isOpen !== false,
        promo: s.promo || '',
      };
    }
    function shopName() {
      const s = myShop();
      return (API.shopTitle && API.shopTitle(s)) || s.name;
    }
    function shopTags(s) {
      const c = String((s && s.category) || 'Bakery');
      if (/baker/i.test(c)) return 'Bakery • Cakes • Pastries';
      return c;
    }
    function shopAbout(s) {
      const p = String((s && (s.promo || s.about)) || '');
      if (!p || /buy 1/i.test(p)) {
        return 'Freshly baked cakes, pastries and desserts made with love. We use the best ingredients to bring happiness to your table.';
      }
      return p;
    }
    function timeOf(o) {
      const d = new Date(o.timestamp || Date.now());
      return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }
    function thumb(o) {
      const it = (o.items || [])[0];
      if (it && it.id) {
        const item = API.items.find((i) => i.id === it.id);
        if (item && item.image) return item.image;
      }
      const shop = API.shopOf(o.shopId);
      return shop.image || '/img/shop-bakery.jpg';
    }
    function badgeText(o) {
      if (o.status === 'pending') return 'New';
      if (o.status === 'ready') return 'Ready';
      if (o.status === 'accepted') return 'Rider accepted';
      if (o.status === 'picked_up' || o.status === 'on_the_way') return 'Picked up';
      return API.statusLabel(o.status);
    }
    const SVG = {
      dash: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',
      orders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4h8l1 3H7z"/><path d="M6 7h12v13H6z"/></svg>',
      menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
      profile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M5 20c1.5-4 12.5-4 14 0"/></svg>',
      bell: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 21h4"/></svg>',
      store: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 10V20h16V10"/><path d="M3 10l9-7 9 7"/><path d="M9 20v-6h6v6"/></svg>',
      clip: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M8 4h8l1 3H7z"/><path d="M6 7h12v13H6z"/></svg>',
      chef: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M8 14h8v6H8z"/><path d="M6 14c0-5 3-8 6-8s6 3 6 8"/></svg>',
      check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="m5 12 5 5 9-10"/></svg>',
      bike: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17 10 8h6l4 9"/></svg>',
    };
    function nav() {
      const t = state.tab;
      return `<nav class="bnav">
        <button data-tab="dash" class="${t==='dash'?'on':''}">${SVG.dash}Dashboard</button>
        <button data-tab="orders" class="${t==='orders'?'on':''}">${SVG.orders}Orders</button>
        <button data-tab="menu" class="${t==='menu'?'on':''}">${SVG.menu}Menu</button>
        <button data-tab="account" class="${t==='account'?'on':''}">${SVG.profile}Profile</button>
      </nav>`;
    }
    function loginView() {
      return `<div class="sp-auth" data-shop-auth="login">
        <div class="sp-mark">${STORE_MARK}</div>
        <h1>Welcome Back!</h1>
        <p class="sub">Login to your shop account</p>
        <label>Email or Phone Number</label>
        <input id="loginId" placeholder="Email or Phone Number" value="${esc(state.loginId)}" autocomplete="username" />
        <p class="err" data-err></p>
        <button class="btn-green" type="button" data-shop-login>Login</button>
        <div class="or">or</div>
        <button class="ghost" type="button" data-google>${GOOGLE_LOGO} Continue with Google</button>
        <button class="ghost wa-btn" type="button" data-wa-login>${WA_LOGO} Continue with WhatsApp</button>
        <div class="foot">Don't have an account? <button type="button" data-go-reg>Sign Up</button></div>
      </div>${waSheet()}`;
    }
    function waSheet() {
      const w = state.wa || {};
      if (!w.open) return '';
      const codeStep = w.step === 'code';
      return '<div class="qb-wa-mask" data-wa-sheet><div class="qb-wa-sheet">'
        + '<b>Continue with WhatsApp</b>'
        + '<p>Enter your WhatsApp number. We send a 4-digit code to that chat, then you are in.</p>'
        + (codeStep
          ? ('<p class="sub">Code sent to ' + esc(w.phone) + '</p>'
            + '<div class="otp-boxes">'
            + '<input data-wad="0" maxlength="1" inputmode="numeric" />'
            + '<input data-wad="1" maxlength="1" inputmode="numeric" />'
            + '<input data-wad="2" maxlength="1" inputmode="numeric" />'
            + '<input data-wad="3" maxlength="1" inputmode="numeric" />'
            + '</div><p class="err">' + esc(w.err || '') + '</p>'
            + '<button class="btn-green" type="button" data-wa-verify>Verify &amp; enter</button>'
            + '<button class="btn-ghost-qb" type="button" data-wa-resend>Resend on WhatsApp</button>')
          : ('<input id="waPhone" placeholder="07X XXX XXXX" value="' + esc(w.phone || '') + '" />'
            + '<p class="err">' + esc(w.err || '') + '</p>'
            + '<button class="btn-green" type="button" data-wa-send>Send WhatsApp code</button>'))
        + '<button class="qb-skip" type="button" data-wa-close>Cancel</button>'
        + '</div></div>';
    }
    function killRegMap() {
      if (state.regMap) { try { state.regMap.destroy(); } catch (_) {} state.regMap = null; }
    }
    function startShopGps() {
      if (!navigator.geolocation) return;
      const opt = { enableHighAccuracy: true, maximumAge: 0, timeout: 25000 };
      const onFix = async (pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        const acc = Number(pos.coords.accuracy || 999);
        if (state.reg.acc != null && state.reg.acc <= 12 && acc > 40) return;
        state.reg.liveLat = lat; state.reg.liveLng = lng; state.reg.acc = acc;
        if (state.regMap && state.regMap.setLive) state.regMap.setLive(lat, lng, acc);
        if (!state.reg.custom) {
          state.reg.lat = lat; state.reg.lng = lng;
          if (state.regMap && state.regMap.goLive) state.regMap.goLive(lat, lng, 18);
          if (!state.reg.addrDirty && typeof reversePlace === 'function') {
            const label = await reversePlace(lat, lng);
            if (!state.reg.custom && !state.reg.addrDirty) {
              state.reg.address = label;
              const inp = document.getElementById('regAddr');
              if (inp && document.activeElement !== inp) inp.value = label;
            }
          }
        }
        const accEl = document.querySelector('[data-reg-acc]');
        if (accEl) accEl.textContent = 'Live GPS ±' + Math.max(1, Math.round(acc)) + ' m · drag the pin';
      };
      navigator.geolocation.getCurrentPosition(onFix, () => {
        const accEl = document.querySelector('[data-reg-acc]');
        if (accEl) accEl.textContent = 'Allow location, then drag the pin';
      }, opt);
      if (!startShopGps._on) {
        startShopGps._on = true;
        navigator.geolocation.watchPosition(onFix, () => {}, opt);
      }
    }
    function bindRegMap() {
      const el = document.getElementById('regMap');
      if (!el || typeof mountLocationPicker !== 'function') return;
      killRegMap();
      state.regMap = mountLocationPicker(el, {
        lat: state.reg.lat,
        lng: state.reg.lng,
        liveLat: state.reg.liveLat,
        liveLng: state.reg.liveLng,
      });
      if (state.regMap && state.regMap.onMoveEnd) {
        state.regMap.onMoveEnd(async (lat, lng) => {
          state.reg.custom = true;
          state.reg.lat = lat;
          state.reg.lng = lng;
          if (state.reg.addrDirty) return;
          const label = typeof reversePlace === 'function' ? await reversePlace(lat, lng) : (lat.toFixed(5) + ', ' + lng.toFixed(5));
          state.reg.address = label;
          const inp = document.getElementById('regAddr');
          if (inp && document.activeElement !== inp) inp.value = label;
        });
      }
      const liveBtn = document.querySelector('[data-reg-live]');
      if (liveBtn) liveBtn.onclick = () => {
        if (state.reg.liveLat == null) { startShopGps(); return; }
        state.reg.custom = false;
        if (state.regMap && state.regMap.goLive) state.regMap.goLive(state.reg.liveLat, state.reg.liveLng, 18);
        state.reg.lat = state.reg.liveLat; state.reg.lng = state.reg.liveLng;
        if (!state.reg.addrDirty && typeof reversePlace === 'function') {
          reversePlace(state.reg.liveLat, state.reg.liveLng).then((label) => {
            state.reg.address = label;
            const inp = document.getElementById('regAddr');
            if (inp) inp.value = label;
          });
        }
      };
      startShopGps();
    }
    function registerView() {
      const r = state.reg;
      const acc = r.acc != null ? ('Live GPS ±' + Math.max(1, Math.round(r.acc)) + ' m · drag the pin') : 'Allow location, then drag the pin';
      return `<div class="sp-auth" data-shop-auth="register">
        <div class="sp-mark">${STORE_MARK}</div>
        <h1>Create Your Shop Account</h1>
        <p class="sub">Join QuickBite and start receiving orders</p>
        <label>Shop Name</label>
        <input id="regShop" placeholder="e.g. your shop name" value="${esc(r.shopName)}" />
        <label>Owner Name</label>
        <input id="regOwner" placeholder="e.g. Nimal Perera" value="${esc(r.ownerName)}" />
        <label>Live location</label>
        <div class="sp-map-wrap"><div id="regMap" class="sp-map"></div><button type="button" class="sp-live" data-reg-live title="Live location">◎</button></div>
        <p class="sp-map-meta" data-reg-acc>${esc(acc)}</p>
        <label>Address</label>
        <input id="regAddr" placeholder="Street, city" value="${esc(r.address)}" />
        <label>Phone Number</label>
        <input id="regPhone" placeholder="+94 7X XXX XXXX" value="${esc(r.phone)}" ${lockRegPhone(r.phone) ? 'readonly' : ''} />
        <p class="err" data-err></p>
        <button class="btn-green" type="button" data-shop-register>Register</button>
        <div class="foot">Already have an account? <button type="button" data-go-login>Login</button></div>
      </div>`;
    }
    function otpView() {
      return OtpLogin.render({
        role: 'shop',
        title: 'Enter the 4-digit code',
        sub: 'WhatsApp sent the code. Enter it to open your dashboard.',
        phone: state.loginId,
      });
    }
    function orderCard(o) {
      const items = (o.items||[]).map((i)=>i.name+' x'+i.qty).join(', ');
      return `<div class="sd-order" data-open-order="${esc(o.id)}">
        <img src="${thumb(o)}" alt="" />
        <div class="grow">
          <div class="oid">${esc(oid(o.id))}</div>
          <div class="sub">${esc(timeOf(o))} · ${!/cash/i.test(String(o.paymentMethod||'')) && /visa|master|amex|card|••••|unionpay|jcb/i.test(String(o.paymentMethod||'')) ? 'Card paid' : 'COD'} · ${esc(items)}</div>
          <div class="rs">${rs(o.totalAmount)}</div>
          <div class="sd-acts">
            ${o.status==='pending' ? `<button class="btn sm green" data-act="preparing" data-id="${esc(o.id)}">Accept</button>
              <button class="btn sm ghost" data-act="cancelled" data-id="${esc(o.id)}">Reject</button>` : ''}
            ${o.status==='preparing' ? `<button class="btn sm green" data-act="ready" data-id="${esc(o.id)}">Food is ready</button>` : ''}
            ${o.status==='accepted' || o.status==='picked_up' || o.status==='on_the_way' || o.status==='delivered' ? `<button class="btn sm" data-track="${esc(o.id)}">Track</button>` : ''}
          </div>
        </div>
        <span class="badge ${o.status}">${esc(badgeText(o))}</span>
      </div>`;
    }
    function dashView() {
      const orders = shopOrders();
      const pending = orders.filter((o) => o.status === 'pending').length;
      const preparing = orders.filter((o) => o.status === 'preparing').length;
      const ready = orders.filter((o) => o.status === 'ready').length;
      const onway = orders.filter((o) => o.status === 'accepted' || o.status === 'picked_up' || o.status === 'on_the_way').length;
      const list = orders.filter((o) => {
        if (state.filter === 'prep') return o.status === 'preparing';
        if (state.filter === 'ready') return o.status === 'ready';
        if (state.filter === 'way') return o.status === 'accepted' || o.status === 'picked_up' || o.status === 'on_the_way';
        return true;
      });
      return `<div class="scroll">
        <div class="sd-head">
          <div class="sd-logo">${SVG.store}</div>
          <h1>Shop Dashboard</h1>
          <button class="sd-bell" data-tab="orders">${SVG.bell}</button>
        </div>
        <div class="sd-shop">${esc(shopName())} <span class="open-pill"><i></i> Open</span></div>
        <div class="sd-hero">
          <img src="/img/shop-bakery.jpg" alt="" />
          <div class="copy">
            <h2>Good Food<br>Happy Customers</h2>
            <p>Manage your orders and grow your business</p>
          </div>
        </div>
        <div class="sd-stats">
          <div class="sd-stat teal"><div class="si">${SVG.clip}</div><b>${pending}</b><span>New Orders</span></div>
          <div class="sd-stat gold"><div class="si">${SVG.chef}</div><b>${preparing}</b><span>Preparing</span></div>
          <div class="sd-stat purple"><div class="si">${SVG.check}</div><b>${ready}</b><span>Ready</span></div>
          <div class="sd-stat green"><div class="si">${SVG.bike}</div><b>${onway}</b><span>On Delivery</span></div>
        </div>
        <div class="sd-tabs">
          <button class="${state.filter==='all'?'on':''}" data-filter="all">All Orders</button>
          <button class="${state.filter==='prep'?'on':''}" data-filter="prep">Preparing</button>
          <button class="${state.filter==='ready'?'on':''}" data-filter="ready">Ready</button>
          <button class="${state.filter==='way'?'on':''}" data-filter="way">On Delivery</button>
        </div>
        ${list.map(orderCard).join('') || '<div class="pad muted">No tickets in this tab. Place an order in the User app.</div>'}

    function bindChatKeyboard() {
      const apply = () => {
        const vv = window.visualViewport;
        if (!vv) return;
        const kb = Math.max(0, (window.innerHeight || document.documentElement.clientHeight) - vv.height - (vv.offsetTop || 0));
        document.documentElement.style.setProperty('--kb', kb + 'px');
        const b = document.getElementById('bubbles');
        if (b) b.scrollTop = b.scrollHeight;
      };
      if (!bindChatKeyboard._on) {
        bindChatKeyboard._on = true;
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', apply);
          window.visualViewport.addEventListener('scroll', apply);
        }
        window.addEventListener('focusin', apply);
        window.addEventListener('focusout', () => {
          setTimeout(() => document.documentElement.style.setProperty('--kb', '0px'), 60);
        });
      }
      apply();
    }

    function render(opts) {
      const root = document.getElementById('root');
      const keep = !!(opts && opts.keepScroll);
      const sc0 = root.querySelector('.scroll');
      const y = keep && sc0 ? sc0.scrollTop : 0;
      if (keep && state.screen === 'item' && root.querySelector('[data-save-item]')) return;
      if (keep && state.screen === 'edit-shop' && root.querySelector('[data-save-shop]')) return;
      try {
      if (!API.user) {
        if (keep && root.querySelector('[data-shop-auth], [data-otp-root]')) return;
        if (state.auth === 'register') {
          killRegMap();
          root.innerHTML = registerView();
          bindAuth();
          bindRegMap();
          return;
        }
        if (state.auth === 'otp') {
          killRegMap();
          root.innerHTML = otpView();
          OtpLogin.bind({ role: 'shop', onReady: async (out) => {
            if (out && out.needsRegister) {
              state.auth = 'register';
              state.fromReg = true;
              state.reg.phone = out.phone || state.loginId;
              render();
              return;
            }
            state.tab = 'dash';
            state.auth = 'login';
            render();
          } });
          const pi = document.getElementById('phone');
          if (pi) pi.value = state.loginId;
          const phoneStep = root.querySelector('[data-step="phone"]');
          const codeStep = root.querySelector('[data-step="code"]');
          if (phoneStep) phoneStep.classList.add('hidden');
          if (codeStep) codeStep.classList.remove('hidden');
          const sp = root.querySelector('[data-sent-phone]');
          if (sp) sp.textContent = state.loginId;
          const back = root.querySelector('[data-back-phone]');
          if (back) back.onclick = () => {
            state.auth = state.fromReg ? 'register' : 'login';
            render();
          };
          return;
        }
        killRegMap();
        root.innerHTML = loginView();
        bindAuth();
        return;
      }
      killRegMap();
      if (API.user && API._shopCatalogReady && API.isShopRegistered && !API.isShopRegistered()) {
        goShopRegister();
        return;
      }
      if (state.screen === 'chat' && state.orderId) {
        const o = API.orders.find((x) => x.id === state.orderId);
        if (o && (!API.canChat || API.canChat(o, 'shop'))) {
          const existing = root.querySelector('[data-chat-root="'+state.orderId+'"]');
          const typing = document.activeElement && document.activeElement.closest('[data-chat-root]');
          const lane = (API.chatLane && API.chatLane(o)) || 'shop';
          if (existing && existing.getAttribute('data-lane') === lane && (keep || typing)) {
            paintShopChat(existing);
            return;
          }
          if (state.mapHandle) { try { state.mapHandle.destroy(); } catch(_){} state.mapHandle = null; }
          if (API.markChatRead) API.markChatRead(state.orderId, 'shop');
          root.innerHTML = shopChatView(o);
          bind();
          bindChatKeyboard();
          const b = document.getElementById('bubbles');
          if (b) b.scrollTop = b.scrollHeight;
          const input = document.querySelector('#chatForm input[name="text"]');
          if (input) setTimeout(() => input.focus(), 50);
          return;
        }
        state.screen = state.trackId ? '' : 'order';
      }
      if (state.trackId) {
        const o = API.orders.find((x) => x.id === state.trackId);
        if (!o || o.status === 'cancelled') { state.trackId = null; }
        else if (o.status === 'delivered') {
          state.trackId = null;
          state.screen = 'order';
          state.orderId = o.id;
          if (state.mapHandle) { try { state.mapHandle.destroy(); } catch (_) {} state.mapHandle = null; }
        }
        else {
          const existing = root.querySelector('[data-track-root="'+state.trackId+'"]');
          const hasRider = o.riderName ? '1' : '0';
          if (existing && state.mapHandle && existing.dataset.hasRider === hasRider) {
            state.mapHandle.update(o);
            TrackUI.paint(existing, o, 'shop');
            return;
          }
          if (state.mapHandle) { try { state.mapHandle.destroy(); } catch(_){} state.mapHandle = null; }
          root.innerHTML = TrackUI.screen(o, 'shop');
          bind();
          bindMapChrome();
          const el = document.getElementById('map');
          if (el) state.mapHandle = mountTrackingMap(el, o);
          return;
        }
      }
      if (state.mapHandle) { try { state.mapHandle.destroy(); } catch(_){} state.mapHandle = null; }
      if (state.screen === 'order') root.innerHTML = orderDetailsView();
      else if (state.screen === 'wallet') root.innerHTML = walletView();
      else if (state.screen === 'item') root.innerHTML = itemEditView();
      else if (state.screen === 'edit-shop') root.innerHTML = editShopView();
      else if (state.screen === 'store') root.innerHTML = storeView();
      else if (state.tab === 'menu') root.innerHTML = menuView();
      else if (state.tab === 'orders') root.innerHTML = ordersView();
      else if (state.tab === 'account') root.innerHTML = accountView();
      else root.innerHTML = dashView();
      bind();
      } finally {
        if (keep) {
          const sc = root.querySelector('.scroll');
          if (sc) sc.scrollTop = y;
        }
      }
    }
    function goShopRegister() {
      const u = API.user;
      const gName = (u && u.name) || '';
      const gEmail = (u && u.email) || '';
      const gPhoto = (u && (u.photo || u.vehicle)) || '';
      if (gName && !state.reg.ownerName) state.reg.ownerName = gName;
      if (gEmail) state.reg.email = gEmail;
      if (gPhoto) state.reg.photo = gPhoto;
      let phone = (u && u.phone) || (API.verifiedPhone && API.verifiedPhone('shop')) || state.reg.phone || state.loginId || '';
      if (API.normalizePhone) phone = API.normalizePhone(phone);
      if (!isRealWaPhone(phone)) phone = '';
      const rec = (phone && API.recallShopProfile) ? API.recallShopProfile(phone) : null;
      if (rec) {
        if (!state.reg.shopName) state.reg.shopName = rec.shopName || '';
        if (!state.reg.ownerName) state.reg.ownerName = rec.ownerName || '';
        if (!state.reg.address) state.reg.address = rec.address || '';
        if (state.reg.lat == null && rec.lat != null) state.reg.lat = Number(rec.lat);
        if (state.reg.lng == null && rec.lng != null) state.reg.lng = Number(rec.lng);
      }
      state.reg.phone = phone;
      const prev = (API._pendingShop) || {};
      if (API.setPendingShop) {
        API.setPendingShop(Object.assign({}, prev, {
          shopName: state.reg.shopName || prev.shopName || '',
          ownerName: state.reg.ownerName || gName || prev.ownerName || '',
          email: gEmail || state.reg.email || prev.email || '',
          photo: gPhoto || state.reg.photo || prev.photo || '',
        }));
      }
      if (API.user && API.parkForRegister) API.parkForRegister('shop');
      state.auth = 'register';
      state.fromReg = true;
      render();
    }
    function bindWaSheet() {
      const sheet = document.querySelector('[data-wa-sheet]');
      if (!sheet) return;
      const close = sheet.querySelector('[data-wa-close]');
      if (close) close.onclick = () => { state.wa.open = false; render(); };
      const send = sheet.querySelector('[data-wa-send]');
      if (send) send.onclick = async () => {
        const phone = ((document.getElementById('waPhone') || {}).value || state.wa.phone || '').trim();
        state.wa.phone = phone;
        send.disabled = true;
        send.textContent = 'Sending…';
        try {
          const out = await API.sendOtp('shop', phone);
          state.wa.phone = out.phone || phone;
          state.loginId = state.wa.phone;
          state.wa.step = 'code';
          state.wa.err = '';

        } catch (e) {
          state.wa.err = e.message || 'Could not send WhatsApp code';
          render();

      };
      const resend = sheet.querySelector('[data-wa-resend]');
      if (resend) resend.onclick = async () => {
        try {
          await API.sendOtp('shop', state.wa.phone);
          state.wa.err = 'Code sent again.';
          render();
        } catch (e) {
          state.wa.err = e.message || 'Could not resend';
          render();
        }
      };
      const codeValue = () => [...sheet.querySelectorAll('.otp-boxes input')].map((i) => i.value).join('');
      async function verifyWa() {
        const code = codeValue();
        if (code.length !== 4) { state.wa.err = 'Enter the 4-digit code'; render(); return; }
        try {
          const out = await API.verifyOtp('shop', state.wa.phone, code);
          state.wa.open = false;
          if (out && out.needsRegister) {
            state.auth = 'register';
            state.fromReg = true;
            state.reg.phone = out.phone || state.wa.phone;
            render();
            return;
          }
          state.tab = 'dash';
          state.auth = 'login';
          render();
        } catch (e) {
          state.wa.err = e.message || 'Could not verify';
          render();
        }
      }
      const verifyBtn = sheet.querySelector('[data-wa-verify]');
      if (verifyBtn) verifyBtn.onclick = verifyWa;
      sheet.querySelectorAll('.otp-boxes input').forEach((el) => {
        el.oninput = () => {
          el.value = el.value.replace(/\D/g, '').slice(0, 1);
          const i = Number(el.dataset.wad);
          if (el.value && i < 3) {
            const next = sheet.querySelector('.otp-boxes input[data-wad="' + (i + 1) + '"]');
            if (next) next.focus();
          }
          if (codeValue().length === 4) verifyWa();
        };
      });
    }
    function bindAuth() {
      const root = document.getElementById('root');
      const err = root.querySelector('[data-err]');
      const goReg = root.querySelector('[data-go-reg]');
      if (goReg) goReg.onclick = () => { state.auth = 'register'; render(); };
      const goLogin = root.querySelector('[data-go-login]');
      if (goLogin) goLogin.onclick = () => { killRegMap(); state.auth = 'login'; render(); };
      const addr = document.getElementById('regAddr');
      if (addr) addr.oninput = () => { state.reg.addrDirty = true; state.reg.address = addr.value; };
      const rs = document.getElementById('regShop');
      if (rs) rs.oninput = () => { state.reg.shopName = rs.value; };
      const ro = document.getElementById('regOwner');
      if (ro) ro.oninput = () => { state.reg.ownerName = ro.value; };
      const rp = document.getElementById('regPhone');
      if (rp) rp.oninput = () => { state.reg.phone = rp.value; };
      const waOpen = root.querySelector('[data-wa-login]');
      if (waOpen) waOpen.onclick = () => {
        state.wa = { open: true, step: 'phone', phone: '', err: '' };
        render();
      };
      bindWaSheet();
      const googleBtn = root.querySelector('[data-google]');
      if (googleBtn) googleBtn.onclick = async (e) => {
        e.preventDefault();
        if (err) err.textContent = '';
        const html = googleBtn.innerHTML;
        googleBtn.disabled = true;
        googleBtn.textContent = 'Opening Google…';
        try {
          const profile = await API.googleSignIn();
          await API.signInGoogle(profile);
          render();
        } catch (ex) {
          if (err) err.textContent = ex.message || 'Google sign-in failed';
          googleBtn.disabled = false;
          googleBtn.innerHTML = html;
        }
      };
      root.querySelectorAll('[data-shop-login]').forEach((b) => {
        b.onclick = async () => {
          const id = ((document.getElementById('loginId') || {}).value || state.loginId || '').trim();
          state.loginId = id;
          if (err) err.textContent = '';
          if (!id) {
            if (err) err.textContent = 'Enter email or phone.';
            return;
          }
          b.disabled = true;
          const label = b.textContent;
          b.textContent = 'Sending WhatsApp…';
          try {
            const phone = API.normalizePhone ? API.normalizePhone(id) : id;
            state.loginId = phone;
            state.reg.phone = phone;
            API.setPendingShop(null);
            state.fromReg = false;
            await API.sendOtp('shop', phone);
            state.auth = 'otp';
            render();
          } catch (e) {
            if (err) err.textContent = e.message;
            b.disabled = false;
            b.textContent = label;
          }
        };
      });
      const regBtn = root.querySelector('[data-shop-register]');
      if (regBtn) regBtn.onclick = async () => {
        const pin = (state.regMap && state.regMap.getCenter) ? state.regMap.getCenter() : null;
        if (pin) { state.reg.lat = pin.lat; state.reg.lng = pin.lng; }
        state.reg.shopName = (document.getElementById('regShop') || {}).value || '';
        state.reg.ownerName = (document.getElementById('regOwner') || {}).value || '';
        state.reg.phone = (document.getElementById('regPhone') || {}).value || '';
        state.reg.address = (document.getElementById('regAddr') || {}).value || state.reg.address || '';
        if (err) err.textContent = '';
        if (!state.reg.shopName.trim() || !state.reg.ownerName.trim() || !state.reg.phone.trim()) {
          if (err) err.textContent = 'Enter shop name, owner name, and phone.';
          return;
        }
        if (state.reg.lat == null || state.reg.lng == null) {
          if (err) err.textContent = 'Pin your shop on the map.';
          return;
        }
        if (!String(state.reg.address || '').trim()) {
          if (err) err.textContent = 'Enter the shop address.';
          return;
        }
        const phone = API.normalizePhone ? API.normalizePhone(state.reg.phone) : state.reg.phone;
        if (!isRealWaPhone(phone)) {
          if (err) err.textContent = 'Enter a valid WhatsApp number (07X XXX XXXX).';
          return;
        }
        state.loginId = phone;
        API.setPendingShop({
          shopName: state.reg.shopName.trim(),
          ownerName: state.reg.ownerName.trim(),
          phone,
          email: state.reg.email || '',
          photo: state.reg.photo || '',
          address: String(state.reg.address).trim(),
          lat: state.reg.lat,
          lng: state.reg.lng,
        });
        if (API.rememberShopProfile) {
          API.rememberShopProfile(phone, {
            shopId: API.shopIdFor ? API.shopIdFor(phone) : '',
            shopName: state.reg.shopName.trim(),
            ownerName: state.reg.ownerName.trim(),
            address: String(state.reg.address).trim(),
            lat: state.reg.lat,
            lng: state.reg.lng,
          });
        }
        state.fromReg = true;
        const verified = API.verifiedPhone && API.verifiedPhone('shop') === phone;
        regBtn.disabled = true;
        regBtn.textContent = verified ? 'Saving…' : 'Sending WhatsApp…';
        try {
          if (verified) {
            await API.completeShopRegister();
            state.tab = 'account';
            render();
            return;
          }
          await API.sendOtp('shop', phone);
          state.auth = 'otp';
          render();
        } catch (e) {
          if (err) err.textContent = e.message;
          regBtn.disabled = false;
          regBtn.textContent = 'Register';
        }
      };
    }
    function bind() {
      const root = document.getElementById('root');
      root.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; state.trackId = null; state.screen = ''; render(); });
      root.querySelectorAll('[data-filter]').forEach((b) => b.onclick = () => { state.filter = b.dataset.filter; render(); });
      root.querySelectorAll('[data-act]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); API.patch(b.dataset.id, { status: b.dataset.act }); });
      root.querySelectorAll('[data-toggle]').forEach((el) => el.onchange = (e) => {
        e.stopPropagation();
        API.toggleItem(el.dataset.toggle, el.checked);
      });
      root.querySelectorAll('[data-stop]').forEach((el) => el.onclick = (e) => e.stopPropagation());
      root.querySelectorAll('[data-open-order]').forEach((b) => b.onclick = () => {
        state.orderId = b.dataset.openOrder; state.screen = 'order'; render();
      });
      root.querySelectorAll('[data-close-order]').forEach((b) => b.onclick = () => { state.screen = ''; state.orderId = null; render(); });
      root.querySelectorAll('[data-add-item]').forEach((b) => b.onclick = () => {
        if (API.isShopRegistered && !API.isShopRegistered()) { goShopRegister(); return; }
        state.itemId = null; state.itemDraft = { category: 'Food', isAvailable: true }; state.screen = 'item'; render();
      });
      root.querySelectorAll('[data-edit-item]').forEach((b) => b.onclick = () => {
        const it = API.items.find((i) => i.id === b.dataset.editItem);
        state.itemId = it && it.id; state.itemDraft = it ? Object.assign({}, it) : { category: 'Food' }; state.screen = 'item'; render();
      });
      root.querySelectorAll('[data-close-item]').forEach((b) => b.onclick = () => { state.screen = ''; state.itemDraft = null; render(); });
      root.querySelectorAll('[data-mcat]').forEach((b) => b.onclick = () => { state.menuCat = b.dataset.mcat; render({ keepScroll: true }); });
      const mq = document.getElementById('menuQ');
      if (mq) mq.oninput = () => { state.menuQ = mq.value; render({ keepScroll: true }); const n=document.getElementById('menuQ'); if(n){ n.focus(); n.selectionStart=n.selectionEnd=n.value.length; } };
      root.querySelectorAll('[data-set-img]').forEach((b) => b.onclick = () => {
        state.itemDraft = Object.assign({}, readItemForm(), { image: b.dataset.setImg });
        render({ keepScroll: true });
      });
      const pick = root.querySelector('[data-pick-photo]');
      const file = document.getElementById('itemFile');
      if (pick && file) pick.onclick = () => file.click();
      if (file) file.onchange = () => {
        const f = file.files && file.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          let src = String(r.result || '');
          if (src.length > 180000) src = FOOD_IMGS[0];
          state.itemDraft = Object.assign({}, readItemForm(), { image: src });
          render({ keepScroll: true });
        };
        r.readAsDataURL(f);
      };
      const save = root.querySelector('[data-save-item]');
      if (save) save.onclick = async () => {
        if (API.isShopRegistered && !API.isShopRegistered()) { goShopRegister(); return; }
        const d = readItemForm();
        if (!d.name) { const e = root.querySelector('[data-item-err]'); if (e) e.textContent = 'Enter an item name.'; return; }
        save.disabled = true; save.textContent = 'Saving…';
        try {
          await API.saveItem(d);
          state.screen = ''; state.itemDraft = null; state.tab = 'menu';
          render();
        } catch (err) {
          const e = root.querySelector('[data-item-err]');
          if (e) e.textContent = err.message || 'Could not save item.';
          save.disabled = false; save.textContent = 'Save Item';
        }
      };
      root.querySelectorAll('[data-track]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); state.screen = ''; state.trackId = b.dataset.track; render(); });
      root.querySelectorAll('[data-track-back]').forEach((b) => b.onclick = () => { state.trackId = null; render(); });
      root.querySelectorAll('[data-done]').forEach((b) => b.onclick = () => { state.trackId = null; render(); });
      root.querySelectorAll('[data-chat]').forEach((b) => b.onclick = () => {
        const o = API.orders.find((x) => x.id === b.dataset.chat);
        if (API.canChat && !API.canChat(o, 'shop')) return;
        state.orderId = b.dataset.chat;
        state.screen = 'chat';
        if (API.markChatRead) API.markChatRead(state.orderId, 'shop');
        render();
      });
      root.querySelectorAll('[data-close-chat]').forEach((b) => b.onclick = () => {
        state.screen = state.trackId ? '' : 'order';
        render();
      });
      async function sendShopChat(text) {
        const body = String(text || '').trim();
        if (!body || !state.orderId) return;
        const form = document.getElementById('chatForm');
        if (form && form.text) form.text.value = '';
        try {
          await API.sendMessage(state.orderId, (API.publicShopName && API.publicShopName(myShop())) || (API.user && API.user.shopName) || 'Shop', 'shop', body);
        } catch (e) { alert(e.message); return; }
        if (API.markChatRead) API.markChatRead(state.orderId, 'shop');
        const keepChat = document.querySelector('[data-chat-root]');
        if (keepChat) paintShopChat(keepChat);
        const input = document.querySelector('#chatForm input[name="text"]');
        if (input) input.focus();
      }
      const form = document.getElementById('chatForm');
      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          await sendShopChat(form.text && form.text.value);
        };
        const input = form.querySelector('input[name="text"]');
        if (input) {
          input.setAttribute('inputmode', 'text');
          input.addEventListener('focus', bindChatKeyboard);
        }
      }
      root.querySelectorAll('[data-quick]').forEach((b) => b.onclick = () => sendShopChat(b.dataset.quick));
      const logout = document.getElementById('logout');
      if (logout) logout.onclick = () => { API.logout(); state.tab = 'account'; state.auth = 'login'; render(); };
      root.querySelectorAll('[data-edit-shop]').forEach((b) => b.onclick = () => {
        const s = Object.assign({}, myShop());
        const raw = (API.shops.find((x) => x.id === shopId()) || {}).name;
        if (raw && String(raw).trim()) s.name = raw;
        state.shopDraft = s;
        state.screen = 'edit-shop';
        render();
      });
      root.querySelectorAll('[data-view-store]').forEach((b) => b.onclick = () => { state.screen = 'store'; render(); });
      root.querySelectorAll('[data-open-wallet]').forEach((b) => b.onclick = () => { state.screen = 'wallet'; render(); });
      root.querySelectorAll('[data-close-wallet]').forEach((b) => b.onclick = () => { state.screen = ''; state.tab = 'account'; render(); });
      root.querySelectorAll('[data-close-shop]').forEach((b) => b.onclick = () => { state.screen = ''; state.shopDraft = null; state.tab = 'account'; render(); });
      const pickShop = root.querySelector('[data-pick-shop-photo]');
      const shopFile = document.getElementById('shopFile');
      if (pickShop && shopFile) pickShop.onclick = () => shopFile.click();
      if (shopFile) shopFile.onchange = () => {
        const f = shopFile.files && shopFile.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          let src = String(r.result || '');
          if (src.length > 180000) src = '/img/shop-bakery.jpg';
          state.shopDraft = Object.assign({}, readShopForm(), { image: src });
          render({ keepScroll: true });
        };
        r.readAsDataURL(f);
      };
      const saveShop = root.querySelector('[data-save-shop]');
      if (saveShop) saveShop.onclick = async () => {
        const d = readShopForm();
        if (!d.name) { const e = root.querySelector('[data-shop-err]'); if (e) e.textContent = 'Enter a shop name.'; return; }
        saveShop.disabled = true; saveShop.textContent = 'Saving…';
        try {
          await API.saveShop(d);
          state.screen = ''; state.shopDraft = null; state.tab = 'account';
          render();
        } catch (err) {
          const e = root.querySelector('[data-shop-err]');
          if (e) e.textContent = err.message || 'Could not save profile.';
          saveShop.disabled = false; saveShop.textContent = 'Save Profile';
        }
      };
    }
    function readShopForm() {
      const d = Object.assign({}, myShop(), state.shopDraft || {});
      const name = document.getElementById('shopNameIn');
      const cat = document.getElementById('shopCatIn');
      const hours = document.getElementById('shopHoursIn');
      const about = document.getElementById('shopAboutIn');
      if (name) d.name = name.value.trim();
      if (cat) d.category = cat.value.trim();
      if (hours) d.hours = hours.value.trim();
      if (about) d.promo = about.value.trim();
      d.about = d.promo;
      return d;
    }
    function readItemForm() {
      const d = Object.assign({}, state.itemDraft || {});
      const name = document.getElementById('itemName');
      const price = document.getElementById('itemPrice');
      const cat = document.getElementById('itemCat');
      const desc = document.getElementById('itemDesc');
      if (name) d.name = name.value.trim();
      if (price) d.price = Number(price.value || 0);
      if (cat) d.category = cat.value;
      if (desc) d.desc = desc.value.trim();
      d.shopId = shopId();
      d.isAvailable = d.isAvailable !== false;
      if (state.itemId) d.id = state.itemId;
      return d;
    }
    API.on(() => {
      if (!API.user && document.querySelector('[data-otp-root], [data-shop-auth]')) return;
      render({ keepScroll: true });
    });
    render();
  </script>
</body>
</html>
