<!DOCTYPE html>
<html lang="en" data-role="shop">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shop Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/ui.css" />
  <link rel="stylesheet" href="/css/track.css" />
</head>
<body>
  <div class="app" id="root"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/live.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/maps.js"></script>
  <script src="/js/track-ui.js"></script>
  <script src="/js/otp-login.js"></script>
  <script>
    const state = {
      tab: 'dash', filter: 'all', trackId: null, mapHandle: null,
      screen: '', orderId: null, itemId: null, menuQ: '', menuCat: 'All',
      itemDraft: null,
    };
    const FOOD_IMGS = [
      '/img/shop-burger.jpg', '/img/shop-pizza.jpg', '/img/shop-bakery.jpg', '/img/cake-chocolate.jpg',
      '/img/cake-vanilla.jpg', '/img/iced-coffee.jpg', '/img/kottu.jpg', '/img/cookies.jpg',
    ];
    function shopId() { return (API.user && API.user.shopId) || 'SHOP_1'; }
    function itemImg(it) { return (it && it.image) || '/img/shop-bakery.jpg'; }
    function menuBucket(cat) {
      const c = String(cat || '').toLowerCase();
      if (/drink|beverage|coffee|juice|tea|ice/.test(c)) return 'Drinks';
      if (/dessert|cake|sweet|cookie|bakery|pastry/.test(c)) return 'Desserts';
      return 'Food';
    }
    function shopItems() {
      const sid = shopId();
      const mine = API.items.filter((it) => it.shopId === sid);
      return mine.length ? mine : API.items;
    }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function rs(n) { return 'Rs. ' + Math.round(Number(n)||0).toLocaleString('en-LK'); }
    function oid(id) { return '#' + String(id||'').replace('_','-'); }
    function shopName() {
      const s = API.shops.find((x) => x.id === 'SHOP_1') || API.shops[0] || {};
      return s.name || 'Kandy Bakers';
    }
    function timeOf(o) {
      const d = new Date(o.timestamp || Date.now());
      return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    }
    function thumb(o) {
      const it = (o.items || [])[0];
      if (it && it.id) {
        const item = API.items.find((i) => i.id === it.id);
        if (item && item.image) return item.image;
      }
      const shop = API.shopOf(o.shopId);
      return shop.image || '/img/shop-bakery.jpg';
    }
    function badgeText(o) {
      if (o.status === 'pending') return 'New';
      if (o.status === 'ready') return 'Ready';
      if (o.status === 'on_the_way') return 'On the Way';
      return API.statusLabel(o.status);
    }
    const SVG = {
      dash: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',
      orders: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4h8l1 3H7z"/><path d="M6 7h12v13H6z"/></svg>',
      menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h10"/></svg>',
      profile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M5 20c1.5-4 12.5-4 14 0"/></svg>',
      bell: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 21h4"/></svg>',
      store: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 10V20h16V10"/><path d="M3 10l9-7 9 7"/><path d="M9 20v-6h6v6"/></svg>',
      clip: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M8 4h8l1 3H7z"/><path d="M6 7h12v13H6z"/></svg>',
      chef: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M8 14h8v6H8z"/><path d="M6 14c0-5 3-8 6-8s6 3 6 8"/></svg>',
      check: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="m5 12 5 5 9-10"/></svg>',
      bike: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17 10 8h6l4 9"/></svg>',
    };
    function nav() {
      const t = state.tab;
      return `<nav class="bnav">
        <button data-tab="dash" class="${t==='dash'?'on':''}">${SVG.dash}Dashboard</button>
        <button data-tab="orders" class="${t==='orders'?'on':''}">${SVG.orders}Orders</button>
        <button data-tab="menu" class="${t==='menu'?'on':''}">${SVG.menu}Menu</button>
        <button data-tab="account" class="${t==='account'?'on':''}">${SVG.profile}Profile</button>
      </nav>`;
    }
    function loginView() {
      return OtpLogin.render({
        role: 'shop',
        title: 'Shop sign in',
        sub: 'We’ll send a 4-digit code on WhatsApp, then you enter the kitchen.',
        phone: '0772223333',
      });
    }
    function orderCard(o) {
      const items = (o.items||[]).map((i)=>i.name+' x'+i.qty).join(', ');
      return `<div class="sd-order" data-open-order="${esc(o.id)}">
        <img src="${thumb(o)}" alt="" />
        <div class="grow">
          <div class="oid">${esc(oid(o.id))}</div>
          <div class="sub">${esc(timeOf(o))} · ${esc(items)}</div>
          <div class="rs">${rs(o.totalAmount)}</div>
          <div class="sd-acts">
            ${o.status==='pending' ? `<button class="btn sm green" data-act="preparing" data-id="${esc(o.id)}">Accept</button>
              <button class="btn sm ghost" data-act="cancelled" data-id="${esc(o.id)}">Reject</button>` : ''}
            ${o.status==='preparing' ? `<button class="btn sm green" data-act="ready" data-id="${esc(o.id)}">Food is ready</button>` : ''}
            ${o.status==='on_the_way' || o.status==='delivered' ? `<button class="btn sm" data-track="${esc(o.id)}">Track</button>` : ''}
          </div>
        </div>
        <span class="badge ${o.status}">${esc(badgeText(o))}</span>
      </div>`;
    }
    function dashView() {
      const orders = API.orders;
      const pending = orders.filter((o) => o.status === 'pending').length;
      const preparing = orders.filter((o) => o.status === 'preparing').length;
      const ready = orders.filter((o) => o.status === 'ready').length;
      const onway = orders.filter((o) => o.status === 'on_the_way').length;
      const list = orders.filter((o) => {
        if (state.filter === 'prep') return o.status === 'preparing';
        if (state.filter === 'ready') return o.status === 'ready';
        if (state.filter === 'way') return o.status === 'on_the_way';
        return true;
      });
      return `<div class="scroll">
        <div class="sd-head">
          <div class="sd-logo">${SVG.store}</div>
          <h1>Shop Dashboard</h1>
          <button class="sd-bell" data-tab="orders">${SVG.bell}</button>
        </div>
        <div class="sd-shop">${esc(shopName())} <span class="open-pill"><i></i> Open</span></div>
        <div class="sd-hero">
          <img src="/img/shop-bakery.jpg" alt="" />
          <div class="copy">
            <h2>Good Food<br>Happy Customers</h2>
            <p>Manage your orders and grow your business</p>
          </div>
        </div>
        <div class="sd-stats">
          <div class="sd-stat teal"><div class="si">${SVG.clip}</div><b>${pending}</b><span>New Orders</span></div>
          <div class="sd-stat gold"><div class="si">${SVG.chef}</div><b>${preparing}</b><span>Preparing</span></div>
          <div class="sd-stat purple"><div class="si">${SVG.check}</div><b>${ready}</b><span>Ready</span></div>
          <div class="sd-stat green"><div class="si">${SVG.bike}</div><b>${onway}</b><span>On Delivery</span></div>
        </div>
        <div class="sd-tabs">
          <button class="${state.filter==='all'?'on':''}" data-filter="all">All Orders</button>
          <button class="${state.filter==='prep'?'on':''}" data-filter="prep">Preparing</button>
          <button class="${state.filter==='ready'?'on':''}" data-filter="ready">Ready</button>
          <button class="${state.filter==='way'?'on':''}" data-filter="way">On Delivery</button>
        </div>
        ${list.map(orderCard).join('') || '<div class="pad muted">No tickets in this tab. Place an order in the User app.</div>'}
      </div>${nav()}`;
    }
    function ordersView() {
      const list = API.orders.filter((o) => {
        if (state.filter === 'pending') return o.status === 'pending';
        if (state.filter === 'prep') return o.status === 'preparing';
        if (state.filter === 'ready') return o.status === 'ready';
        return true;
      });
      return `<div class="scroll ol-list">
        <div class="sd-head"><div class="sd-logo">${SVG.store}</div><h1>Orders</h1></div>
        <div class="ol-pills">
          <button class="${state.filter==='all'?'on':''}" data-filter="all">All</button>
          <button class="${state.filter==='pending'?'on':''}" data-filter="pending">Pending</button>
          <button class="${state.filter==='prep'?'on':''}" data-filter="prep">Preparing</button>
          <button class="${state.filter==='ready'?'on':''}" data-filter="ready">Ready</button>
        </div>
        ${list.map(orderCard).join('') || '<div class="pad muted">No orders in this tab.</div>'}
      </div>${nav()}`;
    }
    function menuView() {
      const q = (state.menuQ || '').trim().toLowerCase();
      const list = shopItems().filter((it) => {
        if (state.menuCat !== 'All' && menuBucket(it.category) !== state.menuCat) return false;
        if (q && !String(it.name).toLowerCase().includes(q) && !String(it.category).toLowerCase().includes(q)) return false;
        return true;
      });
      return `<div class="scroll mi-page">
        <div class="mi-head"><h1>Menu Items</h1></div>
        <div class="mi-cats">
          ${['All','Food','Drinks','Desserts'].map((c)=>`<button class="${state.menuCat===c?'on':''}" data-mcat="${c}">${c}</button>`).join('')}
        </div>
        <div class="mi-search">🔍 <input id="menuQ" placeholder="Search menu items…" value="${esc(state.menuQ)}" /></div>
        ${list.map((it) => `<div class="mi-row" data-edit-item="${esc(it.id)}">
          <img src="${itemImg(it)}" alt="" />
          <div class="grow"><b>${esc(it.name)}</b><div class="pr">${rs(it.price)}</div></div>
          <label class="sw" data-stop><input type="checkbox" data-toggle="${esc(it.id)}" data-on="${it.isAvailable?0:1}" ${it.isAvailable?'checked':''} /><i></i></label>
        </div>`).join('') || '<div class="pad muted">No items match. Tap Add Item.</div>'}
      </div>
      <button class="mi-add" type="button" data-add-item>+ Add Item</button>
      ${nav()}`;
    }
    function itemEditView() {
      const it = state.itemDraft || {};
      const img = it.image || '';
      const title = it.id ? 'Edit Item' : 'Add Menu Item';
      return `<div class="scroll ie-page">
        <div class="ie-head"><button class="back" type="button" data-close-item>←</button><h1>${title}</h1></div>
        <label class="ie-photo" data-pick-photo>${img ? `<img src="${esc(img)}" alt="" />` : '<span>📷<br>Tap to add image</span>'}</label>
        <input id="itemFile" type="file" accept="image/*" hidden />
        <div class="ie-form">
          <div class="ie-picks">${FOOD_IMGS.map((src)=>`<button type="button" class="${img===src?'on':''}" data-set-img="${src}"><img src="${src}" alt="" /></button>`).join('')}</div>
          <label>Item Name</label>
          <input id="itemName" placeholder="e.g. Chocolate Cake" value="${esc(it.name || '')}" />
          <label>Price (Rs.)</label>
          <input id="itemPrice" inputmode="decimal" placeholder="2500" value="${it.price != null ? esc(it.price) : ''}" />
          <label>Category</label>
          <select id="itemCat">
            ${['Food','Drinks','Desserts','Bakery','Pizza','Fast Food','Beverages'].map((c)=>`<option ${ (it.category||'Food')===c?'selected':'' }>${c}</option>`).join('')}
          </select>
          <label>Description</label>
          <textarea id="itemDesc" placeholder="e.g. Rich chocolate cake with cream">${esc(it.desc || it.description || '')}</textarea>
          <p class="err" data-item-err></p>
          <button class="btn full ie-save" type="button" data-save-item>Save Item</button>
        </div>
      </div>`;
    }
    function orderDetailsView() {
      const o = API.orders.find((x) => x.id === state.orderId);
      if (!o) return dashView();
      const items = (o.items || []).map((i) => i.name + ' x' + i.qty).join(', ') || 'Order';
      const phone = o.customerPhone || o.phone || '';
      const st = o.status;
      const steps = [
        ['pending', 'Order Placed'],
        ['preparing', 'Preparing'],
        ['ready', 'Ready'],
        ['on_the_way', 'On the Way'],
        ['delivered', 'Delivered'],
      ];
      const idx = Math.max(0, steps.findIndex((s) => s[0] === st));
      return `<div class="scroll ol-page">
        <div class="ol-head"><button class="back" type="button" data-close-order>←</button><h1>Order Details</h1></div>
        <div class="ol-card">
          <img src="${thumb(o)}" alt="" />
          <div class="meta">
            <div class="oid">${esc(oid(o.id))}</div>
            <h2>${esc(items)}</h2>
            <div class="rs">${rs(o.totalAmount)}</div>
          </div>
        </div>
        <div class="ol-steps">
          ${steps.map((s, i) => {
            const cls = i < idx ? 'done' : (i === idx ? 'on' : '');
            const t = i === 0 ? timeOf(o) : '';
            return `<div class="ol-step ${cls}">
              <div class="ol-rail"><div class="ol-dot"></div>${i < steps.length-1 ? '<div class="ol-line"></div>' : ''}</div>
              <div><b>${s[1]}</b>${t ? `<small>${esc(t)}</small>` : ''}</div>
            </div>`;
          }).join('')}
        </div>
        <div class="ol-cust">
          <img src="/img/avatar-user.jpg" alt="" />
          <div class="grow"><b>${esc(o.customerName || 'Customer')}</b><div class="sub">${esc(phone || 'WhatsApp customer')}</div></div>
          ${phone ? `<a class="call" href="tel:${esc(phone)}">Call</a>` : ''}
        </div>
        <div class="pad" style="display:flex;gap:8px;flex-wrap:wrap">
          ${st==='pending' ? `<button class="btn sm green" data-act="preparing" data-id="${esc(o.id)}">Accept</button>
            <button class="btn sm ghost" data-act="cancelled" data-id="${esc(o.id)}">Reject</button>` : ''}
          ${st==='preparing' ? `<button class="btn sm green" data-act="ready" data-id="${esc(o.id)}">Food is ready</button>` : ''}
        </div>
        <button class="ol-view" type="button" data-track="${esc(o.id)}">View Location</button>
      </div>`;
    }
    function accountView() {
      const today = API.orders.filter((o) => o.status !== 'cancelled');
      const sales = today.reduce((s, o) => s + o.totalAmount, 0);
      return `<div class="scroll">
        <div class="sd-head"><div class="sd-logo">${SVG.store}</div><h1>Profile</h1></div>
        <div class="sd-stats">
          <div class="sd-stat teal"><b>${today.length}</b><span>Orders</span></div>
          <div class="sd-stat gold"><b>${rs(sales)}</b><span>Volume</span></div>
          <div class="sd-stat green"><b>Open</b><span>Kitchen</span></div>
        </div>
        <div class="pad">
          <b>${esc(API.user?.name)}</b>
          <p class="muted">${esc(API.user?.phone)}</p>
          <p class="muted">${esc(shopName())}</p>
          <button class="btn ghost full" id="logout">Sign out</button>
        </div>
      </div>${nav()}`;
    }
    function bindMapChrome() {
      const root = document.getElementById('root');
      root.querySelectorAll('[data-zoom]').forEach((b) => b.onclick = () => {
        if (!state.mapHandle) return;
        if (b.dataset.zoom === 'in') state.mapHandle.zoomIn();
        else state.mapHandle.zoomOut();
      });
      const loc = root.querySelector('[data-locate]');
      if (loc) loc.onclick = () => {
        const o = API.orders.find((x) => x.id === state.trackId);
        if (state.mapHandle && o) state.mapHandle.locate(o);
      };
    }
    function render(opts) {
      const root = document.getElementById('root');
      const keep = !!(opts && opts.keepScroll);
      const sc0 = root.querySelector('.scroll');
      const y = keep && sc0 ? sc0.scrollTop : 0;
      if (keep && state.screen === 'item' && root.querySelector('[data-save-item]')) return;
      try {
      if (!API.user) {
        if (root.querySelector('[data-otp-root]')) return;
        root.innerHTML = loginView();
        OtpLogin.bind({ role: 'shop', onReady: () => render() });
        return;
      }
      if (state.trackId) {
        const o = API.orders.find((x) => x.id === state.trackId);
        if (!o || o.status === 'cancelled') { state.trackId = null; }
        else {
          const existing = root.querySelector('[data-track-root="'+state.trackId+'"]');
          const hasRider = o.riderName ? '1' : '0';
          if (existing && state.mapHandle && existing.dataset.hasRider === hasRider) {
            state.mapHandle.update(o);
            TrackUI.paint(existing, o, 'shop');
            return;
          }
          if (state.mapHandle) { try { state.mapHandle.destroy(); } catch(_){} state.mapHandle = null; }
          root.innerHTML = TrackUI.screen(o, 'shop');
          bind();
          bindMapChrome();
          const el = document.getElementById('map');
          if (el) state.mapHandle = mountTrackingMap(el, o);
          return;
        }
      }
      if (state.mapHandle) { try { state.mapHandle.destroy(); } catch(_){} state.mapHandle = null; }
      if (state.screen === 'order') root.innerHTML = orderDetailsView();
      else if (state.screen === 'item') root.innerHTML = itemEditView();
      else if (state.tab === 'menu') root.innerHTML = menuView();
      else if (state.tab === 'orders') root.innerHTML = ordersView();
      else if (state.tab === 'account') root.innerHTML = accountView();
      else root.innerHTML = dashView();
      bind();
      } finally {
        if (keep) {
          const sc = root.querySelector('.scroll');
          if (sc) sc.scrollTop = y;
        }
      }
    }
    function bind() {
      const root = document.getElementById('root');
      root.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; state.trackId = null; state.screen = ''; render(); });
      root.querySelectorAll('[data-filter]').forEach((b) => b.onclick = () => { state.filter = b.dataset.filter; render(); });
      root.querySelectorAll('[data-act]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); API.patch(b.dataset.id, { status: b.dataset.act }); });
      root.querySelectorAll('[data-toggle]').forEach((el) => el.onchange = (e) => {
        e.stopPropagation();
        API.toggleItem(el.dataset.toggle, el.checked);
      });
      root.querySelectorAll('[data-stop]').forEach((el) => el.onclick = (e) => e.stopPropagation());
      root.querySelectorAll('[data-open-order]').forEach((b) => b.onclick = () => {
        state.orderId = b.dataset.openOrder; state.screen = 'order'; render();
      });
      root.querySelectorAll('[data-close-order]').forEach((b) => b.onclick = () => { state.screen = ''; state.orderId = null; render(); });
      root.querySelectorAll('[data-add-item]').forEach((b) => b.onclick = () => {
        state.itemId = null; state.itemDraft = { category: 'Food', isAvailable: true }; state.screen = 'item'; render();
      });
      root.querySelectorAll('[data-edit-item]').forEach((b) => b.onclick = () => {
        const it = API.items.find((i) => i.id === b.dataset.editItem);
        state.itemId = it && it.id; state.itemDraft = it ? Object.assign({}, it) : { category: 'Food' }; state.screen = 'item'; render();
      });
      root.querySelectorAll('[data-close-item]').forEach((b) => b.onclick = () => { state.screen = ''; state.itemDraft = null; render(); });
      root.querySelectorAll('[data-mcat]').forEach((b) => b.onclick = () => { state.menuCat = b.dataset.mcat; render({ keepScroll: true }); });
      const mq = document.getElementById('menuQ');
      if (mq) mq.oninput = () => { state.menuQ = mq.value; render({ keepScroll: true }); const n=document.getElementById('menuQ'); if(n){ n.focus(); n.selectionStart=n.selectionEnd=n.value.length; } };
      root.querySelectorAll('[data-set-img]').forEach((b) => b.onclick = () => {
        state.itemDraft = Object.assign({}, readItemForm(), { image: b.dataset.setImg });
        render({ keepScroll: true });
      });
      const pick = root.querySelector('[data-pick-photo]');
      const file = document.getElementById('itemFile');
      if (pick && file) pick.onclick = () => file.click();
      if (file) file.onchange = () => {
        const f = file.files && file.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          let src = String(r.result || '');
          if (src.length > 180000) src = FOOD_IMGS[0];
          state.itemDraft = Object.assign({}, readItemForm(), { image: src });
          render({ keepScroll: true });
        };
        r.readAsDataURL(f);
      };
      const save = root.querySelector('[data-save-item]');
      if (save) save.onclick = async () => {
        const d = readItemForm();
        if (!d.name) { const e = root.querySelector('[data-item-err]'); if (e) e.textContent = 'Enter an item name.'; return; }
        save.disabled = true; save.textContent = 'Saving…';
        try {
          await API.saveItem(d);
          state.screen = ''; state.itemDraft = null; state.tab = 'menu';
          render();
        } catch (err) {
          const e = root.querySelector('[data-item-err]');
          if (e) e.textContent = err.message || 'Could not save item.';
          save.disabled = false; save.textContent = 'Save Item';
        }
      };
      root.querySelectorAll('[data-track]').forEach((b) => b.onclick = (e) => { e.stopPropagation(); state.screen = ''; state.trackId = b.dataset.track; render(); });
      root.querySelectorAll('[data-track-back]').forEach((b) => b.onclick = () => { state.trackId = null; render(); });
      root.querySelectorAll('[data-done]').forEach((b) => b.onclick = () => { state.trackId = null; render(); });
      const logout = document.getElementById('logout');
      if (logout) logout.onclick = () => { API.logout(); render(); };
    }
    function readItemForm() {
      const d = Object.assign({}, state.itemDraft || {});
      const name = document.getElementById('itemName');
      const price = document.getElementById('itemPrice');
      const cat = document.getElementById('itemCat');
      const desc = document.getElementById('itemDesc');
      if (name) d.name = name.value.trim();
      if (price) d.price = Number(price.value || 0);
      if (cat) d.category = cat.value;
      if (desc) d.desc = desc.value.trim();
      d.shopId = shopId();
      d.isAvailable = d.isAvailable !== false;
      if (state.itemId) d.id = state.itemId;
      return d;
    }
    if (new URLSearchParams(location.search).get('demo') === '1' && !API.user) {
      API.login('shop', '0772223333', '1234').catch(() => {});
    }
    API.on(() => {
      if (!API.user && document.querySelector('[data-otp-root]')) return;
      render({ keepScroll: true });
    });
    render();
  </script>
</body>
</html>
