<!DOCTYPE html>
<html lang="en" data-role="rider">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Uber Eats Courier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/track.css" />
</head>
<body>
  <div class="app" id="root"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/maps.js"></script>
  <script>
    const demo = new URLSearchParams(location.search).has('demo');
    const state = { tab: 'jobs', activeId: null, chat: false, mapHandle: null };
    const gps = {};
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function lkr(n) { return 'LKR ' + Math.round(Number(n)||0).toLocaleString('en-LK'); }
    function startGps(order) {
      const shop = API.shopOf(order.shopId);
      if (gps[order.id]) clearInterval(gps[order.id].timer);
      const from = [order.riderLat ?? shop.lat, order.riderLng ?? shop.lng];
      const to = [order.deliveryLat, order.deliveryLng];
      const pts = (typeof routeCurve === 'function') ? routeCurve(from, to) : [from, to];
      let i = 0;
      const tick = () => {
        i = Math.min(i + 1, pts.length - 1);
        const [lat, lng] = pts[i];
        API.patch(order.id, {
          riderLat: lat, riderLng: lng, status: 'on_the_way',
          riderId: 'RIDER_77', riderName: 'Kamal Perera', riderPhone: '0775556666',
        });
        if (i >= pts.length - 1) clearInterval(gps[order.id].timer);
      };
      gps[order.id] = { timer: setInterval(tick, 1200) };
      API.patch(order.id, {
        status: 'on_the_way', riderId: 'RIDER_77', riderName: 'Kamal Perera',
        riderPhone: '0775556666', riderLat: from[0], riderLng: from[1],
      });
    }
    function nav() {
      return `<nav class="nav" style="grid-template-columns:repeat(3,1fr)">
        <button data-tab="jobs" class="${state.tab==='jobs'?'active':''}">Jobs</button>
        <button data-tab="earn" class="${state.tab==='earn'?'active':''}">Earnings</button>
        <button data-tab="account" class="${state.tab==='account'?'active':''}">Account</button>
      </nav>`;
    }
    function loginView() {
      return `<div class="login">
        <div class="wordmark">Uber <em>Eats</em></div>
        <h1>Deliver with Uber</h1>
        <p class="sub">Go online for live jobs around Colombo</p>
        <div class="field"><label>Mobile</label><input id="phone" value="0775556666" /></div>
        <div class="field"><label>PIN</label><input id="pin" value="1234" type="password" /></div>
        <button class="btn full green" id="loginBtn">GO</button>
      </div>`;
    }
    function jobsView() {
      const jobs = API.orders.filter((o) => ['ready', 'on_the_way'].includes(o.status));
      const active = jobs.find((o) => o.id === state.activeId) || jobs.find((o) => o.status === 'on_the_way');
      const earned = API.orders.filter((o) => o.status === 'delivered').length * 150;
      return `${active ? `<div id="map" class="map"></div>` : ''}
        <div class="${active ? 'sheet' : ''}" style="${active ? '' : 'padding-top:12px'}">
          ${active ? '<div class="grab"></div>' : `<div class="ue-top"><div class="where">Online<small>${esc(API.user?.name)} · ${esc(API.user?.vehicle || '')}</small></div></div>`}
          <div class="stats">
            <div class="stat"><b>${jobs.length}</b><span>Open</span></div>
            <div class="stat"><b>${lkr(earned)}</b><span>Today</span></div>
            <div class="stat"><b>4.9★</b><span>Rating</span></div>
          </div>
          ${jobs.map((o) => `
            <div class="ticket">
              <div class="row">
                <div class="grow">
                  <b>${esc(o.shopName)} → ${esc(o.customerName)}</b>
                  <div class="muted">${esc(o.address)}</div>
                </div>
                <span class="status ${o.status}">${API.statusLabel(o.status)}</span>
              </div>
              <div class="row" style="margin-top:10px">
                <div class="price grow">You earn LKR 150</div>
                ${o.status==='ready' ? `<button class="btn sm green" data-pick="${esc(o.id)}">Accept</button>` : ''}
                ${o.status==='on_the_way' ? `
                  <button class="btn sm ghost" data-chat="${esc(o.id)}">Chat</button>
                  <button class="btn sm" data-drop="${esc(o.id)}">Complete</button>` : ''}
              </div>
            </div>`).join('') || '<div class="pad muted">No trips yet. In Manager, accept an order and tap Food is ready.</div>'}
        </div>
        ${nav()}`;
    }
    function earnView() {
      const done = API.orders.filter((o) => o.status === 'delivered');
      return `<div class="ue-top"><div class="where">Earnings</div></div>
        <div class="banner" style="height:120px">
          <div class="copy"><b>${lkr(done.length * 150)}</b><span>${done.length} completed trips</span></div>
        </div>
        ${done.map((o) => `<div class="ticket"><div class="row"><div class="grow"><b>${esc(o.id)}</b><div class="muted">${esc(o.shopName)}</div></div><b>+ LKR 150</b></div></div>`).join('') || '<div class="pad muted">Complete a trip to see earnings.</div>'}
        ${nav()}`;
    }
    function accountView() {
      return `<div class="ue-top"><div class="where">Courier</div></div>
        <div class="pad">
          <div class="courier"><img src="/img/courier.jpg" alt="" /><div class="grow"><b>${esc(API.user?.name)}</b><div class="muted">${esc(API.user?.phone)} · 4.9 ★</div></div></div>
          <p class="muted">${esc(API.user?.vehicle)}</p>
          <button class="btn ghost full" id="logout">Sign out</button>
        </div>${nav()}`;
    }
    function chatView() {
      const o = API.orders.find((x) => x.id === state.activeId);
      const msgs = API.messages[state.activeId] || [];
      return `<div class="ue-top"><button class="back" style="position:static" id="backJobs">←</button><b style="margin-left:8px">${esc(o?.customerName || '')}</b></div>
        <div class="chat" style="flex:1;min-height:0">
          <div class="bubbles" id="bubbles">
            ${msgs.map((m) => `<div class="bubble ${m.role==='rider'?'me':m.role==='system'?'sys':'them'}">${esc(m.text)}</div>`).join('')}
          </div>
          <form class="composer" id="chatForm">
            <input name="text" placeholder="Message the customer…" autocomplete="off" />
            <button class="btn sm" type="submit">Send</button>
          </form>
        </div>`;
    }
    function render(force) {
      const root = document.getElementById('root');
      if (!API.user) { root.innerHTML = loginView(); bind(); return; }
      if (state.chat) { root.innerHTML = chatView(); const b=document.getElementById('bubbles'); if(b) b.scrollTop=b.scrollHeight; bind(); return; }
      if (state.tab === 'earn') { if (state.mapHandle) { try{state.mapHandle.destroy();}catch(_){} state.mapHandle=null; } root.innerHTML = earnView(); bind(); return; }
      if (state.tab === 'account') { if (state.mapHandle) { try{state.mapHandle.destroy();}catch(_){} state.mapHandle=null; } root.innerHTML = accountView(); bind(); return; }
      const jobs = API.orders.filter((o) => ['ready', 'on_the_way'].includes(o.status));
      const active = jobs.find((o) => o.id === state.activeId) || jobs.find((o) => o.status === 'on_the_way');
      const key = jobs.map((o) => o.id + ':' + o.status).join('|');
      if (!force && root.dataset.key === key && state.mapHandle && active && !state.chat) {
        state.mapHandle.update(active); return;
      }
      if (state.mapHandle) { try { state.mapHandle.destroy(); } catch(_){} state.mapHandle = null; }
      root.dataset.key = key;
      root.innerHTML = jobsView();
      bind();
      const el = document.getElementById('map');
      if (el && active) state.mapHandle = mountTrackingMap(el, active);
    }
    function bind() {
      const root = document.getElementById('root');
      const loginBtn = document.getElementById('loginBtn');
      if (loginBtn) loginBtn.onclick = async () => {
        try { await API.login('rider', document.getElementById('phone').value, document.getElementById('pin').value); render(true); }
        catch (e) { alert(e.message); }
      };
      root.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; state.chat = false; render(true); });
      root.querySelectorAll('[data-pick]').forEach((b) => b.onclick = () => {
        const o = API.orders.find((x) => x.id === b.dataset.pick);
        state.activeId = o.id; startGps(o);
      });
      root.querySelectorAll('[data-drop]').forEach((b) => b.onclick = () => {
        const id = b.dataset.drop;
        if (gps[id]) clearInterval(gps[id].timer);
        API.patch(id, { status: 'delivered' });
      });
      root.querySelectorAll('[data-chat]').forEach((b) => b.onclick = () => { state.activeId = b.dataset.chat; state.chat = true; render(true); });
      const back = document.getElementById('backJobs');
      if (back) back.onclick = () => { state.chat = false; state.tab = 'jobs'; render(true); };
      const form = document.getElementById('chatForm');
      if (form) form.onsubmit = async (e) => {
        e.preventDefault();
        const text = form.text.value.trim();
        if (!text) return;
        form.text.value = '';
        await API.sendMessage(state.activeId, API.user.name, 'rider', text);
      };
      const logout = document.getElementById('logout');
      if (logout) logout.onclick = () => { API.user = null; sessionStorage.removeItem('sd_user_rider'); render(true); };
    }
    API.on(() => {
      if (demo && !API.user && API.shops.length) { API.login('rider', '0775556666', '1234'); return; }
      render();
    });
  </script>
</body>
</html>
