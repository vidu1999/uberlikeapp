    function esc(s) {

    function shopPos(o) {

      const lng = Number(shop && shop.lng);
      if (Number.isFinite(lat) && Number.isFinite(lng)) return [lat, lng];
      const slat = Number(o && o.shopLat);
      const slng = Number(o && o.shopLng);
      const dLat = Number(o && o.deliveryLat);
      const dLng = Number(o && o.deliveryLng);
      if (Number.isFinite(slat) && Number.isFinite(slng)) {
        if (Number.isFinite(dLat) && Math.abs(slat - dLat) < 1e-5 && Math.abs(slng - dLng) < 1e-5) return null;
        return [slat, slng];
      }
      return null;
    }
    function metersTo(lat, lng, to) {
      if (lat == null || lng == null || !to) return Infinity;
      const km = typeof haversineKm === 'function' ? haversineKm([lat, lng], to) : 99;
      return km * 1000;
    }
    const CLOSE_M = 25;
    function closeToShop(o) {
      return metersTo(state.liveLat ?? o.riderLat, state.liveLng ?? o.riderLng, shopPos(o)) < CLOSE_M;
    }

      const m = metersTo(hereLat, hereLng, to);
      const where = kind === 'shop' ? 'the shop' : 'the customer';

      const to = headingToShop(o) ? shopPos(o) : [Number(o.deliveryLat), Number(o.deliveryLng)];
      if (!from || !to || from[0] == null || to[0] == null) return 2.4;

        const avg = rated.reduce((s, o) => s + Number(o.ratings.rider), 0) / rated.length;
        return '★ ' + avg.toFixed(1) + ' (' + rated.length + ')';
      }
      const n = done().length;
      const r = Number(me().rating);
      if (Number.isFinite(r) && r > 0 && n) return '★ ' + r.toFixed(1) + ' (' + n + ')';
      if (n) return n + ' deliveries';
      return 'New rider';

    function stopLiveGps() {

    function startLiveGps(orderId) {

        if (API.setViewOrigin) API.setViewOrigin(lat, lng);
        if (!orderId) return;
        const o = (API.orders || []).find((x) => x.id === orderId);
        if (!o || o.status === 'delivered' || o.status === 'cancelled') return;
        API.patch(orderId, { riderLat: lat, riderLng: lng });

        const live = ongoing().find((o) => liveJob(o) && o.status !== 'delivered');
        if (live) API.patch(live.id, { riderLat: state.liveLat, riderLng: state.liveLng });
      };
      if (!gpsStarted) {
        gpsStarted = true;
        navigator.geolocation.getCurrentPosition(onPos, () => {}, opt);
      }
      if (gpsWatch != null) return;
      gpsWatch = navigator.geolocation.watchPosition(onPos, () => {}, opt);

    function bindChatKeyboard() {

        const vv = window.visualViewport;
        if (!vv) return;
        const kb = Math.max(0, (window.innerHeight || document.documentElement.clientHeight) - vv.height - (vv.offsetTop || 0));
        document.documentElement.style.setProperty('--kb', kb + 'px');
        const b = document.getElementById('bubbles');
        if (b) b.scrollTop = b.scrollHeight;
      };
      if (!bindChatKeyboard._on) {
        bindChatKeyboard._on = true;
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', apply);
          window.visualViewport.addEventListener('scroll', apply);
        }
        window.addEventListener('focusin', apply);
        window.addEventListener('focusout', () => {
          setTimeout(() => document.documentElement.style.setProperty('--kb', '0px'), 60);
        });
      }
      apply();
    }

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
        const name = (API.shopTitle && API.shopTitle(s)) || s.name || 'Shop';
        byId[s.id] = { id: s.id, name: name, lat: lat, lng: lng };
      });
      return byId;
    }

      return { id: o.shopId, name: o.shopName || 'Shop', lat: pos[0], lng: pos[1] };

          if (raw) p = Object.assign({}, JSON.parse(raw), p);

      const name = String((p && p.name) || '').trim();
      return !!(name && !/^(rider|guest|user)$/i.test(name));

    async function afterRiderOtp(out) {
      const phone = (out && out.phone) || state.loginId || state.reg.phone;
      const needRider = API.isRiderRegistered && !API.isRiderRegistered();
      if (out && out.needsRegister && !pendingRiderFilled()) {
        state.auth = 'register';
        state.fromReg = true;
        if (phone) state.reg.phone = phone;
        render(true);
        return;
      }
      if (pendingRiderFilled() && needRider) {

          state.fromReg = true;
          if (phone) state.reg.phone = phone;
          render(true);
          const err = document.querySelector('[data-err]');

          if (wdAmt.value !== n) wdAmt.value = n;
        };
      }
      root.querySelectorAll('[data-wd-chip]').forEach((b) => {
        b.onclick = () => {
          if (wdAmt) wdAmt.value = String(b.getAttribute('data-wd-chip') || '').replace(/[^\d]/g, '');
          wdAmt && wdAmt.focus();
        };
      });
      const applyWd = root.querySelector('[data-apply-wd]');
      if (applyWd) applyWd.onclick = async () => {
        const err = root.querySelector('[data-wd-err]');
        if (err) err.textContent = '';
        applyWd.disabled = true;
        try {
          const amt = ((document.getElementById('wdAmt') || {}).value || '').replace(/[^\d]/g, '');
          await API.applyWithdraw(amt, grossEarn());
          state.wdOpen = false;
          render(true);
        } catch (e) {
          if (err) err.textContent = (e && e.message) || 'Could not apply';
          applyWd.disabled = false;
        }
      };
      function collectDocs() {
        const nicEl = document.getElementById('docNic');
        const licEl = document.getElementById('docLic');
        const plateEl = document.getElementById('vehPlate');
        const typeEl = document.getElementById('vehType');
        const regEl = document.getElementById('vehReg');
        const out = {};
        if (nicEl) out.nic = nicEl.value;
        if (licEl) out.licenseId = licEl.value;
        if (plateEl) out.plate = plateEl.value;
        if (typeEl) out.vehicleType = typeEl.value;
        if (regEl) out.registered = !!regEl.checked;
        return out;
      }
      const plateLive = document.getElementById('vehPlate');
      const typeLive = document.getElementById('vehType');
      const regLive = document.getElementById('vehReg');
      if (plateLive) {
        plateLive.oninput = () => { state.vehDraft.plate = plateLive.value; };
        plateLive.onfocus = () => { state.vehDraft.plate = plateLive.value; };
      }
      if (typeLive) typeLive.onchange = () => { state.vehDraft.type = typeLive.value; };
      if (regLive) regLive.onchange = () => { state.vehDraft.registered = !!regLive.checked; };
      root.querySelectorAll('[data-doc-file]').forEach((inp) => {
        inp.onclick = () => { try { inp.value = ''; } catch (_) {} };
        inp.onchange = async () => {
          const file = inp.files && inp.files[0];
          if (!file) return;
          if (!API.storeImage) {
            const err0 = root.querySelector('[data-err]');
            if (err0) err0.textContent = 'Could not upload this photo.';
            return;
          }
          const kind = inp.getAttribute('data-doc-file');
          const err = root.querySelector('[data-err]');
          const box = inp.closest('.rd-up');
          if (kind === 'nic' || kind === 'nicBack' || kind === 'license' || kind === 'licenseBack' || kind === 'face') {
            if (err) err.textContent = 'NIC, licence, and selfie stay on Didit. Tap Verify live with Didit.';
            return;
          }
          if (docFiles[kind] !== undefined) docFiles[kind] = file;
          if (box) box.classList.add('busy', 'has');
          try {
            const preview = URL.createObjectURL(file);
            if (box) {
              let img = box.querySelector('img');
              if (!img) {
                img = document.createElement('img');
                img.alt = '';
                box.appendChild(img);
              }
              img.src = preview;
              const sp = box.querySelector('span');
              if (sp) sp.remove();
              if (!box.querySelector('.rd-up-change')) {
                const em = document.createElement('em');
                em.className = 'rd-up-change';
                em.textContent = 'Change';
                box.appendChild(em);
              }
            }
          } catch (_) {}
          if (err) err.textContent = 'Saving this photo…';
          try {
            const url = await API.storeImage(file, 'rider' + kind);
            const fields = collectDocs();
            if (kind === 'reg') fields.regPhoto = url;
            await API.saveRiderDocs(fields);
            if (err) err.textContent = '';
            if (box) box.classList.remove('busy');
            render(true);
          } catch (e) {
            if (box) box.classList.remove('busy');
            if (err) err.textContent = (e && e.message) || 'Could not upload. Try another photo.';
          }
        };
      });
      async function saveVerify(btn) {
        const err = root.querySelector('[data-err]');
        if (err) err.textContent = '';
        if (btn) btn.disabled = true;
        try {
          const fields = collectDocs();
          if (!fields.plate) throw new Error('Enter your vehicle number.');
          if (!fields.registered) throw new Error('Tick This vehicle is registered.');
          await API.saveRiderDocs(fields);
          const after = riderDocs();
          if (after.nicKyc !== 'approved' || after.licenseKyc !== 'approved' || after.livenessKyc !== 'approved') {
            throw new Error('Tap Verify live with Didit and finish NIC, licence, and selfie.');
          }
          state.vehDraft = { type: '', plate: null, registered: null };
          state.needDocs = !riderVerified();
          state.screen = '';
          state.tab = 'profile';
          render(true);
        } catch (e) {
          if (err) err.textContent = (e && e.message) || 'Could not save';
          if (btn) btn.disabled = false;
        }
      }
      const saveDocs = root.querySelector('[data-save-docs]');
      if (saveDocs) saveDocs.onclick = () => saveVerify(saveDocs);
      const saveVerifyBtn = root.querySelector('[data-save-verify]');
      if (saveVerifyBtn) saveVerifyBtn.onclick = () => saveVerify(saveVerifyBtn);
      const diditBtn = root.querySelector('[data-didit-kyc]');
      if (diditBtn) diditBtn.onclick = async () => {
        const err = root.querySelector('[data-err]');
        if (err) err.textContent = '';
        diditBtn.disabled = true;
        try {
          if (!API.user || !API.user.id) throw new Error('Sign in first.');
          if (err) err.textContent = 'Opening Didit…';
          const out = await API.startRiderKyc();
          if (out.sessionId) {
            try { sessionStorage.setItem('qb_didit_session', out.sessionId); } catch (_) {}
            try { localStorage.setItem('qb_didit_session', out.sessionId); } catch (_) {}
          }
          if (!out.url) throw new Error('Could not open the ID check.');
          window.location.href = out.url;
        } catch (e) {
          if (err) err.textContent = (e && e.message) || 'Could not open Didit.';
          diditBtn.disabled = false;
        }
      };
      const saveVeh = root.querySelector('[data-save-vehicle]');
      if (saveVeh) saveVeh.onclick = async () => {
        const err = root.querySelector('[data-err]');
        if (err) err.textContent = '';
        saveVeh.disabled = true;
        try {
          const fields = collectDocs();
          if (!fields.plate) throw new Error('Enter your vehicle number.');
          if (!fields.registered) throw new Error('Confirm this vehicle is registered.');
          await API.saveRiderDocs(fields);
          state.vehDraft = { type: '', plate: null, registered: null };
          state.needDocs = !riderVerified();
          state.screen = riderVerified() ? '' : 'docs';
          state.tab = 'profile';
          render(true);
        } catch (e) {
          if (err) err.textContent = (e && e.message) || 'Could not save';
          saveVeh.disabled = false;
        }
      };
      const saveProf = root.querySelector('[data-save-profile]');
      if (saveProf) saveProf.onclick = async () => {
        const name = ((document.getElementById('editName') || {}).value || '').trim();
        const email = ((document.getElementById('editEmail') || {}).value || '').trim();
        const perr = root.querySelector('[data-err]');
        if (perr) perr.textContent = '';
        if (!name) { if (perr) perr.textContent = 'Enter your name.'; return; }
        saveProf.disabled = true;
        try {
          if (API.saveProfile) await API.saveProfile({ name, email });
          else if (API.user) API.user.name = name;
          state.screen = '';
          state.tab = 'profile';
          render(true);
        } catch (e) {
          if (perr) perr.textContent = e.message || 'Could not save';
          saveProf.disabled = false;
        }
      };
    }

    function render(force, opts) {
      const root = document.getElementById('root');
      const keep = !force && !!(opts && opts.keepScroll);
      const sc0 = root.querySelector('.scroll');
      const y = keep && sc0 ? sc0.scrollTop : 0;
      try {
        if (state.auth === 'otp') {
          if (keep && root.querySelector('[data-otp-root]')) return;
          bindRiderOtp();
          return;
        }
        if (!API.user) {
          if (keep && root.querySelector('[data-rider-auth], [data-otp-root]')) return;
          killMap();
          if (state.auth === 'splash') { root.innerHTML = splash(); return; }
          if (state.auth === 'register') { root.innerHTML = registerView(); bindAuth(); return; }
          if (state.auth === 'download') { root.innerHTML = downloadView(); bindAuth(); return; }
          root.innerHTML = loginView();
          bindAuth();
          return;
        }
        if (API.isRiderRegistered && !API.isRiderRegistered()) {
          if (API.user && API.user.name && !state.reg.name) state.reg.name = API.user.name;
          if (API.user && API.user.email && !state.reg.email) state.reg.email = API.user.email;
          killMap();
          root.innerHTML = registerView();
          bindAuth();
          return;
        }
        startRiderGps();
        if (keep) {
          const ae = document.activeElement;
          if (ae && root.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
        }
        if (state.screen === 'chat' && state.orderId) {
          const oChat = (API.orders || []).find((x) => x.id === state.orderId);
          if (!oChat || oChat.status === 'cancelled' || (API.canChat && !API.canChat(oChat, 'rider'))) {
            state.screen = (oChat && liveJob(oChat)) ? 'live' : 'details';
          } else {
          const keep = root.querySelector('[data-chat-root="' + state.orderId + '"]');
          const typing = document.activeElement && document.activeElement.closest('[data-chat-root]');
          const lane = (API.chatLane && API.chatLane(oChat)) || '';
          if (keep && keep.getAttribute('data-lane') === lane && (!force || typing)) {
            paintRiderChat(keep);
            return;
          }
          killMap();
          if (API.markChatRead) API.markChatRead(state.orderId, 'rider');
          root.innerHTML = chatView();
          bind();
          bindChatKeyboard();
          const b = document.getElementById('bubbles');
          if (b) b.scrollTop = b.scrollHeight;
          const input = document.querySelector('#chatForm input[name="text"]');
          if (input) setTimeout(() => input.focus(), 50);
          return;
          }
        }
        if (state.screen === 'live' && state.orderId) {
          const o = (API.orders || []).find((x) => x.id === state.orderId);
          if (o && o.status === 'delivered') {
            killMap();
            state.screen = 'delivered';
          } else if (o) {
            const existing = root.querySelector('[data-track-root="'+state.orderId+'"]');
            if (!force && existing && state.mapHandle) {
              state.mapHandle.update(o);
              TrackUI.paint(existing, o, 'rider');
              ensureDeliverSheet();
              return;
            }
            killMap();
            root.innerHTML = liveView();
            bind();
            bindDeliverPin();
            bindMapChrome(o);
            const el = document.getElementById('map');
            if (el) state.mapHandle = mountTrackingMap(el, o);
            if (state.mapHandle && state.mapHandle.followTo) state.mapHandle.followTo(o);
            return;
          }
        }
        if (state.tab === 'map' && !state.screen) {
          const shops = overviewShops();
          const hot = mapDots();
          const existing = root.querySelector('[data-rider-map]');
          if (!force && existing && state.mapHandle && state.mapHandle.update) {
            state.mapHandle.update({ lat: state.liveLat, lng: state.liveLng, shops: shops, hot: hot });
            paintMapNote();
            return;
          }
          killMap();
          root.innerHTML = mapIdleView();
          bind();
          const el = document.getElementById('map');
          if (el && typeof mountRiderOverviewMap === 'function') {
            state.mapHandle = mountRiderOverviewMap(el, {
              lat: state.liveLat,
              lng: state.liveLng,
              shops: shops,
              hot: hot,
              onShop: openShopFromMap,
            });
          }
          return;
        }
        killMap();
        if (state.screen === 'details') root.innerHTML = detailsView();
        else if (state.screen === 'delivered') root.innerHTML = deliveredView();
        else if (state.screen === 'wallet') root.innerHTML = walletView();
        else if (state.screen === 'bank') root.innerHTML = bankView();
        else if (state.screen === 'docs') root.innerHTML = docsView();
        else if (state.screen === 'vehicle') root.innerHTML = vehicleView();
        else if (state.screen === 'help') root.innerHTML = helpView();
        else if (state.screen === 'edit') root.innerHTML = editView();
        else if (state.tab === 'orders') root.innerHTML = ordersView();
        else if (state.tab === 'earn') root.innerHTML = earnView();
        else if (state.tab === 'profile') root.innerHTML = profileView();
        else root.innerHTML = homeView();
        bind();
      } finally {
        if (API.user) mountWa();
        if (keep) {
          const sc = root.querySelector('.scroll');
          if (sc) sc.scrollTop = y;
        }
      }
    }

    if (API.user) {
      goRiderHome();
    } else if (API.verifiedPhone && API.verifiedPhone('rider')) {
      state.auth = 'register';
      state.reg.phone = API.verifiedPhone('rider');
      state.fromReg = true;
    } else {
      setTimeout(() => {
        if (!API.user && state.auth === 'splash') { state.auth = 'login'; render(true); }
      }, 1600);
    }
    API.on(() => {
      if (state.auth === 'otp') return;
      if (state.wa && state.wa.open) return;
      if (!API.user && document.querySelector('[data-otp-root], [data-rider-auth]')) return;
      render(false, { keepScroll: true });
    });
    async function consumeGoogleRedirect() {
      try {
        if (!API.resumeGoogle) return false;
        const u = await API.resumeGoogle();
        if (!u) return false;
        if (API.isRiderRegistered && !API.isRiderRegistered()) {
          goRiderRegister();
          return true;
        }
        goRiderHome();
        startRiderGps();
        render(true);
        return true;
      } catch (e) {
        state.auth = 'login';
        render(true);
        const err = document.querySelector('[data-err]');
        if (err) err.textContent = e.message || 'Google sign-in failed';
        return true;
      }
    }
    async function applyDiditDecision(out) {
      if (!out || !API.saveRiderDocs) return out;
      const fields = {};
      if (out.nic) fields.nic = out.nic;
      if (out.licenseId) fields.licenseId = out.licenseId;
      if (out.name) {
        fields.nicName = out.name;
        fields.licenseName = out.name;
      }
      if (out.approved || String(out.status || '') === 'Approved') {
        fields.nicKyc = 'approved';
        fields.licenseKyc = 'approved';
        fields.livenessKyc = 'approved';
      } else {
        if (out.nicKyc) fields.nicKyc = out.nicKyc;
        if (out.licenseKyc) fields.licenseKyc = out.licenseKyc;
        if (out.livenessKyc) fields.livenessKyc = out.livenessKyc;
      }
      if (out.sessionId) fields.kycSession = out.sessionId;
      if ((out.approved || String(out.status || '') === 'Approved') && out.facePhoto && API.storeRiderAvatar) {
        try {
          const av = await API.storeRiderAvatar(out.facePhoto);
          if (av) fields.avatar = av;
        } catch (_) {
          if (/^https?:\/\//i.test(String(out.facePhoto || ''))) fields.avatar = out.facePhoto;
        }
      }
      if (Object.keys(fields).length) await API.saveRiderDocs(fields);
      return out;
    }
    async function consumeDiditReturn() {
      let sid = '';
      let fromDidit = false;
      try {
        const q = new URLSearchParams(location.search || '');
        sid = q.get('verificationSessionId') || q.get('session_id') || q.get('id') || '';
        fromDidit = q.get('didit') === 'done' || !!(q.get('verificationSessionId') || q.get('session_id') || q.get('status'));
        if (!fromDidit) return false;
        if (!sid) sid = sessionStorage.getItem('qb_didit_session') || localStorage.getItem('qb_didit_session') || '';
      } catch (_) { return false; }
      if (!API.user) return false;
      goRiderHome();
      try {
        if (API.riderKycDecision && sid) {
          let out = null;
          for (let i = 0; i < 10; i++) {
            try { out = await API.riderKycDecision(sid); } catch (_) { out = null; }
            if (out && (out.approved || /Approved|Declined|Expired/.test(String(out.status || '')))) break;
            await new Promise(function (ok) { setTimeout(ok, 1200); });
          }
          if (out) await applyDiditDecision(out);
        }
      } catch (_) {}
      try {
        sessionStorage.removeItem('qb_didit_session');
        localStorage.removeItem('qb_didit_session');
      } catch (_) {}
      try {
        if (location.search && /didit=|session_id=|verificationSessionId=|status=/.test(location.search)) {
          history.replaceState({}, '', location.pathname);
        }
      } catch (_) {}
      goRiderHome();
      return false;
    }
    consumeGoogleRedirect().then(async (ok) => {
      if (!ok) await consumeDiditReturn();
      if (!ok) render();
    });
  </script>
</body>
</html>
