<!DOCTYPE html>
<html lang="en" data-role="rider">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>On Delivery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/ui.css" />
  <link rel="stylesheet" href="/css/track.css" />
</head>
<body>
  <div class="app" id="root"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/maps.js"></script>
  <script src="/js/track-ui.js"></script>
  <script src="/js/otp-login.js"></script>
  <script>
    const state = { tab: 'jobs', activeId: null, chat: false, mapHandle: null };
    const gps = {};
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function rs(n) { return 'Rs. ' + Math.round(Number(n)||0).toLocaleString('en-LK'); }
    function oid(id) { return '#' + String(id||'').replace('_','-'); }
    function startGps(order) {
      const shop = API.shopOf(order.shopId);
      if (gps[order.id]) clearInterval(gps[order.id].timer);
      const from = [order.riderLat ?? shop.lat, order.riderLng ?? shop.lng];
      const to = [order.deliveryLat, order.deliveryLng];
      const pts = (typeof routeCurve === 'function') ? routeCurve(from, to) : [from, to];
      let i = 0;
      const tick = () => {
        i = Math.min(i + 1, pts.length - 1);
        const [lat, lng] = pts[i];
        API.patch(order.id, {
          riderLat: lat, riderLng: lng, status: 'on_the_way',
          riderId: 'RIDER_77', riderName: 'Kamal Perera', riderPhone: '0775556666',
        });
        if (i >= pts.length - 1) clearInterval(gps[order.id].timer);
      };
      gps[order.id] = { timer: setInterval(tick, 1200) };
      API.patch(order.id, {
        status: 'on_the_way', riderId: 'RIDER_77', riderName: 'Kamal Perera',
        riderPhone: '0775556666', riderLat: from[0], riderLng: from[1],
      });
    }
    const SVG = {
      jobs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7" cy="17" r="3"/><circle cx="17" cy="17" r="3"/><path d="M7 17 11 8h5l4 9"/></svg>',
      earn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 10h4.5a2 2 0 1 1 0 4H9"/></svg>',
      profile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3"/><path d="M5 20c1.5-4 12.5-4 14 0"/></svg>',
    };
    function nav() {
      const t = state.tab;
      return `<nav class="bnav">
        <button data-tab="jobs" class="${t==='jobs'?'on':''}">${SVG.jobs}Jobs</button>
        <button data-tab="earn" class="${t==='earn'?'on':''}">${SVG.earn}Earnings</button>
        <button data-tab="account" class="${t==='account'?'on':''}">${SVG.profile}Profile</button>
      </nav>`;
    }
    function loginView() {
      return OtpLogin.render({
        role: 'rider',
        title: 'Deliver sign in',
        sub: 'We’ll send a 4-digit code on WhatsApp, then you go online.',
        phone: '0775556666',
      });
    }
    function activeJob() {
      const jobs = API.orders.filter((o) => o.status === 'on_the_way');
      return jobs.find((o) => o.id === state.activeId) || jobs[0] || null;
    }
    function jobsListView() {
      const jobs = API.orders.filter((o) => o.status === 'ready');
      const earned = API.orders.filter((o) => o.status === 'delivered').length * 150;
      return `<div class="scroll">
        <div class="rd-top" style="position:static;background:transparent;padding-bottom:8px">
          <div>
            <h1>On Delivery</h1>
            <small>${esc(API.user?.name)} · Online</small>
          </div>
          <span class="online-pill"><i></i> Online</span>
        </div>
        <div class="sd-stats">
          <div class="sd-stat teal"><b>${jobs.length}</b><span>Open</span></div>
          <div class="sd-stat gold"><b>${rs(earned)}</b><span>Today</span></div>
          <div class="sd-stat green"><b>4.9★</b><span>Rating</span></div>
        </div>
        <div class="rd-jobs">
        ${jobs.map((o) => `
          <div class="rd-job">
            <b>${esc(o.shopName)} → ${esc(o.customerName)}</b>
            <div class="sub">${esc(o.address)} · ${esc(oid(o.id))}</div>
            <div class="row">
              <div class="grow price">You earn Rs. 150</div>
              <button class="btn sm green" data-pick="${esc(o.id)}">Accept</button>
            </div>
          </div>`).join('') || '<div class="muted">No trips yet. In Shop, accept an order and tap Food is ready.</div>'}
        </div>
      </div>${nav()}`;
    }
    function earnView() {
      const done = API.orders.filter((o) => o.status === 'delivered');
      return `<div class="scroll">
        <div class="rd-top" style="position:static;background:transparent;padding-bottom:8px"><h1>Earnings</h1></div>
        <div class="pad">
          <div class="sd-stat green" style="min-height:auto;margin-bottom:12px"><b>${rs(done.length * 150)}</b><span>${done.length} completed trips</span></div>
          ${done.map((o) => `<div class="rd-job"><div class="row"><div class="grow"><b>${esc(oid(o.id))}</b><div class="sub">${esc(o.shopName)}</div></div><b>+ Rs. 150</b></div></div>`).join('') || '<div class="muted">Complete a trip to see earnings.</div>'}
        </div>
      </div>${nav()}`;
    }
    function accountView() {
      return `<div class="scroll">
        <div class="rd-top" style="position:static;background:transparent;padding-bottom:8px"><h1>Profile</h1></div>
        <div class="pad">
          <div class="rd-who">
            <img src="/img/avatar-rider.jpg" alt="" />
            <div class="grow">
              <b>${esc(API.user?.name)}</b>
              <div class="role">${esc(API.user?.phone)} · Delivery Partner</div>
              <div class="rate"><span class="star">★</span> 4.9 (120+)</div>
            </div>
          </div>
          <p class="muted" style="margin-top:16px">${esc(API.user?.vehicle)}</p>
          <button class="btn ghost full" id="logout">Sign out</button>
        </div>
      </div>${nav()}`;
    }
    function chatView() {
      const o = API.orders.find((x) => x.id === state.activeId);
      const msgs = API.messages[state.activeId] || [];
      return `<div class="back-row"><button class="back-fab" id="backJobs">←</button><b>${esc(o?.customerName || '')}</b></div>
        <div class="chat" style="flex:1;min-height:0">
          <div class="bubbles" id="bubbles">
            ${msgs.map((m) => `<div class="bubble ${m.role==='rider'?'me':m.role==='system'?'sys':'them'}">${esc(m.text)}</div>`).join('')}
          </div>
          <form class="composer" id="chatForm">
            <input name="text" placeholder="Message the customer…" autocomplete="off" />
            <button class="btn sm green" type="submit">Send</button>
          </form>
        </div>`;
    }
    function bindMapChrome(order) {
      const root = document.getElementById('root');
      root.querySelectorAll('[data-zoom]').forEach((b) => b.onclick = () => {
        if (!state.mapHandle) return;
        if (b.dataset.zoom === 'in') state.mapHandle.zoomIn();
        else state.mapHandle.zoomOut();
      });
      const loc = root.querySelector('[data-locate]');
      if (loc) loc.onclick = () => { if (state.mapHandle && order) state.mapHandle.locate(order); };
    }
    function render(force) {
      const root = document.getElementById('root');
      if (!API.user) {
        if (root.querySelector('[data-otp-root]')) return;
        root.innerHTML = loginView();
        OtpLogin.bind({ role: 'rider', onReady: () => render(true) });
        return;
      }
      const active = activeJob();
      if (active) state.activeId = active.id;
      if (state.chat) { root.innerHTML = chatView(); const b=document.getElementById('bubbles'); if(b) b.scrollTop=b.scrollHeight; bind(); return; }
      if (active && state.tab === 'jobs') {
        const existing = root.querySelector('[data-track-root="'+active.id+'"]');
        if (!force && existing && state.mapHandle) {
          state.mapHandle.update(active);
          TrackUI.paint(existing, active, 'rider');
          return;
        }
        if (state.mapHandle) { try { state.mapHandle.destroy(); } catch(_){} state.mapHandle = null; }
        root.innerHTML = TrackUI.screen(active, 'rider', { back: 'data-stay' });
        bind();
        bindMapChrome(active);
        const el = document.getElementById('map');
        if (el) state.mapHandle = mountTrackingMap(el, active);
        return;
      }
      if (state.mapHandle) { try { state.mapHandle.destroy(); } catch(_){} state.mapHandle = null; }
      if (state.tab === 'earn') { root.innerHTML = earnView(); bind(); return; }
      if (state.tab === 'account') { root.innerHTML = accountView(); bind(); return; }
      root.innerHTML = jobsListView();
      bind();
    }
    function bind() {
      const root = document.getElementById('root');
      root.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { state.tab = b.dataset.tab; state.chat = false; render(true); });
      root.querySelectorAll('[data-pick]').forEach((b) => b.onclick = () => {
        const o = API.orders.find((x) => x.id === b.dataset.pick);
        state.activeId = o.id;
        state.tab = 'jobs';
        startGps(o);
      });
      root.querySelectorAll('[data-drop]').forEach((b) => b.onclick = () => {
        const id = b.dataset.drop;
        if (gps[id]) clearInterval(gps[id].timer);
        state.activeId = null;
        API.patch(id, { status: 'delivered' });
      });
      root.querySelectorAll('[data-chat]').forEach((b) => b.onclick = () => { state.activeId = b.dataset.chat; state.chat = true; render(true); });
      root.querySelectorAll('[data-stay]').forEach((b) => b.onclick = () => { state.tab = 'jobs'; state.chat = false; render(true); });
      const back = document.getElementById('backJobs');
      if (back) back.onclick = () => { state.chat = false; state.tab = 'jobs'; render(true); };
      const form = document.getElementById('chatForm');
      if (form) form.onsubmit = async (e) => {
        e.preventDefault();
        const text = form.text.value.trim();
        if (!text) return;
        form.text.value = '';
        await API.sendMessage(state.activeId, API.user.name, 'rider', text);
      };
      const logout = document.getElementById('logout');
      if (logout) logout.onclick = () => { API.user = null; sessionStorage.removeItem('sd_user_rider'); render(true); };
    }
    API.on(() => {
      if (!API.user && document.querySelector('[data-otp-root]')) return;
      render();
    });
  </script>
</body>
</html>
