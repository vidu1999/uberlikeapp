name: Seed Supabase
on:
  workflow_dispatch:
  push:
    branches: [arena/72bd113d-uberlikeapp, main]
    paths:
      - server/schema.sql
      - server/seed.js
      - server/db.js
      - server/push-seed.js
      - .github/workflows/supabase.yml

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Upsert demo rows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY$SUPABASE_ANON_KEY" ]; then
            echo "Add repo secrets SUPABASE_URL and SUPABASE_KEY (anon or service_role), then run schema.sql once."
            exit 0
          fi
          node server/push-seed.js
