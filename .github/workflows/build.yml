name: Build APKs
on:
  push:
    branches: [arena/72bd113d-uberlikeapp]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Create Android platform
        run: flutter create --platforms=android --org com.uberlike --project-name uberlikeapp .
      - name: Snapshot android folder
        run: cp -a android android.bak
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          for ROLE in user shop rider; do
            python3 .github/scripts/patch_android.py "$ROLE"
            flutter build apk --release --target="lib/main_${ROLE}.dart" 2>&1 | tee "${ROLE}-build.log"
            cp build/app/outputs/flutter-apk/app-release.apk "dist/${ROLE}.apk"
          done
          ls -lh dist
      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: swiftdrop-apks
          path: dist/*.apk
      - name: Annotate failure
        if: failure()
        run: |
          for f in *-build.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -n 100 "$f"
            echo "::endgroup::"
            grep -E "Error:|FAILURE|error •|Unhandled|Gradle task|Bad state|compilation" "$f" | tail -n 40 | while read -r line; do
              echo "::error::$line"
            done
          done
