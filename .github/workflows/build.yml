name: Build APKs
on:
  push:
    branches: [arena/72bd113d-uberlikeapp]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'android/**'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Android SDK packages
        run: |
          set +e
          yes | sdkmanager --licenses >/dev/null 2>&1
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Create Android platform
        run: |
          flutter config --no-analytics
          flutter create --platforms=android --org com.uberlike --project-name uberlikeapp .
          test -d android
      - name: Snapshot android folder
        run: cp -a android android.bak
      - name: Pub get
        run: flutter pub get
      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          for ROLE in user shop rider; do
            echo "::group::build $ROLE"
            python3 .github/scripts/patch_android.py "$ROLE"
            if ! flutter build apk --release --target="lib/main_${ROLE}.dart" 2>&1 | tee "${ROLE}-build.log"; then
              echo "::error::${ROLE} APK Gradle build failed"
              grep -E "What went wrong|A problem occurred|FAILURE:|error:|Error:|SDK location|ndkVersion|desugar|compileSdk|Unresolved|uses-sdk|minSdk" "${ROLE}-build.log" | tail -n 50 | while read -r line; do
                echo "::error::$line"
              done
              tail -n 80 "${ROLE}-build.log"
              exit 1
            fi
            test -f build/app/outputs/flutter-apk/app-release.apk
            cp build/app/outputs/flutter-apk/app-release.apk "dist/${ROLE}.apk"
            echo "::endgroup::"
          done
          ls -lh dist
      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: swiftdrop-apks
          path: dist/*.apk
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-logs
          path: "*-build.log"
      - name: Publish GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=swiftdrop-1.0.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/user.apk dist/shop.apk dist/rider.apk --clobber
          else
            gh release create "$TAG" dist/user.apk dist/shop.apk dist/rider.apk \
              --title "QuickBite — User, Shop, Rider APKs" \
              --notes "Same apps as the website. WhatsApp OTP, then User / Shop / Rider. https://quickbite-2ao.pages.dev"
          fi
      - name: Annotate failure
        if: failure()
        run: |
          for f in *-build.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -n 120 "$f"
            echo "::endgroup::"
            grep -E "Error:|FAILURE|error •|Unhandled|Gradle task|compilation|What went wrong|SDK location|ndkVersion|desugar" "$f" | tail -n 40 | while read -r line; do
              echo "::error::$line"
            done
          done
