name: uberlikeapp
description: Multi-role delivery live tracking — User, Shop, and Rider apps sharing one backend.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  geolocator: ^11.1.0
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.2
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.2
  url_launcher: ^6.3.1
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
